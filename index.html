/* ---------- live updates from the other phone ---------- */
function onRemoteChange(kind, value){
  if (kind==='household'){
    // Removed from the household by an owner: start again, which finds any others.
    if (!value.role){ try{ localStorage.removeItem('jamrit_household'); } catch(e){} location.reload(); return; }
    const roleChanged = value.role !== store.household.role;
    store.household = value;
    const mine = (store.households || []).find(o => o.id === value.id);
    if (mine){ mine.name = value.name; mine.role = value.role; }
    applyReadOnly();
    renderHouseholdName();
    if (settingsMenu.hidden) renderAccount();   // don't disturb a rename in progress
    if (householdOpen()) renderHouseholdSheet(roleChanged);
    if (roleChanged) renderAll();
    return;
  }
  if (kind==='schedule'){
    SCHEDULE = value;
    if (currentWeekIdx >= SCHEDULE.weeks.length) currentWeekIdx = SCHEDULE.weeks.length-1;
  } else if (kind==='rules'){
    RULES = value;
  } else if (kind==='meals'){
    MEALS = value;
  } else if (kind==='todos'){
    TODOS = value;
  } else {
    checked = value;
  }
  // Don't wipe out a half-typed task or rule; the form re-renders when it closes.
  if (addingInDay || editingTaskId || editingRuleId || editingMealDate || pastingPlan) return;
  renderAll();
}

/* ---------- mutations ---------- */
function toggleTask(id){
  const on = !checked[id];
  if (on) checked[id] = true; else delete checked[id];
  saveChecked([id], on); renderWeek();
}
function addTask(dayDate, task){
  const week = SCHEDULE.weeks[currentWeekIdx];
  const day = week.days.find(d=>d.date===dayDate);
  day.tasks.push({ id: uid(), person: task.person, task: task.task, minutes: task.minutes });
  week.edited = true;   // keep hand edits when the house rules change
  addingInDay = null;
  saveSchedule(); renderWeek();
}
function editTask(taskId, updates){
  const week = SCHEDULE.weeks[currentWeekIdx];
  for (const day of week.days){
    const t = day.tasks.find(t=>t.id===taskId);
    if (t){ Object.assign(t, updates); break; }
  }
  week.edited = true;
  editingTaskId = null;
  saveSchedule(); renderWeek();
}
function deleteTask(taskId, taskName){
  if (!confirm('Delete "'+taskName+'"?')) return;
  const week = SCHEDULE.weeks[currentWeekIdx];
  for (const day of week.days){
    const idx = day.tasks.findIndex(t=>t.id===taskId);
    if (idx>-1){ day.tasks.splice(idx,1); break; }
  }
  week.edited = true;
  const wasChecked = !!checked[taskId];
  delete checked[taskId];
  saveSchedule(); if (wasChecked) saveChecked([taskId], false); renderWeek();
}
function addNextWeek(){
  const weeks = SCHEDULE.weeks;
  const newWeek = generateWeek(addDays(weeks[weeks.length-1].week_start, 7), RULES);
  weeks.push(newWeek);
  saveSchedule();
  currentWeekIdx = weeks.length-1;
  currentYear = yearOf(newWeek);
  renderAll();
}

/* ---------- progress ---------- */
function computeWeekProgress(week){
  let jPlanned=0,aPlanned=0,bothPlanned=0,jDone=0,aDone=0,bothDone=0;
  week.days.forEach(day=>{
    day.tasks.forEach(t=>{
      const done = !!checked[t.id];
      if (t.person==='J'){ jPlanned+=t.minutes; if(done) jDone+=t.minutes; }
      else if (t.person==='A'){ aPlanned+=t.minutes; if(done) aDone+=t.minutes; }
      else { bothPlanned+=t.minutes; if(done) bothDone+=t.minutes; }
    });
  });
  return { jPlanned,aPlanned,bothPlanned,jDone,aDone,bothDone,
    jFull: jPlanned+bothPlanned, aFull: aPlanned+bothPlanned,
    jFullDone: jDone+bothDone, aFullDone: aDone+bothDone };
}

/* ---------- render: nav ---------- */
function renderYearChips(){
  const years = [...new Set(SCHEDULE.weeks.map(yearOf))].sort((a,b)=>a-b);
  if (currentYear===null || !years.includes(currentYear)) currentYear = years[years.length-1];
  document.getElementById('yearRow').classList.toggle('single', years.length < 2);
  document.getElementById('yearRow').innerHTML = years.map(y=>
    `<button class="yearchip ${y===currentYear?'active':''}" data-y="${y}">${y}</button>`
  ).join('');
  document.querySelectorAll('.yearchip').forEach(btn=>{
    btn.addEventListener('click', ()=>selectYear(parseInt(btn.dataset.y,10)));
  });
}
function weeksInYear(y){
  return SCHEDULE.weeks.map((w,i)=>i).filter(i=>yearOf(SCHEDULE.weeks[i])===y);
}
function selectYear(y){
  currentYear = y;
  const idxToday = findCurrentWeekIndex();
  const inYear = weeksInYear(y);
  if (inYear.includes(idxToday)) currentWeekIdx = idxToday;
  else currentWeekIdx = inYear.length ? inYear[0] : -1;
  renderAll();
}
function renderWeekNav(){
  const inYear = weeksInYear(currentYear);
  if (currentWeekIdx === -1 || !inYear.length){
    document.getElementById('weekNavRow').style.display = 'none';
    document.getElementById('balanceRow').style.display = 'none';
    return;
  }
  document.getElementById('weekNavRow').style.display = '';
  document.getElementById('balanceRow').style.display = '';
  const week = SCHEDULE.weeks[currentWeekIdx];
  document.getElementById('weekRange').textContent = fmtRange(week);
  document.getElementById('weekRot').textContent = 'Rotation week ' + week.rotation_week + ' · ' + currentYear;

  const posInYear = inYear.indexOf(currentWeekIdx);
  const prevBtn = document.getElementById('prevWeek');
  prevBtn.disabled = posInYear<=0;
  prevBtn.onclick = ()=>{ todayOnly && setTodayOnly(false); currentWeekIdx = inYear[posInYear-1]; renderAll(); };

  const nextBtn = document.getElementById('nextWeek');
  const isLastOverall = currentWeekIdx === SCHEDULE.weeks.length-1;
  if (posInYear < inYear.length-1){
    nextBtn.textContent = '›'; nextBtn.disabled = false; nextBtn.classList.remove('addweek');

    nextBtn.onclick = ()=>{ todayOnly && setTodayOnly(false); addNextWeek(); };
  } else {
    nextBtn.textContent = '›'; nextBtn.disabled = true; nextBtn.classList.remove('addweek');
  }
}

let statsRange = 'week';
// Totals for a set of days. "Both" chores count for each person, as on the balance bar.
function tallyDays(days){
  const t = { J:{ planned:0, done:0, tasks:0, ticked:0 }, A:{ planned:0, done:0, tasks:0, ticked:0 } };
  days.forEach(d => d.tasks.forEach(task => {
    const who = task.person === 'BOTH' ? ['J','A'] : [task.person];
    who.forEach(p => {
      if (!t[p]) return;
      t[p].planned += task.minutes; t[p].tasks++;
      if (checked[task.id]){ t[p].done += task.minutes; t[p].ticked++; }
    });
  }));
  return t;
}
function statCardHTML(name, colour, s){
  const pct = s.planned ? Math.round(100 * s.done / s.planned) : 0;
  return `<div class="stat-card">
    <div class="who"><span class="dot" style="background:var(${colour})"></span>${name}</div>
    <div class="big">${s.done}m <small>/ ${s.planned}m</small></div>
    <div class="meter"><span style="width:${pct}%;background:var(${colour})"></span></div>
    <div class="sub">${pct}% done · ${s.ticked} of ${s.tasks} chores</div>
  </div>`;
}
// Stacked bars of minutes done by each person, one column per group of days.
function barsHTML(groups){
  const max = Math.max(1, ...groups.map(g => g.t.J.done + g.t.A.done));
  return `<div class="bars">${groups.map(g => `<div class="col ${g.now?'now':''}">
      <span class="val mono">${g.t.J.done + g.t.A.done}m</span>

    <div class="legend"><span><span class="dot" style="background:var(--joshua)"></span>Joshua</span><span><span class="dot" style="background:var(--amrit)"></span>Amrit</span><span>Minutes done</span></div>`;
}
function renderStats(){
  const week = SCHEDULE.weeks[currentWeekIdx];
  if (!week) return;
  const today = todayStr();
  let days, groups, range;
  if (statsRange === 'week'){
    days = week.days;
    range = fmtRange(week);
    groups = week.days.map(d => ({ label: d.dow.charAt(0) + d.dow.slice(1).toLowerCase(), t: tallyDays([d]), now: d.date === today }));
  } else {
    const month = week.days[3].date.slice(0, 7);   // the month most of this week falls in
    const weeks = SCHEDULE.weeks.filter(w => w.days.some(d => d.date.startsWith(month)));
    days = weeks.flatMap(w => w.days.filter(d => d.date.startsWith(month)));

// A liquid-glass segmented control. The selection is two edges (left, right), each on its own
// spring. The edge moving in the direction of travel is stiff and the trailing edge soft, so the
// drop stretches, then squashes as the back catches up. Both springs are under-damped, so it
// settles with a small bounce. Used by the bottom bar, This week / House rules and Week / Month.
//   bar:      the container; buttons inside it are the options
//   mark:     (button, isSelected) => update its selected state (class / aria)
//   colourFor:(index) => CSS colour that tints the drop
//   onSelect: (index) => called when the user picks a different option
function createLiquid(bar, { tabs, mark, colourFor = () => 'var(--ink)', onSelect = () => {} }){
  for (const cls of ['liquid', 'hover-glow']){
    if (!bar.querySelector('.' + cls)){
      const s = document.createElement('span'); s.className = cls; s.setAttribute('aria-hidden', 'true'); bar.prepend(s);
    }
  }
  const liquid = bar.querySelector('.liquid');
  const glow = bar.querySelector('.hover-glow');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const LEAD = { k: 620, c: 28 }, TRAIL = { k: 240, c: 19 }, GLOW = { k: 420, c: 34 };
  const MIN_W = 28;

  const spring = x => ({ x, v: 0, t: x });
  let drop = { L: spring(0), R: spring(0), rest: 0 };
  let hov = { L: spring(0), R: spring(0) };
  let active = Math.max(0, tabs.findIndex(t => t.classList.contains('active') || t.classList.contains('sel') || t.getAttribute('aria-checked') === 'true'));
  let lean = 0, pressed = null, dragging = false, swallowClick = false, raf = 0, last = 0;

  const padOf = () => parseFloat(getComputedStyle(bar).getPropertyValue('--pad')) || 5;
  const span = i => { const b = bar.getBoundingClientRect(), t = tabs[i].getBoundingClientRect(); return { l: t.left - b.left, r: t.right - b.left }; };
  const nearest = x => {
    let best = 0, d = Infinity;
    tabs.forEach((_, i) => { const s = span(i), m = Math.abs((s.l + s.r) / 2 - x); if (m < d){ d = m; best = i; } });
    return best;
  };
  const localX = e => e.clientX - bar.getBoundingClientRect().left;

  function aim(l, r){ drop.L.t = l; drop.R.t = r; drop.rest = r - l; kick(); }
  function aimTab(i){ if (i < 0) return; const s = span(i); aim(s.l + lean, s.r + lean); }
  function stepSpring(s, p, dt){ const a = p.k * (s.t - s.x) - p.c * s.v; s.v += a * dt; s.x += s.v * dt; }
  const settled = s => Math.abs(s.t - s.x) < 0.05 && Math.abs(s.v) < 0.05;

  function frame(now){
    const dt = Math.min((now - last) / 1000 || 1 / 60, 1 / 30);
    last = now;
    const sub = 4, h = dt / sub, pad = padOf();
    for (let n = 0; n < sub; n++){
      const dir = (drop.L.t + drop.R.t) - (drop.L.x + drop.R.x);
      stepSpring(drop.L, dir < 0 ? LEAD : TRAIL, h);
      stepSpring(drop.R, dir > 0 ? LEAD : TRAIL, h);
      // The bar's ends are walls: an overshooting edge squashes against them.
      const lo = pad, hi = bar.clientWidth - pad;
      if (drop.L.x < lo){ drop.L.x = lo; drop.L.v = Math.max(0, drop.L.v); }
      if (drop.R.x > hi){ drop.R.x = hi; drop.R.v = Math.min(0, drop.R.v); }
      if (drop.R.x - drop.L.x < MIN_W){ const mid = (drop.L.x + drop.R.x) / 2; drop.L.x = mid - MIN_W / 2; drop.R.x = mid + MIN_W / 2; }
      stepSpring(hov.L, GLOW, h); stepSpring(hov.R, GLOW, h);
    }
    render();
    if ([drop.L, drop.R, hov.L, hov.R].every(settled)){ raf = 0; return; }
    raf = requestAnimationFrame(frame);
  }
  function render(){
    const w = drop.R.x - drop.L.x;
    const stretch = w / (drop.rest || w);
    // Keep the drop's "volume": wider gets thinner, narrower gets taller.
    const sy = Math.max(0.74, Math.min(1.12, 1 - (stretch - 1) * 0.38));
    liquid.style.width = w + 'px';
    liquid.style.transform = `translate3d(${drop.L.x}px,0,0) scaleY(${sy})`;
    glow.style.width = (hov.R.x - hov.L.x) + 'px';
    glow.style.transform = `translate3d(${hov.L.x}px,0,0)`;
  }
  function kick(){
    // No animation frames while hidden or with reduced motion: jump straight to the target.
    if (reduceMotion.matches || document.hidden){
      for (const s of [drop.L, drop.R, hov.L, hov.R]){ s.x = s.t; s.v = 0; }
      render(); return;
    }
    if (!raf){ last = performance.now(); raf = requestAnimationFrame(frame); }
  }
  // Put the drop straight onto the selected option (first show, resize, fonts loading).
  function snap(){
    if (!bar.offsetWidth || active < 0) return;
    const s = span(active);
    drop = { L: spring(s.l), R: spring(s.r), rest: s.r - s.l };
    hov = { L: spring(s.l), R: spring(s.r) };
    render();
  }

  // select(-1) clears the selection and hides the drop (e.g. no header tab while on House rules).
  function select(i, { focus = false, quiet = false } = {}){
    if (i < 0){
      tabs.forEach((t, n) => { mark(t, false); t.tabIndex = n === 0 ? 0 : -1; });
      active = -1;
      liquid.style.opacity = '0';
      return;
    }
    i = Math.min(tabs.length - 1, i);
    const changed = i !== active;
    const wasEmpty = active < 0;
    tabs.forEach((t, n) => { mark(t, n === i); t.tabIndex = n === i ? 0 : -1; });
    active = i;
    liquid.style.setProperty('--lc', colourFor(i));
    if (wasEmpty){ liquid.style.opacity = ''; snap(); }   // appear in place rather than slide from a stale spot
    else if (bar.offsetWidth) aimTab(i);   // hidden (e.g. a closed sheet): placed by snap() when shown
    if (focus) tabs[i].focus();
    if (changed && !quiet){
      const tab = tabs[i];
      tab.classList.remove('pop'); void tab.offsetWidth; tab.classList.add('pop');
      onSelect(i);
    }
  }

  tabs.forEach((t, i) => t.addEventListener('click', () => {
    if (swallowClick){ swallowClick = false; return; }
    select(i);
  }));
  bar.addEventListener('keydown', e => {
    const i = tabs.indexOf(document.activeElement);
    if (i < 0) return;
    const to = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1 }[e.key];
    if (to === undefined) return;
    e.preventDefault();
    select(to, { focus: true });
  });

  // Hover lean and glow with a mouse; press and drag to slide the drop along the bar.
  bar.addEventListener('pointermove', e => {
    const x = localX(e);
    bar.style.setProperty('--mx', x + 'px');
    if (pressed && !dragging && Math.abs(e.clientX - pressed.x) > 6){ dragging = true; bar.setPointerCapture(e.pointerId); }
    if (dragging){
      const pad = padOf(), w = drop.rest || span(active).r - span(active).l;
      const c = Math.max(pad + w / 2, Math.min(bar.clientWidth - pad - w / 2, x));
      aim(c - w / 2, c + w / 2);
      const s = span(nearest(x)); hov.L.t = s.l; hov.R.t = s.r;
      return;
    }
    if (e.pointerType === 'mouse'){
      bar.classList.add('is-hovering');
      const s = span(nearest(x));
      hov.L.t = s.l; hov.R.t = s.r;
      if (active >= 0){
        const a = span(active);
        lean = Math.max(-9, Math.min(9, (x - (a.l + a.r) / 2) * 0.07));   // surface tension pulls toward the cursor
        aimTab(active);
      } else kick();
    }
  });
  bar.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    pressed = { x: e.clientX };
    const s = span(nearest(localX(e)));
    hov.L.t = s.l; hov.R.t = s.r;
    if (e.pointerType !== 'mouse'){ hov.L.x = s.l; hov.R.x = s.r; }
    kick();
  });
  const endPress = e => {
    if (dragging){
      swallowClick = e.type === 'pointerup';
      setTimeout(() => { swallowClick = false; }, 0);
      lean = 0;
      select(nearest(localX(e)));
      aimTab(active);
    }
    pressed = null; dragging = false;
  };
  bar.addEventListener('pointerup', endPress);
  bar.addEventListener('pointercancel', endPress);
  bar.addEventListener('pointerleave', () => {
    if (dragging) return;
    bar.classList.remove('is-hovering');
    lean = 0;
    aimTab(active);
  });

  const ro = window.ResizeObserver ? new ResizeObserver(snap) : null;
  if (ro) ro.observe(bar);
  window.addEventListener('resize', snap);   // e.g. rotating the phone
  document.fonts && document.fonts.ready.then(snap);
  liquid.style.setProperty('--lc', colourFor(Math.max(0, active)));
  snap();
  // For pickers inside forms that get rebuilt: stop watching the old element.
  function destroy(){ if (ro) ro.disconnect(); window.removeEventListener('resize', snap); if (raf) cancelAnimationFrame(raf); }
  return { select, snap, destroy };
}

// Person pickers (task form, rule form, to-do) as liquid glass. Their buttons keep the
// existing .sel + person classes, so the form code reading them is unchanged.
const PICK_COLOUR = { J:'var(--joshua)', A:'var(--amrit)', BOTH:'var(--both)', ALT:'var(--ink)', ANY:'var(--ink)' };
function liquidPicker(group, onPick){
  const tabs = [...group.querySelectorAll('.pbtn')];

    tabs,

      if (on) t.classList.add('sel', t.dataset.p);

    },
    colourFor: i => PICK_COLOUR[tabs[i].dataset.p] || 'var(--ink)',
    onSelect: i => onPick && onPick(tabs[i].dataset.p),

}

// Liquid hover: track the pointer over any single glass button so its light follows it.
const LIQUID_HOVER = '.rules-link, .addbtn, .btn-primary, .weeknav .navbtn, .todayonly, .iconbtn, .dinner-banner, .meal-row, .themeopt, .daycard .dayhead, .menu .signout, .yearchip, .balance, #weekLabel, .stat-card, .bars .col';
function trackLiquidHover(e){
  const el = e.target.closest && e.target.closest(LIQUID_HOVER);
  if (!el) return;
  const r = el.getBoundingClientRect();
  el.style.setProperty('--hx', (e.clientX - r.left) + 'px');
  el.style.setProperty('--hy', (e.clientY - r.top) + 'px');
}
document.addEventListener('pointermove', trackLiquidHover, { passive: true });
document.addEventListener('pointerdown', trackLiquidHover, { passive: true });

function wireTaskForm(container){
  container.querySelectorAll('.taskform').forEach(form=>{
    const dayDate = form.dataset.day;
    const editingId = form.dataset.editing || null;
    let selPerson = form.querySelector('.pbtn.sel')?.dataset.p || 'J';
    form.querySelectorAll('.pbtn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        form.querySelectorAll('.pbtn').forEach(b=>{ b.classList.remove('sel','J','A','BOTH'); });
        btn.classList.add('sel', btn.dataset.p);
        selPerson = btn.dataset.p;
      });
    });
    form.querySelector('.cancelform').addEventListener('click', ()=>{
      addingInDay = null; editingTaskId = null; renderWeek();
    });
    form.querySelector('.saveform').addEventListener('click', ()=>{
      const name = form.querySelector('.fname').value.trim();
      const minutes = parseInt(form.querySelector('.fmin').value, 10);
      if (!name || !minutes || minutes<=0){ form.querySelector('.fname').focus(); return; }
      selPerson = form.querySelector('.pbtn.sel')?.dataset.p || selPerson;   // also catches a drag along the picker
      if (editingId){ editTask(editingId, { task:name, person:selPerson, minutes }); }
      else { addTask(dayDate, { task:name, person:selPerson, minutes }); }
    });
  });
  attachPickers('week', container);
}

function renderWeek(){

  renderWeekNav();
  renderBalance();
  const inYear = weeksInYear(currentYear);

  if (!inYear.length || currentWeekIdx===-1){

  }
  const week = SCHEDULE.weeks[currentWeekIdx];
  const todays = week.days.filter(d => d.date === todayStr());
  const showToday = todayOnly && todays.length > 0;
  const days = showToday ? todays : week.days;
  const totalTasks = days.reduce((a,d)=>a+visibleTasks(d).length,0);
  updateDock();
  container.innerHTML = dinnerBannerHTML(week) + days.map(d=>dayCardHTML(week,d)).join('') +
    `<div class="weekfoot"><span>${totalTasks} tasks ${showToday ? 'today' : 'this week'}</span>

       ? '<button class="resetlink" id="showWeek">Show the whole week</button>'
       : '<button class="resetlink" id="resetWeek">Uncheck this week</button>'}</div>

      <span class="chev" aria-hidden="true">›</span>
    </button>`;

  document.getElementById('openRules').addEventListener('click', () => { setTab('rules'); renderRules(); });
  const banner = document.getElementById('dinnerBanner');
  if (banner) banner.addEventListener('click', () => headerTabs.select(1));
  const showWeek = document.getElementById('showWeek');
  if (showWeek) showWeek.addEventListener('click', ()=> setTodayOnly(false));
  container.querySelectorAll('.dayhead').forEach(h=> h.addEventListener('click', ()=>{
    const d = h.dataset.day;
    if (toggledDays[d]) delete toggledDays[d]; else toggledDays[d] = true;
    renderWeek();
  }));

  container.querySelectorAll('.check').forEach(cb=> cb.addEventListener('change', ()=>toggleTask(cb.dataset.id)));
  container.querySelectorAll('.addbtn').forEach(btn=> btn.addEventListener('click', ()=>{ addingInDay = btn.dataset.day; editingTaskId=null; renderWeek(); }));
  container.querySelectorAll('.iconbtn.edit').forEach(btn=> btn.addEventListener('click', ()=>{ editingTaskId = btn.dataset.id; addingInDay=null; renderWeek(); }));
  container.querySelectorAll('.iconbtn.del').forEach(btn=> btn.addEventListener('click', ()=> deleteTask(btn.dataset.id, btn.dataset.name)));

    week.days.forEach(day=> day.tasks.forEach(t=>{ if (checked[t.id]){ ids.push(t.id); delete checked[t.id]; } }));
    saveChecked(ids, false); renderWeek();
  });
}

const FREQ_LABEL = { daily:'Every day', 'alt-days':'Every other day', weekly:'Weekly', fortnightly:'Every 2 weeks' };

function ruleSummary(r){
  const who = r.who==='ALT' ? `Take turns (${r.first==='A'?'Amrit':'Joshua'} first)` : WHO_LABEL[r.who];
  let when = FREQ_LABEL[r.freq];
  if (r.freq==='weekly' || r.freq==='fortnightly') when += ' · ' + DOW_NAME[r.day];
  if (r.freq==='fortnightly') when += r.weeks ? ' (weeks 2 & 4)' : ' (weeks 1 & 3)';
  return who + ' · ' + when;
}

function wireRuleForm(form){
  let who = form.querySelector('.pbtn.sel')?.dataset.p || 'J';
  const q = s => form.querySelector(s);
  // Only show the fields that matter for the chosen frequency and person.
  function sync(){
    const f = q('.rf-freq').value;
    q('.rf-day-wrap').hidden = !(f==='weekly' || f==='fortnightly');
    q('.rf-weeks-wrap').hidden = f!=='fortnightly';
    q('.rf-altdays-wrap').hidden = f!=='alt-days';
    q('.rf-first-wrap').hidden = who!=='ALT';
  }
  formPickers.rules.forEach(p => p.destroy());
  formPickers.rules = [liquidPicker(q('.persongroup'), p => { who = p; sync(); })];
  q('.rf-freq').addEventListener('change', sync);
  sync();
  q('.rf-cancel').addEventListener('click', ()=>{ editingRuleId = null; renderRules(); renderWeek(); });
  q('.rf-save').addEventListener('click', ()=>{
    const chore = q('.rf-chore').value.trim();
    const minutes = parseInt(q('.rf-min').value, 10);
    if (!chore){ q('.rf-chore').focus(); return; }
    if (!minutes || minutes<=0){ q('.rf-min').focus(); return; }
    const freq = q('.rf-freq').value;
    const rule = { id: form.dataset.id==='new' ? 'r_' + uid().slice(2) : form.dataset.id,
      chore, area: q('.rf-area').value.trim() || 'Other', minutes, who, freq };
    if (freq==='weekly' || freq==='fortnightly') rule.day = q('.rf-day').value;
    if (freq==='fortnightly') rule.weeks = parseInt(q('.rf-weeks').value, 10);
    if (freq==='alt-days') rule.weeks = parseInt(q('.rf-altdays').value, 10);
    if (who==='ALT') rule.first = q('.rf-first').value;
    const notes = q('.rf-notes').value.trim();
    if (notes) rule.notes = notes;
    const next = form.dataset.id==='new' ? [...RULES, rule] : RULES.map(r => r.id===rule.id ? rule : r);
    applyRules(next);
  });
}
function deleteRule(id){
  const r = RULES.find(x=>x.id===id);
  if (!r || !confirm('Remove "'+r.chore+'" from the house rules? It stops appearing from next week.')) return;
  applyRules(RULES.filter(x=>x.id!==id));
}
async function applyRules(next){
  const old = RULES;
  RULES = next;
  editingRuleId = null;
  regenerateFutureWeeks(old);
  renderRules(); renderWeek();
  setSyncNote('Saving…');
  try{ await store.saveRules(RULES); await store.saveSchedule(SCHEDULE); setSyncNote(savedNote()); }
  catch(e){ console.error(e); setSyncNote("Couldn't save. Check your connection."); }
}

function addTodo(){

  const text = input.value.trim();
  if (!text){ input.focus(); return; }
  saveTodo(uid(), { text, who: todoWho, done: false, at: Date.now() });
  input.value = '';
  input.focus();
}
function toggleTodo(id){
  const t = TODOS[id];
  if (t) saveTodo(id, { ...t, done: !t.done, doneAt: t.done ? null : Date.now() });
}
function clearDoneTodos(){
  Object.keys(TODOS).filter(id => TODOS[id].done).forEach(id => saveTodo(id, null));
}
function todoVisible(t){
  // The bottom switcher filters to-dos too: yours, shared ones and ones for anyone.
  return personFilter === 'ALL' || t.who === personFilter || t.who === 'BOTH' || t.who === 'ANY';
}
function todoAge(ms){
  const days = Math.floor((Date.now() - ms) / 864e5);
  if (days <= 0) return 'Added today';
  if (days === 1) return 'Added yesterday';
  if (days < 7) return `Added ${days} days ago`;
  return 'Added ' + new Date(ms).toLocaleDateString('en-GB', { day:'numeric', month:'short' });
}
function todoRowHTML(id, t){
  const badge = t.who === 'ANY' ? '' : `<span class="who-badge ${t.who}">${PERSON_NAME[t.who]}</span>`;
  return `<li class="taskrow ${t.done ? 'done' : ''}">
    <input type="checkbox" class="check" data-todo="${id}" ${t.done ? 'checked' : ''} aria-label="Done: ${escapeAttr(t.text)}">
    <div class="tasktext">
      <div class="taskname">${escapeHTML(t.text)}</div>
      <div class="taskmeta">${badge}<span class="taskmin">${t.done && t.doneAt ? 'Done ' + new Date(t.doneAt).toLocaleDateString('en-GB', { day:'numeric', month:'short' }) : todoAge(t.at)}</span></div>
    </div>
    <div class="rowactions"><button class="iconbtn del" data-todo-del="${id}" title="Delete">✕</button></div>
  </li>`;
}
function renderTodos(){
  const list = document.getElementById('todoList');
  const all = Object.entries(TODOS).filter(([, t]) => todoVisible(t));
  const open = all.filter(([, t]) => !t.done).sort((a, b) => b[1].at - a[1].at);           // newest first
  const done = all.filter(([, t]) => t.done).sort((a, b) => (b[1].doneAt || 0) - (a[1].doneAt || 0));
  const openHTML = open.length
    ? `<ul class="tasks">${open.map(([id, t]) => todoRowHTML(id, t)).join('')}</ul>`
    : `<div class="todo-empty">${all.length ? 'All done. Nice work!' : 'Nothing on the list. Add anything that needs doing above.'}</div>`;
  const doneHTML = done.length ? `<div class="daycard todo-done ${showDoneTodos ? '' : 'collapsed'}">
      <button type="button" class="dayhead" id="todoDoneToggle" aria-expanded="${showDoneTodos}">
        <div><div class="dname">Done</div></div>
        <div class="dmeta"><div class="pill mono">${done.length}</div></div>
        <span class="chev" aria-hidden="true">›</span>
      </button>
      <ul class="tasks">${done.map(([id, t]) => todoRowHTML(id, t)).join('')}
        <li class="addrow"><button type="button" class="resetlink" id="todoClear">Clear done items</button></li></ul>
    </div>` : '';
  list.innerHTML = `<div class="daycard todo-open">${openHTML}</div>${doneHTML}`;
  list.querySelectorAll('[data-todo]').forEach(cb => cb.addEventListener('change', () => toggleTodo(cb.dataset.todo)));
  list.querySelectorAll('[data-todo-del]').forEach(b => b.addEventListener('click', () => saveTodo(b.dataset.todoDel, null)));
  const tg = document.getElementById('todoDoneToggle');
  if (tg) tg.addEventListener('click', () => { showDoneTodos = !showDoneTodos; renderTodos(); });
  const clr = document.getElementById('todoClear');
  if (clr) clr.addEventListener('click', clearDoneTodos);
  const n = Object.values(TODOS).filter(t => !t.done).length;
  document.getElementById('tabTodo').textContent = n ? `To-do ${n}` : 'To-do';
}

// Reads a week's plan pasted from ChatGPT (or typed). A line that starts with a day fills that
// day ("Monday: Chicken fajitas", "**Tue** – Pasta (pasta, tomatoes, basil)"); the lines under
// it are ingredients ("- 2 peppers", "Ingredients: rice, peas"). A "Shopping list" heading ends it.
const PLAN_DAY = { mon:0, tue:1, tues:1, wed:2, weds:2, thu:3, thur:3, thurs:3, fri:4, sat:5, sun:6 };
function parsePlan(text){
  const out = {};
  let cur = null;
  const splitList = s => s.split(/[,;]/).map(x => x.trim()).filter(Boolean);
  for (const raw of text.split(/\r?\n/)){
    const line = raw.replace(/[*_#>`]/g, '').trim();
    if (!line) continue;
    if (/^(shopping|grocery|groceries)\b/i.test(line)){ cur = null; continue; }
    const m = line.match(/^(?:[-•\d.)\s]*)(mon|tues?|weds?|wed|thurs?|thu|fri|sat|sun)[a-z]*\b\.?\s*(?:\(.*?\)\s*)?[:\-–—|]*\s*(.*)$/i);
    if (m){
      cur = PLAN_DAY[m[1].toLowerCase()];
      let name = m[2].replace(/^(dinner|tea|supper|meal)\s*[:\-–—]\s*/i, '').trim();
      let ingredients = [];
      const withIng = name.match(/^(.*?)\s*(?:[(\[](.+)[)\]]\s*$|[-–—|]\s*ingredients?\s*[:\-–—]?\s*(.+)$|\bingredients?\s*[:\-–—]\s*(.+)$)/i);
      if (withIng){ name = withIng[1].replace(/[\s\-–—:|]+$/, ''); ingredients = splitList(withIng[2] || withIng[3] || withIng[4]); }
      out[cur] = { name, ingredients };
      continue;
    }
    if (cur === null) continue;
    const item = line.replace(/^(?:[-•*]\s*|\d+[.)]\s+)/, '').trim();   // drop bullets and "1." numbering, keep quantities like "4 chicken thighs"
    let mm;
    if ((mm = item.match(/^(dinner|meal|tea|supper)\s*[:\-–—]\s*(.+)$/i))) out[cur].name = mm[2].trim();
    else if ((mm = item.match(/^ingredients?\s*[:\-–—]?\s*(.*)$/i))) out[cur].ingredients.push(...splitList(mm[1]));
    else if (!out[cur].name) out[cur].name = item;
    else out[cur].ingredients.push(item);
  }
  Object.keys(out).forEach(k => { if (!out[k].name && !out[k].ingredients.length) delete out[k]; });
  return out;
}

  return `<div class="rule-card tonight">

    ${next && next.name ? `<div class="tonight-next">Tomorrow: <strong>${escapeHTML(next.name)}</strong></div>` : ''}
  </div>`;
}

      <div class="lbl">Who's cooking</div>
      <div class="persongroup">${opt('ANY','Anyone')}${opt('J','Joshua')}${opt('A','Amrit')}${opt('BOTH','Both')}</div>
      <label class="lbl">Ingredients <span class="hint">one per line</span>
        <textarea class="me-ing" rows="4" placeholder="Chicken thighs&#10;2 peppers&#10;Tortillas">${escapeHTML(((m && m.ingredients) || []).map(i => i.text).join('\n'))}</textarea></label>
      <label class="lbl">Notes or recipe link<input type="text" class="me-notes" value="${escapeAttr((m && m.notes) || '')}" placeholder="Optional"></label>
      <div class="formbtns">
        ${m ? '<button type="button" class="btn-text me-clear">Remove</button>' : ''}
        <button type="button" class="btn-text me-cancel">Cancel</button>
        <button type="button" class="btn-primary me-save">Save</button>
      </div>
    </li>`;
  }
  const cook = m && COOK_TEXT[m.cook] ? `<span class="who-badge ${m.cook}">${PERSON_NAME[m.cook]}</span>` : '';
  const count = m && m.ingredients && m.ingredients.length ? `<span class="taskmin">${m.ingredients.length} ingredients</span>` : '';
  return `<li><button type="button" class="meal-row ${isToday ? 'is-today' : ''}" data-date="${date}">
    <span class="meal-day"><span class="md-name">${shortDay(date, { weekday:'short' })}</span><span class="md-date mono">${shortDay(date, { day:'numeric' })}</span></span>
    <span class="meal-main">
      ${m && m.name ? `<span class="meal-name">${escapeHTML(m.name)}</span>` : '<span class="meal-name muted">Plan dinner</span>'}
      ${cook || count ? `<span class="taskmeta">${cook}${count}</span>` : ''}
    </span>
    <span class="chev" aria-hidden="true">›</span>
  </button></li>`;
}
// Ingredients still to buy for the rest of the week (the whole week when looking ahead),
// merged across meals so "Onions" for two dinners shows once.
function shoppingItems(){
  const today = todayStr();
  const dates = mealDates().filter(d => mealWeekStart !== mondayOf(today) || d >= today);
  const map = new Map();
  dates.forEach(date => {
    const m = MEALS[date];
    if (!m || !m.ingredients) return;
    m.ingredients.forEach((ing, idx) => {
      const key = ing.text.trim().toLowerCase();
      if (!key) return;
      if (!map.has(key)) map.set(key, { text: ing.text.trim(), meals: [], refs: [] });
      const e = map.get(key);
      if (m.name && !e.meals.includes(m.name)) e.meals.push(m.name);
      e.refs.push({ date, idx, got: !!ing.got });
    });
  });
  return [...map.values()].map(e => ({ ...e, got: e.refs.every(r => r.got) }));
}
function shoppingHTML(){
  const items = shoppingItems();
  const toBuy = items.filter(i => !i.got), bought = items.filter(i => i.got);
  const row = (i, n) => `<li class="taskrow ${i.got ? 'done' : ''}">
    <input type="checkbox" class="check" data-shop="${n}" ${i.got ? 'checked' : ''} aria-label="Bought ${escapeAttr(i.text)}">
    <div class="tasktext"><div class="taskname">${escapeHTML(i.text)}</div>${i.meals.length ? `<div class="taskmeta"><span class="taskmin">For ${escapeHTML(i.meals.join(', '))}</span></div>` : ''}</div>
  </li>`;
  const ordered = [...toBuy, ...bought];
  return `<div class="daycard shop">
    <div class="dayhead shop-head">
      <div><div class="dname">Shopping list</div><div class="ddate">${toBuy.length ? `${toBuy.length} to buy` : items.length ? 'All bought' : 'Add ingredients to meals and they show up here'}</div></div>
      ${toBuy.length ? '<button type="button" class="btn-text shop-copy">Copy</button>' : ''}
    </div>
    ${ordered.length ? `<ul class="tasks">${toBuy.map(i => row(i, ordered.indexOf(i))).join('')}
      ${bought.length ? `<li class="addrow"><button type="button" class="resetlink shop-bought">${showBought ? 'Hide' : 'Show'} ${bought.length} bought</button></li>` : ''}
      ${showBought ? bought.map(i => row(i, ordered.indexOf(i))).join('') : ''}</ul>` : ''}
  </div>`;
}
function pasteHTML(){
  if (!pastingPlan) return `<button type="button" class="addbtn paste-open">Paste a plan from ChatGPT</button>`;
  return `<div class="rule-card paste-card">
    <div class="dname">Paste a plan</div>
    <p class="rules-intro">Paste the week from ChatGPT. Each line starting with a day fills that day, and the bullet points under it become ingredients. It fills ${escapeHTML(fmtRange({ week_start: mealWeekStart, week_end: addDays(mealWeekStart, 6) }))}.</p>
    <textarea id="planText" rows="8" placeholder="Monday: Chicken fajitas&#10;- chicken thighs&#10;- peppers&#10;Tuesday: Spaghetti bolognese (mince, spaghetti, passata)"></textarea>
    <div class="plan-preview" id="planPreview"></div>
    <div class="formbtns"><button type="button" class="btn-text paste-cancel">Cancel</button><button type="button" class="btn-primary paste-apply">Fill the week</button></div>
  </div>`;
}
function renderMeals(){
  if (!mealWeekStart) mealWeekStart = mondayOf(todayStr());
  const view = document.getElementById('mealsView');
  const isThisWeek = mealWeekStart === mondayOf(todayStr());
  view.innerHTML = `${tonightHTML()}
    <div class="weeknav meal-weekbar">
      <button class="navbtn" id="mealPrev" aria-label="Previous week">‹</button>
      <div class="weeklabel"><div class="range">${escapeHTML(fmtRange({ week_start: mealWeekStart, week_end: addDays(mealWeekStart, 6) }))}</div>
        <div class="rot">${isThisWeek ? 'This week' : mealWeekStart > mondayOf(todayStr()) ? 'Coming up' : 'Past week'}</div></div>
      <button class="navbtn" id="mealNext" aria-label="Next week">›</button>
    </div>
    <div class="daycard meal-days"><ul class="tasks">${mealDates().map(mealRowHTML).join('')}</ul></div>
    ${pasteHTML()}
    ${shoppingHTML()}`;

  view.querySelector('#mealPrev').addEventListener('click', () => { mealWeekStart = addDays(mealWeekStart, -7); editingMealDate = null; renderMeals(); });
  view.querySelector('#mealNext').addEventListener('click', () => { mealWeekStart = addDays(mealWeekStart, 7); editingMealDate = null; renderMeals(); });
  view.querySelectorAll('.meal-row, [data-plan]').forEach(b => b.addEventListener('click', () => {
    editingMealDate = b.dataset.date || b.dataset.plan; renderMeals();
    const input = view.querySelector('.me-name'); if (input) input.focus();
  }));

  const ed = view.querySelector('.meal-edit');
  formPickers.meals = (formPickers.meals || []).filter(p => { p.destroy(); return false; });
  if (ed){
    const date = ed.dataset.date;
    formPickers.meals = [liquidPicker(ed.querySelector('.persongroup'))];
    const q = s => ed.querySelector(s);
    q('.me-cancel').addEventListener('click', () => { editingMealDate = null; renderMeals(); });
    const clear = q('.me-clear');
    if (clear) clear.addEventListener('click', () => { editingMealDate = null; saveMeal(date, null); renderMeals(); renderWeek(); });
    q('.me-save').addEventListener('click', () => {
      const name = q('.me-name').value.trim();
      const before = (MEALS[date] && MEALS[date].ingredients) || [];
      const ingredients = q('.me-ing').value.split('\n').map(s => s.replace(/^[-•*\s]+/, '').trim()).filter(Boolean)
        .map(text => ({ text, got: !!(before.find(b => b.text.toLowerCase() === text.toLowerCase()) || {}).got }));
      const cook = ed.querySelector('.pbtn.sel')?.dataset.p || 'ANY';
      const notes = q('.me-notes').value.trim();
      editingMealDate = null;
      saveMeal(date, name || ingredients.length ? { name, cook, ingredients, notes } : null);
      renderMeals(); renderWeek();
    });
    q('.me-name').addEventListener('keydown', e => { if (e.key === 'Enter') q('.me-save').click(); });
  }

  const open = view.querySelector('.paste-open');
  if (open) open.addEventListener('click', () => { pastingPlan = true; renderMeals(); view.querySelector('#planText').focus(); });
  const planText = view.querySelector('#planText');
  if (planText){
    const preview = () => {
      const plan = parsePlan(planText.value);
      const days = Object.keys(plan).sort().map(k => `<li><strong>${DOW_NAME[DOWS[k]].slice(0,3)}</strong> ${escapeHTML(plan[k].name || '—')}${plan[k].ingredients.length ? ` <span class="taskmin">· ${plan[k].ingredients.length} ingredients</span>` : ''}</li>`);
      view.querySelector('#planPreview').innerHTML = days.length ? `<ul>${days.join('')}</ul>` : '';
    };
    planText.addEventListener('input', preview);
    view.querySelector('.paste-cancel').addEventListener('click', () => { pastingPlan = false; renderMeals(); });
    view.querySelector('.paste-apply').addEventListener('click', () => {
      const plan = parsePlan(planText.value);
      const keys = Object.keys(plan);
      if (!keys.length){ planText.focus(); return; }
      keys.forEach(k => {
        const date = addDays(mealWeekStart, +k), old = MEALS[date] || {};
        saveMeal(date, { name: plan[k].name, cook: old.cook || 'ANY', notes: old.notes || '', ingredients: plan[k].ingredients.map(text => ({ text, got: false })) });
      });
      pastingPlan = false; renderMeals(); renderWeek();
    });
  }

  const items = [...shoppingItems().filter(i => !i.got), ...shoppingItems().filter(i => i.got)];
  view.querySelectorAll('[data-shop]').forEach(cb => cb.addEventListener('change', () => {
    const item = items[+cb.dataset.shop];
    const got = !item.got;
    [...new Set(item.refs.map(r => r.date))].forEach(date => {
      const m = MEALS[date];
      const ingredients = m.ingredients.map(ing => ing.text.trim().toLowerCase() === item.text.toLowerCase() ? { ...ing, got } : ing);
      saveMeal(date, { ...m, ingredients });
    });
    renderMeals();
  }));
  const bought = view.querySelector('.shop-bought');
  if (bought) bought.addEventListener('click', () => { showBought = !showBought; renderMeals(); });
  const copy = view.querySelector('.shop-copy');
  if (copy) copy.addEventListener('click', async () => {
    const text = shoppingItems().filter(i => !i.got).map(i => i.text).join('\n');
    try{ await navigator.clipboard.writeText(text); copy.textContent = 'Copied'; }
    catch(e){ copy.textContent = "Couldn't copy"; }
    setTimeout(() => { copy.textContent = 'Copy'; }, 1500);
  });
}
// A one-line "what's for dinner" on the Chores tab, for a quick answer without switching tabs.
function dinnerBannerHTML(week){
  if (week.week_start !== mondayOf(todayStr())) return '';
  const m = MEALS[todayStr()];
  if (!m || !m.name) return '';
  return `<button type="button" class="dinner-banner" id="dinnerBanner"><span class="db-label">Tonight</span>
    <span class="db-meal">${escapeHTML(m.name)}</span>${COOK_TEXT[m.cook] ? `<span class="db-cook">${COOK_TEXT[m.cook]}</span>` : ''}<span class="chev" aria-hidden="true">›</span></button>`;
}

/* ---------- tabs / theme ---------- */
function setTab(tab){
  currentTab = tab;
  window.scrollTo(0, 0);
  headerCompact = false; headerAnimating = false;
  headerEl.classList.remove('compact');
  const show = (id, on) => { document.getElementById(id).style.display = on ? '' : 'none'; };
  show('weekView', tab==='week');
  show('yearRow', tab==='week');
  show('weekNavRow', tab==='week');
  show('balanceRow', tab==='week');
  show('mealsView', tab==='meals');
  show('todoView', tab==='todo');
  show('rulesView', tab==='rules');
  show('dock', tab==='week' || tab==='todo');  // the person switcher also filters the to-do list
  show('todayOnlyBtn', tab==='week');
  headerTabs.select({ week:0, meals:1, todo:2, rules:0 }[tab], { quiet: true });   // House rules lives under Chores
  measureHeader();   // the other tabs have a shorter header
}
// "iOS Dark" is the iOS theme locked to dark mode; plain "iOS" follows the phone's setting.
function applyThemeAttr(t){
  document.documentElement.setAttribute('data-theme', t === 'ios-dark' ? 'ios' : t);
  if (t === 'ios-dark') document.documentElement.setAttribute('data-ios', 'dark');
  else document.documentElement.removeAttribute('data-ios');
}
function setTheme(t){
  theme = t;
  applyThemeAttr(t);
  markActiveTheme();
  syncThemeColor();
  saveTheme();
}
// Tint the browser / status bar to match the theme's background, and offer that theme's icon.
// iOS copies the home-screen icon when you tap "Add to Home Screen", so it shows whichever
// theme was active at that moment; the browser tab icon follows the theme live.
function syncThemeColor(){
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  if (bg) document.querySelector('meta[name="theme-color"]').setAttribute('content', bg);
  const icon = theme === 'ios-dark' ? 'ios' : theme;
  document.querySelector('link[rel="apple-touch-icon"]').setAttribute('href', `icons/touch-${icon}.png`);
  document.querySelector('link[rel="icon"]').setAttribute('href', `icons/favicon-${icon}.png`);
}
function markActiveTheme(){
  document.querySelectorAll('.themeopt').forEach(b=> b.classList.toggle('active', b.dataset.t===theme));
}

/* ---------- settings menu ---------- */
const settingsBtn = document.getElementById('settingsBtn');
const settingsMenu = document.getElementById('settingsMenu');
// The menu lives at the top level of the page rather than inside the frosted header:
// glass nested inside other glass can only blur that parent, so the cards behind it
// would show through unblurred. Opening it places it just under the title.
document.body.appendChild(settingsMenu);
function setMenuOpen(open){
  if (open){
    const r = settingsBtn.getBoundingClientRect();
    settingsMenu.style.left = Math.max(16, r.left) + 'px';
    settingsMenu.style.top = (r.bottom + 8) + 'px';
  }
  settingsMenu.hidden = !open;
  settingsBtn.setAttribute('aria-expanded', String(open));
}
window.addEventListener('scroll', ()=>{ if (!settingsMenu.hidden) setMenuOpen(false); }, { passive: true });
settingsBtn.addEventListener('click', e=>{ e.stopPropagation(); setMenuOpen(settingsMenu.hidden); });
document.addEventListener('click', e=>{ if (!settingsMenu.hidden && !settingsMenu.contains(e.target)) setMenuOpen(false); });
document.addEventListener('keydown', e=>{ if (e.key==='Escape' && !settingsMenu.hidden){ setMenuOpen(false); settingsBtn.focus(); } });

/* ---------- shrinking header ---------- */
const headerEl = document.querySelector('header.top');
let headerCompact = false, headerAnimating = false;
// Pad the page by the full-size header height, so shrinking it never shifts the list underneath.
// If it's compact, briefly measure it full size with transitions off (no paint happens in between).
function measureHeader(){
  if (headerAnimating) return;
  headerEl.classList.add('measuring');
  if (headerCompact) headerEl.classList.remove('compact');
  const h = headerEl.offsetHeight;
  if (headerCompact) headerEl.classList.add('compact');
  headerEl.offsetHeight;
  headerEl.classList.remove('measuring');
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
function setHeaderCompact(on){
  if (on === headerCompact) return;
  headerCompact = on;
  headerAnimating = true;
  headerEl.classList.toggle('compact', on);
  setTimeout(()=>{ headerAnimating = false; measureHeader(); }, 320);
}
// Two thresholds so it doesn't flicker when you stop near the top.
window.addEventListener('scroll', ()=>{
  const y = window.scrollY;
  if (!headerCompact && y > 48) setHeaderCompact(true);
  else if (headerCompact && y < 8) setHeaderCompact(false);
}, { passive: true });
if (window.ResizeObserver) new ResizeObserver(measureHeader).observe(headerEl, { box: 'border-box' });
window.addEventListener('resize', measureHeader);
measureHeader();

function renderAll(){
  renderWeek();
  if (currentTab==='rules') renderRules();
  if (currentTab==='meals') renderMeals();
  renderTodos();   // cheap; also keeps the tab's open count current
  if (!document.getElementById('statsSheet').hidden) renderStats();
}

document.querySelectorAll('.themeopt').forEach(b=> b.addEventListener('click', ()=> setTheme(b.dataset.t)));

(async function init(){
  setSyncNote('Loading…');
  await loadAll();
  currentWeekIdx = findCurrentWeekIndex();
  currentYear = yearOf(SCHEDULE.weeks[currentWeekIdx]);
  markActiveTheme();
  syncThemeColor();
  setSyncNote('');
  renderWeek();
  renderTodos();
  measureHeader();
  document.fonts && document.fonts.ready.then(measureHeader);
  store.subscribe(onRemoteChange);
  lastDay = todayStr();
  setInterval(checkNewDay, 30000);
})();

/* ---------- roll over to a new day while the page stays open ----------
   Phones keep the page open for days. Check every 30s and whenever it comes back
   to the foreground; when the date changes, move "today" along. */
let lastDay = null;
function checkNewDay(){
  if (!store || !lastDay) return;
  const day = todayStr();
  if (day === lastDay) return;
  const wasOnThisWeek = SCHEDULE.weeks[currentWeekIdx] && SCHEDULE.weeks[currentWeekIdx].week_start === mondayOf(lastDay);
  if (mealWeekStart === mondayOf(lastDay)) mealWeekStart = mondayOf(day);   // meals follow into the new week too
  lastDay = day;
  toggledDays = {};                    // re-collapse the days that are now in the past
  if (ensureWeeksAhead()) saveSchedule();
  if (wasOnThisWeek || todayOnly){     // follow today into the new week
    currentWeekIdx = findCurrentWeekIndex();
    currentYear = yearOf(SCHEDULE.weeks[currentWeekIdx]);
  }
  renderAll();
}
document.addEventListener('visibilitychange', ()=>{ if (!document.hidden){ checkNewDay(); pillBar.snap(); } });
window.addEventListener('focus', checkNewDay);
</script>
