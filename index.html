  html[data-theme="kitty"]{

  /* ---------- iOS (2026 "Liquid Glass"): frosted glass over soft colour, follows the phone's light/dark mode ---------- */
  html[data-theme="ios"]{
    --bg: #F2F2F7;
    --bg-alt: rgba(118,118,128,.12);
    --surface: #FFFFFF;
    --surface-soft: transparent;
    --ink: #1C1C1E;
    --ink-soft: rgba(60,60,67,.6);
    --line: rgba(60,60,67,.18);
    --line-soft: rgba(60,60,67,.1);
    --danger: #FF3B30;

    --joshua: #007AFF;
    --joshua-soft: rgba(0,122,255,.13);
    --amrit: #FF2D55;
    --amrit-soft: rgba(255,45,85,.13);
    --both: #FF9500;
    --both-soft: rgba(255,149,0,.15);
    --radius: 26px;
    --radius-sm: 14px;
    --shadow: 0 8px 32px rgba(0,0,0,.07);
    --glass: rgba(255,255,255,.58);
    --glass-strong: rgba(255,255,255,.86);
    --glass-edge: rgba(255,255,255,.75);
    --glass-blur: blur(24px) saturate(1.8);

  @media (prefers-color-scheme: dark){
    html[data-theme="ios"]{
      --bg: #000000;
      --bg-alt: rgba(118,118,128,.24);
      --surface: #1C1C1E;
      --ink: #FFFFFF;
      --ink-soft: rgba(235,235,245,.6);
      --line: rgba(84,84,88,.6);
      --line-soft: rgba(84,84,88,.35);
      --danger: #FF453A;
      --joshua: #0A84FF;
      --joshua-soft: rgba(10,132,255,.2);
      --amrit: #FF375F;
      --amrit-soft: rgba(255,55,95,.2);
      --both: #FF9F0A;
      --both-soft: rgba(255,159,10,.2);
      --shadow: 0 8px 32px rgba(0,0,0,.4);
      --glass: rgba(44,44,46,.55);
      --glass-strong: rgba(36,36,38,.86);
      --glass-edge: rgba(255,255,255,.14);
      --mesh-1: rgba(10,132,255,.28); --mesh-2: rgba(255,55,95,.2); --mesh-3: rgba(255,159,10,.14);
    }
  }
  html[data-theme="ios"] body{ font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif; }
  html[data-theme="ios"] .brand h1,
  html[data-theme="ios"] .dayhead .dname,
  html[data-theme="ios"] .area-group h3,
  html[data-theme="ios"] .authcard h2{ font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif; font-weight: 700; letter-spacing: -0.02em; }
  html[data-theme="ios"] .mono{ font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  /* Segmented control */
  /* Controls */
  html[data-theme="ios"] .check{ border-color: var(--line); background: transparent; }
  html[data-theme="ios"] .check:checked{ border-color: var(--joshua); background: var(--joshua); }
  html[data-theme="ios"] .check:checked::after{ border-color: #fff; }
  html[data-theme="ios"] .btn-primary{ background: var(--joshua); border-color: var(--joshua); color: #fff; border-radius: 999px; }
  /* White text on the coloured pills */
  html[data-theme="ios"] .todaytag,
  html[data-theme="ios"] .todaybtn,
  html[data-theme="ios"] .dayhead .dmeta .pill.alldone{ color: #fff; }
  html[data-theme="ios"] .themeopt, html[data-theme="ios"] .addbtn{ background: transparent; }

  /* ---------- Halo: Master Chief (olive armour, gold visor) ---------- */
  html[data-theme="chief"]{
    --bg: #12140D;
    --bg-alt: #1D2116;
    --surface: #1B1F14;
    --surface-soft: #22271A;
    --ink: #E8E6D6;
    --ink-soft: #A2A58A;
    --line: #353B28;
    --line-soft: #2A2F20;
    --danger: #E8664A;

    --joshua: #F2A93B;
    --joshua-soft: #3A2C12;
    --amrit: #7FC6D8;
    --amrit-soft: #1C3138;
    --both: #A9C25A;
    --both-soft: #2B3418;
    --radius: 4px;
    --radius-sm: 3px;
    --shadow: 0 0 0 1px #353B28, 0 6px 18px rgba(0,0,0,0.45);
  }
  html[data-theme="chief"] .brand h1,
  html[data-theme="chief"] .dayhead .dname,
  html[data-theme="chief"] .area-group h3,
  html[data-theme="chief"] .authcard h2{ font-family: 'Rajdhani', 'Inter', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  html[data-theme="chief"] .daycard{ border-left: 3px solid #F2A93B; }
  html[data-theme="chief"] .check{ border-radius: 3px; }
  html[data-theme="chief"] .check:checked{ border-color: #F2A93B; background: #F2A93B; }
  html[data-theme="chief"] .check:checked::after{ border-color: #12140D; }
  html[data-theme="chief"] .btn-primary{ background: #F2A93B; border-color: #F2A93B; color: #12140D; }
  html[data-theme="chief"] .tabs,
  html[data-theme="chief"] .tabs button,
  html[data-theme="chief"] .weeknav .navbtn{ border-radius: 3px; }

  /* ---------- Halo: Covenant (purple alloy, plasma glow) ---------- */
  html[data-theme="covenant"]{
    --bg: #12091F;
    --bg-alt: #1E1232;
    --surface: #1C1030;
    --surface-soft: #24153D;
    --ink: #EEE7FF;
    --ink-soft: #A897CC;
    --line: #3A2A5E;
    --line-soft: #2B1F48;
    --danger: #FF6B8B;

    --joshua: #4DD8FF;
    --joshua-soft: #12334A;
    --amrit: #FF5FD2;
    --amrit-soft: #42173C;
    --both: #8CFF7A;
    --both-soft: #1F3A22;
    --radius: 22px;
    --radius-sm: 14px;
    --shadow: 0 0 0 1px #3A2A5E, 0 0 22px rgba(160,90,255,0.16);
  }
  html[data-theme="covenant"] body{ background-image: radial-gradient(ellipse at top, #2A1650 0%, transparent 60%), var(--mesh); }
  html[data-theme="covenant"] .brand h1{ font-family: 'Audiowide', 'Inter', sans-serif; font-weight: 400; font-size: 19px; color: #D9C2FF; text-shadow: 0 0 12px rgba(180,120,255,.55); }
  html[data-theme="covenant"] .dayhead .dname,
  html[data-theme="covenant"] .area-group h3,
  html[data-theme="covenant"] .authcard h2{ font-family: 'Audiowide', 'Inter', sans-serif; font-weight: 400; letter-spacing: .02em; }
  html[data-theme="covenant"] .check:checked{ border-color: #4DD8FF; background: #4DD8FF; box-shadow: 0 0 10px rgba(77,216,255,.7); }
  html[data-theme="covenant"] .check:checked::after{ border-color: #12091F; }
  html[data-theme="covenant"] .btn-primary{ background: #9B5CFF; border-color: #9B5CFF; color: #fff; box-shadow: 0 0 14px rgba(155,92,255,.55); }

  /* ---------- Halo: Cortana (hologram blue, circuit grid) ---------- */
  html[data-theme="cortana"]{
    --bg: #050B1A;
    --bg-alt: #0C1A33;
    --surface: #0A1630;
    --surface-soft: #0E1D3B;
    --ink: #DDF3FF;
    --ink-soft: #7FA9CC;
    --line: #18345C;
    --line-soft: #12284A;
    --danger: #FF7A9A;

    --joshua: #3FD0FF;
    --joshua-soft: #0F2E4A;
    --amrit: #B48CFF;
    --amrit-soft: #261E4A;
    --both: #5CF2C2;
    --both-soft: #10372F;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 0 0 1px rgba(63,208,255,.18), 0 0 20px rgba(63,208,255,.08);
  }
  html[data-theme="cortana"] body{
    background-image:
      linear-gradient(rgba(63,208,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(63,208,255,.05) 1px, transparent 1px),
      var(--mesh);
    background-size: 24px 24px, 24px 24px, 100% 100%, 100% 100%, 100% 100%;
  }
  html[data-theme="cortana"] .brand h1,
  html[data-theme="cortana"] .dayhead .dname,
  html[data-theme="cortana"] .area-group h3,
  html[data-theme="cortana"] .authcard h2{ font-family: 'Exo 2', 'Inter', sans-serif; font-weight: 700; letter-spacing: .01em; }
  html[data-theme="cortana"] .brand h1{ color: #8FE3FF; text-shadow: 0 0 10px rgba(63,208,255,.6); }
  html[data-theme="cortana"] .check:checked{ border-color: #3FD0FF; background: #3FD0FF; box-shadow: 0 0 10px rgba(63,208,255,.75); }
  html[data-theme="cortana"] .check:checked::after{ border-color: #050B1A; }
  html[data-theme="cortana"] .btn-primary{ background: #3FD0FF; border-color: #3FD0FF; color: #050B1A; box-shadow: 0 0 12px rgba(63,208,255,.5); }
  html[data-theme="cortana"] .daycard{ border: 1px solid rgba(63,208,255,.22); }

  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));   /* room for the floating switcher */
    transition: background .2s ease, color .2s ease;
  }
  .mono{ font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
  .display{ font-family: 'Fraunces', Georgia, serif; }

  a, button{ font-family: inherit; }
  button{ cursor:pointer; }
  input, select{ font-family: inherit; }
  :focus-visible{ outline: 2px solid var(--joshua); outline-offset: 2px; }

  .wrap{ max-width: 640px; margin: 0 auto; padding: 0 16px; }

  /* ---------- Header ---------- */
  /* Fixed header; main is padded by its full height (--header-h, set from script) so shrinking it never moves the list */
  header.top{
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    background: var(--bg);
    padding-top: calc(18px + env(safe-area-inset-top, 0px)); padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
    transition: padding .28s ease;
  }
  /* Compact header once you scroll down the list */
  .brand, .brand h1, .brand .sub, .weeklabel .rot, .balance, .balance-labels, .balance-note, .balance-track, .weeknav .navbtn{
    transition: margin .28s ease, font-size .28s ease, max-height .28s ease, opacity .2s ease, height .28s ease, width .28s ease;
  }
  .brand .sub, .weeklabel .rot, .balance-labels, .balance-note{ max-height: 20px; overflow: hidden; }
  header.top.measuring, header.top.measuring *{ transition: none !important; }
  header.top.compact{ padding-top: calc(8px + env(safe-area-inset-top, 0px)); padding-bottom: 8px; }
  header.top.compact .brand{ margin-bottom: 8px; }
  header.top.compact .brand h1{ font-size: 18px; }
  header.top.compact .brand .sub,
  header.top.compact .weeklabel .rot,
  header.top.compact .balance-labels,
  header.top.compact .balance-note{ max-height: 0; opacity: 0; margin-top: 0; margin-bottom: 0; }
  header.top.compact .balance{ margin-top: 8px; }
  header.top.compact .balance-track{ height: 4px; }
  header.top.compact .weeknav .navbtn{ width: 30px; height: 30px; }
  header.top.compact .weeknav .navbtn.addweek{ width: auto; }
  .brand{ display:flex; align-items:center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .brand > div:first-child{ flex-shrink: 0; }
  .tabs .short{ display:none; }
  @media (max-width: 359px){   /* very small phones: "House rules" becomes "Rules" and the title shrinks */
    .tabs .long{ display:none; }
    .tabs .short{ display:inline; }
    .brand{ gap: 6px; }
    .brand h1{ font-size: 19px; }
    .tabs button{ padding: 6px 7px; }
    html[data-theme="kitty"] .brand h1::after{ content: none; }
  }
  .brand h1{
    font-family:'Fraunces', Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 600; font-size: 22px; letter-spacing: -0.01em; margin: 0;
  }
  .brand .sub{ font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--ink-soft); margin-top: 1px; }

  /* ---------- Settings menu ---------- */
  .settings{ position: relative; flex-shrink: 0; }
  /* The title is the settings button: no button chrome, just a small caret */
  .titlebtn{ font: inherit; color: inherit; letter-spacing: inherit; background: none; border: 0; padding: 0; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  .titlebtn .caret{ font-family: 'Inter', sans-serif; font-size: .5em; color: var(--ink-soft); transition: transform .2s ease; }
  .titlebtn[aria-expanded="true"] .caret{ transform: rotate(180deg); }
  .menu{
    position: fixed; left: 16px; top: 72px; z-index: 30;   /* placed under the title by setMenuOpen() */
    width: 260px; max-width: calc(100vw - 32px);
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 14px;
  }
  .menu h4{ margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); font-weight: 600; }
  .menu .section + .section{ margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line-soft); }
  .themegrid{ display:grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .themeopt{
    display:flex; align-items:center; gap: 8px;
    border: 1.5px solid var(--line); background: var(--surface-soft); color: var(--ink);
    border-radius: var(--radius-sm); padding: 7px 8px; font-size: 13px; font-weight: 600; text-align:left;
  }
  .themeopt.active{ border-color: var(--ink); }
  .swatch{ width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(127,127,127,.35); }
  .swatch[data-t="light"]{ background: linear-gradient(135deg, #EDF1EC 50%, #2B6E76 50%); }
  .swatch[data-t="dark"]{ background: linear-gradient(135deg, #141816 50%, #6FC6CE 50%); }
  .swatch[data-t="pink"]{ background: linear-gradient(135deg, #FFF1F6 50%, #E8628F 50%); }
  .swatch[data-t="spotify"]{ background: linear-gradient(135deg, #121212 50%, #1ED760 50%); }
  .swatch[data-t="kitty"]{ background: linear-gradient(135deg, #FFFFFF 50%, #E60033 50%); }
  .swatch[data-t="ios"]{ background: conic-gradient(from 200deg, #007AFF, #FF2D55, #FF9500, #007AFF); }
  .swatch[data-t="chief"]{ background: linear-gradient(135deg, #4B5A2A 50%, #F2A93B 50%); }
  .swatch[data-t="covenant"]{ background: linear-gradient(135deg, #3A1E6E 50%, #4DD8FF 50%); }
  .swatch[data-t="cortana"]{ background: linear-gradient(135deg, #0A1630 50%, #3FD0FF 50%); }
  .menu .account{ font-size: 12.5px; color: var(--ink-soft); line-height: 1.4; word-break: break-word; }
  .menu .account strong{ color: var(--ink); font-weight: 600; }
  .menu .signout{ margin-top: 8px; width: 100%; border: 1px solid var(--line); background: none; color: var(--ink); border-radius: var(--radius-sm); padding: 7px; font-size: 13px; font-weight: 600; }

  /* Tabs sit between the title and the settings button */
  .tabs{ display:flex; gap: 2px; background: var(--bg-alt); border-radius: 999px; padding: 3px; flex: 1 1 auto; min-width: max-content; max-width: 240px; }
  .tabs button{
    flex:1; border:none; background: transparent; padding: 6px 7px; border-radius: 999px; white-space: nowrap;
    font-size: 12px; font-weight: 600; color: var(--ink-soft);
    transition: background .15s ease, color .15s ease;
  }
  .tabs button.active{ background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

  .yearchips{ display:flex; gap:6px; margin-bottom: 10px; flex-wrap: wrap; }
  .yearchips.single{ display:none !important; }   /* only worth showing once there's more than one year */
  .yearchip{
    border: 1px solid var(--line); background: var(--surface);
    border-radius: 999px; padding: 5px 12px; font-size: 12.5px; font-weight: 600;
    color: var(--ink-soft);
  }
  .yearchip.active{ background: var(--ink); color: var(--surface); border-color: var(--ink); }

  .weeknav{ display:flex; align-items:center; gap: 8px; }
  .weeknav .navbtn{
    width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--surface);
    display:flex; align-items:center; justify-content:center;
    font-size: 15px; color: var(--ink); flex-shrink:0;
  }
  .weeknav .navbtn:disabled{ opacity:.35; cursor:default; }
  .weeknav .navbtn.addweek{ width:auto; border-radius: 999px; padding: 0 12px; font-size: 12px; font-weight:700; color: var(--joshua); border-color: var(--joshua-soft); background: var(--joshua-soft); }
  .weeklabel{ flex:1; text-align:center; }
  .weeklabel .range{ font-weight: 600; font-size: 14.5px; }
  .weeklabel .rot{ font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .07em; margin-top: 1px; }
  .todaybtn{
    font-size: 11px; font-weight: 600; color: var(--joshua); background: var(--joshua-soft);
    border: none; border-radius: 999px; padding: 5px 10px; white-space: nowrap;
  }

  /* ---------- Balance bar ---------- */
  .balance{ margin-top: 14px; }
  .balance-labels{ display:flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; }
  .balance-labels .who{ display:flex; align-items:center; gap:5px; font-weight: 600; }
  .dot{ width: 8px; height:8px; border-radius:50%; display:inline-block; }
  .balance-track{ display:flex; height: 8px; border-radius: 999px; overflow:hidden; background: var(--line-soft); }
  .balance-track .seg{ height:100%; transition: width .2s ease; }
  .balance-note{ font-size: 11px; color: var(--ink-soft); margin-top: 5px; }

  /* ---------- Day cards ---------- */
  main.wrap{ padding-top: calc(var(--header-h, 220px) + 16px); }
  .daycard{ background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 14px; overflow: hidden; }
  .daycard .dayhead{
    display:flex; align-items:center; justify-content: space-between; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid var(--line-soft); background: var(--surface-soft);
    width: 100%; border-top: none; border-left: none; border-right: none; color: inherit; text-align: left; font: inherit;
  }
  .dayhead > div:first-child{ flex: 1; min-width: 0; }
  .dayhead .chev{ color: var(--ink-soft); font-size: 18px; line-height: 1; transform: rotate(90deg); transition: transform .15s ease; }
  .daycard.collapsed .dayhead{ border-bottom: none; }
  .daycard.collapsed .chev{ transform: rotate(0deg); }
  .daycard.collapsed ul.tasks{ display: none; }
  .daycard.collapsed{ opacity: .75; }
  .daycard.today{ box-shadow: 0 0 0 2px var(--joshua), var(--shadow); }
  .todaytag{ font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    color: var(--joshua); background: var(--joshua-soft); padding: 2px 7px; border-radius: 999px; vertical-align: 2px; margin-left: 4px; }
  .dayhead .dmeta .pill.alldone{ background: var(--joshua-soft); color: var(--joshua); }
  li.emptyday{ padding: 10px 16px; font-size: 13px; color: var(--ink-soft); }

  .dayhead .dname{ font-family:'Fraunces', Georgia, serif; font-weight: 600; font-size: 16px; }
  .dayhead .ddate{ font-size: 11.5px; color: var(--ink-soft); margin-top: 1px; }
  .dayhead .dmeta{ text-align:right; font-size: 11px; color: var(--ink-soft); }
  .dayhead .dmeta .pill{ display:inline-block; margin-top: 3px; padding: 2px 8px; border-radius: 999px; background: var(--bg-alt); font-weight: 600; }

  ul.tasks{ list-style:none; margin:0; padding:0; }
  ul.tasks li.taskrow{ display:flex; align-items:flex-start; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line-soft); }
  ul.tasks li:last-child{ border-bottom:none; }

  .check{
    appearance:none; -webkit-appearance:none;
    width: 21px; height: 21px; border-radius: 50%;
    border: 1.6px solid var(--line); background: var(--surface);
    flex-shrink:0; margin-top: 1px; position: relative;
    transition: background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .check:active{ transform: scale(.9); }
  .check:checked{ border-color: var(--ink); background: var(--ink); }
  .check:checked::after{
    content:''; position:absolute; left: 6px; top: 2px; width: 5px; height: 10px;
    border: solid var(--surface); border-width: 0 2px 2px 0; transform: rotate(40deg);
  }

  .tasktext{ flex:1; min-width:0; }
  .taskname{ font-size: 14.5px; line-height: 1.35; word-break: break-word; }
  li.done .taskname{ color: var(--ink-soft); text-decoration: line-through; text-decoration-color: var(--line); }
  .taskmeta{ display:flex; align-items:center; gap:6px; margin-top: 3px; }
  .who-badge{ font-size: 10px; font-weight: 700; letter-spacing: .03em; padding: 1px 6px; border-radius: 5px; border:none; }
  .who-badge.J{ background: var(--joshua-soft); color: var(--joshua); }
  .who-badge.A{ background: var(--amrit-soft); color: var(--amrit); }
  .who-badge.BOTH{ background: var(--both-soft); color: var(--both); }
  .taskmin{ font-size: 11px; color: var(--ink-soft); }

  .rowactions{ display:flex; gap: 2px; flex-shrink:0; }
  .iconbtn{
    width: 26px; height: 26px; border-radius: 7px; border: none; background: transparent;
    color: var(--ink-soft); font-size: 13px; display:flex; align-items:center; justify-content:center;
  }
  .iconbtn:hover{ background: var(--bg-alt); }
  .iconbtn.del:hover{ background: var(--amrit-soft); color: var(--danger); }

  li.addrow{ padding: 8px 16px; }
  .addbtn{
    width:100%; border: 1.4px dashed var(--line); background: transparent; color: var(--ink-soft);
    border-radius: var(--radius-sm); padding: 8px; font-size: 13px; font-weight: 600;
  }
  .addbtn:hover{ border-color: var(--joshua); color: var(--joshua); }

  .taskform{ width:100%; display:flex; flex-direction:column; gap:7px; }
  .taskform input[type="text"]{
    border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 14px;
    background: var(--surface); color: var(--ink); width:100%;
  }
  .taskform .row2{ display:flex; gap:7px; align-items:center; flex-wrap: wrap; }
  .persongroup{ display:flex; gap:4px; }
  .persongroup button{
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft);
    font-size: 11px; font-weight: 700; padding: 6px 9px; border-radius: 7px;
  }
  .persongroup button.sel.J{ background: var(--joshua); border-color: var(--joshua); color: #fff; }
  .persongroup button.sel.A{ background: var(--amrit); border-color: var(--amrit); color: #fff; }
  .persongroup button.sel.BOTH{ background: var(--both); border-color: var(--both); color: #fff; }
  .taskform input[type="number"]{
    width: 62px; border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 6px 8px; font-size: 13px; background: var(--surface); color: var(--ink);
  }
  .taskform .minlabel{ font-size: 11px; color: var(--ink-soft); }
  .formbtns{ display:flex; gap:8px; margin-left:auto; }
  .btn-primary{ background: var(--ink); color: var(--surface); border:none; border-radius: var(--radius-sm); padding: 7px 14px; font-size: 12.5px; font-weight: 700; }
  .btn-text{ background: none; border:none; color: var(--ink-soft); font-size: 12.5px; padding: 7px 4px; }

  .weekfoot{ display:flex; justify-content: space-between; align-items:center; padding: 10px 4px 0; font-size: 12px; color: var(--ink-soft); }
  .resetlink{ background:none; border:none; color: var(--ink-soft); text-decoration: underline; font-size: 12px; padding: 4px 0; }

  .emptyyear{ text-align:center; padding: 40px 16px; color: var(--ink-soft); }
  .emptyyear .btn-primary{ margin-top: 12px; }

  /* ---------- Rules view ---------- */
  .area-group{ margin-bottom: 18px; }
  .area-group h3{ font-family:'Fraunces', Georgia, serif; font-size: 15px; font-weight: 600; margin: 0 0 8px 2px; }
  .rule-card{ background: var(--surface); border-radius: var(--radius-sm); box-shadow: var(--shadow); margin-bottom: 8px; padding: 10px 14px; }
  .rule-top{ display:flex; justify-content: space-between; align-items: center; gap: 8px; }
  .rule-top .rowactions{ margin-right: -6px; }
  .rules-intro{ font-size: 12.5px; color: var(--ink-soft); margin: 0 2px 12px; line-height: 1.45; }
  .rules-add{ margin-bottom: 16px; }
  .ruleform{ display:flex; flex-direction:column; gap: 9px; }
  .ruleform label, .ruleform .lbl{ display:flex; flex-direction:column; gap: 4px; font-size: 11px; font-weight: 600; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .05em; }
  .ruleform input, .ruleform select{
    border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 14px;
    background: var(--surface); color: var(--ink); width: 100%; text-transform: none; letter-spacing: 0; font-weight: 400;
  }
  .ruleform .two{ display:grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .ruleform .persongroup button{ flex: 1; }
  .ruleform .persongroup button.sel.ALT{ background: var(--ink); border-color: var(--ink); color: var(--surface); }
  .ruleform .formbtns{ margin-left: 0; justify-content: flex-end; }
  .ruleform [hidden]{ display:none !important; }
  .rule-name{ font-size: 14px; font-weight: 600; }
  .rule-min{ font-size: 11px; color: var(--ink-soft); white-space:nowrap; }
  .rule-sub{ font-size: 11.5px; color: var(--ink-soft); margin-top: 3px; }
  .rule-note{ font-size: 11.5px; color: var(--ink-soft); margin-top: 5px; font-style: italic; }

  .loadnote{ text-align:center; font-size: 12px; color: var(--ink-soft); padding: 10px 0 0; min-height: 16px; }

  /* ---------- Sign-in gate ---------- */
  .authgate{ position: fixed; inset: 0; z-index: 50; background: var(--bg); display:flex; align-items:center; justify-content:center; padding: 24px 16px; }
  .authcard{ background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px 22px; max-width: 360px; width: 100%; text-align:center; }
  .authcard h2{ font-family:'Fraunces', Georgia, serif; font-size: 26px; font-weight: 600; margin: 0 0 6px; }
  .authcard p{ color: var(--ink-soft); font-size: 13.5px; margin: 0 0 18px; line-height: 1.45; }
  .authcard .btn-primary{ font-size: 14px; padding: 10px 18px; }
  .authcard .btn-text{ display:block; margin: 10px auto 0; }

  /* ---------- Liquid glass, for every theme ----------
     Surfaces are frosted and tinted by the theme; a soft wash of the theme's
     Joshua / Amrit / Both colours sits behind them so the glass has something to show. */
  :root{
    --glass: color-mix(in srgb, var(--surface) 62%, transparent);
    --glass-strong: color-mix(in srgb, var(--surface) 86%, transparent);
    --glass-edge: rgba(255,255,255,.7);
    --glass-blur: blur(22px) saturate(1.7);
    --mesh-1: color-mix(in srgb, var(--joshua) 22%, transparent);
    --mesh-2: color-mix(in srgb, var(--amrit) 18%, transparent);
    --mesh-3: color-mix(in srgb, var(--both) 16%, transparent);
    --mesh:
      radial-gradient(60% 40% at 0% 0%, var(--mesh-1), transparent 70%),
      radial-gradient(50% 40% at 100% 30%, var(--mesh-2), transparent 70%),
      radial-gradient(60% 45% at 30% 100%, var(--mesh-3), transparent 70%);
  }
  html[data-theme="dark"], html[data-theme="spotify"], html[data-theme="chief"],
  html[data-theme="covenant"], html[data-theme="cortana"]{ --glass-edge: rgba(255,255,255,.1); }
  body{ background-color: var(--bg); background-image: var(--mesh); background-attachment: fixed; }

  header.top, .daycard, .rule-card, .menu, .weeknav .navbtn, .authcard{
    background: var(--glass);
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-edge);
    box-shadow: inset 0 1px 0 var(--glass-edge), var(--shadow);
  }
  header.top{ border-width: 0 0 1px; border-color: var(--line-soft); box-shadow: none; }
  .menu{ background: var(--glass-strong); }
  .daycard .dayhead{ background: transparent; border-bottom-color: var(--line-soft); }
  ul.tasks li.taskrow{ border-bottom-color: var(--line-soft); }

  /* ---------- Pills: glossy capsules ---------- */
  /* Shared "gem" look: a lit top edge, a soft shade underneath and a glow in the pill's own colour */
  .todaytag, .todaybtn, .dayhead .dmeta .pill.alldone{
    --gc: var(--joshua);
    background: linear-gradient(180deg, color-mix(in srgb, var(--gc), white 22%), var(--gc));
    color: var(--surface);
    box-shadow: inset 0 1px 1px rgba(255,255,255,.5), inset 0 -1px 2px rgba(0,0,0,.15), 0 3px 10px color-mix(in srgb, var(--gc) 40%, transparent);
  }
  .todaybtn{ padding: 6px 12px; font-weight: 700; }
  .dayhead .dmeta .pill{
    background: color-mix(in srgb, var(--ink) 7%, transparent);
    border: 1px solid var(--line-soft);
    box-shadow: inset 0 1px 0 var(--glass-edge);
  }
  .dayhead .dmeta .pill.alldone{ border-color: transparent; }

  .who-badge{
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10.5px; font-weight: 700; letter-spacing: .01em;
    padding: 2px 8px 2px 6px; border-radius: 999px;
    border: 1px solid color-mix(in srgb, currentColor 24%, transparent);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35);
  }
  .who-badge::before{ content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 6px currentColor; }
  .who-badge.J{ color: var(--joshua); }
  .who-badge.A{ color: var(--amrit); }
  .who-badge.BOTH{ color: var(--both); }
  .who-badge.J, .who-badge.A, .who-badge.BOTH{
    background: linear-gradient(180deg, color-mix(in srgb, currentColor 18%, transparent), color-mix(in srgb, currentColor 8%, transparent));
  }


  /* ---------- Liquid glass pill bar (bottom dock) ----------
     The selection is a drop of liquid: it stretches toward the person you pick,
     lags at the back edge, then settles with a small wobble (spring physics in script).
     Labels stay ink-coloured on a clear drop, so they read in every theme. */
  :root{
    --liquid-fill: rgba(255,255,255,.72);
    --liquid-edge: rgba(255,255,255,.95);
    --hover-fill: rgba(255,255,255,.32);
    --bar-top: rgba(255,255,255,.62);
    --bar-shadow: rgba(18,34,48,.22);
  }
  html[data-theme="dark"], html[data-theme="spotify"], html[data-theme="chief"],
  html[data-theme="covenant"], html[data-theme="cortana"]{
    --liquid-fill: rgba(255,255,255,.14); --liquid-edge: rgba(255,255,255,.4);
    --hover-fill: rgba(255,255,255,.07); --bar-top: rgba(255,255,255,.1); --bar-shadow: rgba(0,0,0,.55);
  }
  @media (prefers-color-scheme: dark){
    html[data-theme="ios"]{
      --liquid-fill: rgba(255,255,255,.14); --liquid-edge: rgba(255,255,255,.4);
      --hover-fill: rgba(255,255,255,.07); --bar-top: rgba(255,255,255,.1); --bar-shadow: rgba(0,0,0,.55);
    }
  }
  .dock{
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 25;
    bottom: max(10px, calc(env(safe-area-inset-bottom, 0px) - 8px));
    display: flex; align-items: center; gap: 8px;
  }
  .pill-bar, .todayonly{
    background: linear-gradient(180deg, var(--bar-top), var(--glass) 60%);
    -webkit-backdrop-filter: blur(24px) saturate(185%); backdrop-filter: blur(24px) saturate(185%);
    border: 1px solid var(--glass-edge);
    box-shadow:
      inset 0 1px 0 var(--liquid-edge),
      inset 0 -10px 22px -12px var(--liquid-fill),
      0 12px 32px -10px var(--bar-shadow),
      0 2px 6px -2px var(--bar-shadow);
  }
  .pill-bar{
    --pad: 5px;
    position: relative; display: flex; padding: var(--pad); border-radius: 999px;
    touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  /* Specular sheen that follows the pointer across the glass */
  .liquid, .hover-glow{
    position: absolute; top: var(--pad); bottom: var(--pad); left: 0; width: 0;
    border-radius: 999px; pointer-events: none; will-change: transform, width;
  }
  .liquid{
    z-index: 1;
    --tint: color-mix(in srgb, var(--lc, var(--ink)) 22%, transparent);
    background:
      radial-gradient(120% 90% at 50% 0%, var(--liquid-edge) 0%, transparent 55%),
      linear-gradient(180deg, var(--liquid-fill), var(--tint));
    border: 1px solid var(--liquid-edge);
    box-shadow: inset 0 1px 1px var(--liquid-edge), inset 0 -6px 12px -6px var(--tint), 0 6px 16px -6px var(--bar-shadow);
    transition: --lc .3s ease;
  }
  .hover-glow{ z-index: 0; background: var(--hover-fill); opacity: 0; transition: opacity .25s ease; }
  .pill-bar.is-hovering .hover-glow{ opacity: 1; }
  .ptab{
    position: relative; z-index: 2;
    width: 70px; height: 52px; padding: 0; border: 0; border-radius: 999px; background: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    font: 600 11px/1 'Inter', sans-serif; letter-spacing: .01em; color: var(--ink-soft);
    transition: color .25s ease, transform .35s cubic-bezier(.34,1.56,.64,1);
  }
  .ptab svg{
    width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round;
    transition: transform .35s cubic-bezier(.34,1.56,.64,1), stroke .25s ease;
  }
  .ptab:hover{ color: var(--ink); }
  .ptab:active{ transform: scale(.92); }
  .ptab[aria-checked="true"]{ color: var(--ink); }
  .ptab[aria-checked="true"] svg{ stroke: var(--pc, var(--ink)); stroke-width: 2.1; }
  .ptab.pop svg{ animation: pop .5s cubic-bezier(.34,1.56,.64,1); }
  .ptab:focus-visible{ outline: 2px solid var(--joshua); outline-offset: -3px; }
  @keyframes pop{ 0%{ transform: scale(1); } 35%{ transform: scale(1.22) translateY(-2px); } 65%{ transform: scale(.94); } 100%{ transform: scale(1); } }

  /* Today's date: tap to jump to today; tap again to show only today */
  .todayonly{
    width: 54px; height: 54px; flex-shrink: 0; padding: 0; border-radius: 50%; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1;
    color: var(--ink); -webkit-tap-highlight-color: transparent;
    transition: transform .35s cubic-bezier(.34,1.56,.64,1);
  }
  .todayonly:active{ transform: scale(.92); }
  .todayonly .tm{ font: 800 9px/1 'Inter', sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--danger); }
  .todayonly .td{ font: 700 19px/1 'Inter', sans-serif; margin-top: 2px; }
  .todayonly[aria-pressed="true"]{
    background:
      radial-gradient(120% 90% at 50% 0%, var(--liquid-edge) 0%, transparent 55%),
      linear-gradient(180deg, var(--liquid-fill), color-mix(in srgb, var(--joshua) 30%, transparent));
    border-color: var(--liquid-edge);
  }
  .todayonly[aria-pressed="true"] .td{ color: var(--joshua); }
  @media (max-width: 359px){ .ptab{ width: 62px; } .todayonly{ width: 50px; height: 50px; } }

  /* ---------- Balance bar opens stats ---------- */
  .balance{ cursor: pointer; border-radius: var(--radius-sm); -webkit-tap-highlight-color: transparent; }
  .balance:focus-visible{ outline: 2px solid var(--joshua); outline-offset: 4px; }
  .balance-foot{ display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .stats-hint{ font-size: 11px; font-weight: 700; color: var(--joshua); white-space: nowrap; margin-top: 5px; }
  header.top.compact .stats-hint{ display: none; }

  /* ---------- Stats sheet ---------- */
  .sheet-backdrop{ position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.28); }
  .sheet{
    position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); z-index: 41;
    width: min(640px, 100%); max-height: 86vh; overflow-y: auto;
    padding: 10px 18px calc(18px + env(safe-area-inset-bottom, 0px));
    border-radius: 28px 28px 0 0;
    background: var(--glass-strong);
    -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid var(--glass-edge); border-bottom: 0;
    box-shadow: inset 0 1px 0 var(--liquid-edge), 0 -12px 40px rgba(0,0,0,.25);
    animation: sheet-in .32s cubic-bezier(.2,.9,.3,1.1);
  }
  @keyframes sheet-in{ from{ transform: translate(-50%, 40%); opacity: 0; } to{ transform: translate(-50%, 0); opacity: 1; } }
  .sheet-grab{ width: 38px; height: 5px; border-radius: 99px; background: var(--line); margin: 0 auto 10px; }
  .sheet-head{ display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .sheet-head h2{ margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: 22px; font-weight: 600; }
  .sheet-tabs{ flex: 0 0 auto; min-width: 150px; }
  .sheet-close{ display: block; margin: 14px auto 0; font-weight: 700; font-size: 14px; color: var(--joshua); }
  .stats-range{ font-size: 12px; color: var(--ink-soft); margin: -6px 0 12px; }
  .stat-people{ display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-card{
    border-radius: var(--radius-sm); padding: 12px; background: var(--glass); border: 1px solid var(--glass-edge);
    box-shadow: inset 0 1px 0 var(--glass-edge);
  }
  .stat-card .who{ display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; }
  .stat-card .big{ font-size: 26px; font-weight: 700; margin-top: 6px; letter-spacing: -.02em; }
  .stat-card .big small{ font-size: 13px; font-weight: 600; color: var(--ink-soft); }

<script type="module">
/* ---------- store: Firebase when configured, otherwise this device only ---------- */
const SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
const cfg = window.FIREBASE_CONFIG;
const LS = { schedule: 'jamrit_schedule', checked: 'jamrit_checked', rules: 'jamrit_rules' };

function lsGet(k){ try{ return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k, v){ localStorage.setItem(k, v); }   // let failures surface as "Couldn't save"

function localStore(){
  let checked = {};
  try{ checked = JSON.parse(lsGet(LS.checked) || '{}') || {}; } catch(e){}
  let schedule = null;
  try{ schedule = JSON.parse(lsGet(LS.schedule) || 'null'); } catch(e){}
  let rules = null;
  try{ rules = JSON.parse(lsGet(LS.rules) || 'null'); } catch(e){}
  return {
    mode: 'local',
    schedule, checked, rules, user: null, memberName: null,
    async saveSchedule(s){ lsSet(LS.schedule, JSON.stringify(s)); },
    async saveRules(r){ lsSet(LS.rules, JSON.stringify(r)); },
    async setChecked(ids, on){
      ids.forEach(id => { if (on) checked[id] = true; else delete checked[id]; });
      lsSet(LS.checked, JSON.stringify(checked));
    },
    subscribe(){},
    signOut: null,
  };
}

const gate = document.getElementById('authGate');
const authMsg = document.getElementById('authMsg');
const signInBtn = document.getElementById('signInBtn');
const authSignOut = document.getElementById('authSignOut');
function showGate(msg, canSwitch){
  authMsg.textContent = msg;
  signInBtn.style.display = canSwitch ? 'none' : '';
  authSignOut.style.display = canSwitch ? '' : 'none';
  gate.style.display = '';
}

async function cloudStore(){
  const [{ initializeApp }, fs, au] = await Promise.all([
    import(SDK + 'firebase-app.js'),
    import(SDK + 'firebase-firestore.js'),
    import(SDK + 'firebase-auth.js'),
  ]);
  const app = initializeApp(cfg);
  const auth = au.getAuth(app);
  const db = fs.getFirestore(app);
  const scheduleRef = fs.doc(db, 'board', 'schedule');
  const checkedRef = fs.doc(db, 'board', 'checked');
  const rulesRef = fs.doc(db, 'board', 'rules');

  signInBtn.onclick = async () => {
    const provider = new au.GoogleAuthProvider();
    try{ await au.signInWithPopup(auth, provider); }
    catch(e){
      if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') au.signInWithRedirect(auth, provider);
      else if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') showGate('Sign-in failed: ' + e.code, false);
    }
  };
  authSignOut.onclick = () => au.signOut(auth);

  // Wait until someone is signed in and allowed to read the board.
  for (;;){
    const user = await new Promise(resolve => {
      const stop = au.onAuthStateChanged(auth, u => { if (u){ stop(); resolve(u); } else showGate('Sign in so your ticks and edits sync between both phones.', false); });
    });
    try{
      const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('Timed out reaching Firebase')), 15000));
      const [sSnap, cSnap, rSnap, mSnap] = await Promise.race([Promise.all([
        fs.getDoc(scheduleRef), fs.getDoc(checkedRef), fs.getDoc(rulesRef), fs.getDoc(fs.doc(db, 'members', user.email)),
      ]), timeout]);
      if (!cSnap.exists()) await fs.setDoc(checkedRef, { ids: {} }, { merge: true });
      gate.style.display = 'none';
      let schedule = null, rules = null;
      if (sSnap.exists()){ try{ schedule = JSON.parse(sSnap.data().json); } catch(e){} }
      if (rSnap.exists()){ try{ rules = JSON.parse(rSnap.data().json); } catch(e){} }
      return {
        mode: 'cloud',
        user, schedule, rules,
        memberName: mSnap.exists() ? (mSnap.data().name || null) : null,
        checked: cSnap.exists() ? { ...(cSnap.data().ids || {}) } : {},
        async saveSchedule(s){
          await fs.setDoc(scheduleRef, { json: JSON.stringify(s), updatedBy: user.email, updatedAt: fs.serverTimestamp() });
        },
        async saveRules(r){
          await fs.setDoc(rulesRef, { json: JSON.stringify(r), updatedBy: user.email, updatedAt: fs.serverTimestamp() });
        },
        async setChecked(ids, on){
          if (!ids.length) return;
          // Only touch the ticks that changed, so both of you can tick at the same time safely.
          const args = [];
          ids.forEach(id => { args.push(new fs.FieldPath('ids', id), on ? true : fs.deleteField()); });
          await fs.updateDoc(checkedRef, ...args);
        },
        subscribe(onChange){
          fs.onSnapshot(scheduleRef, snap => {
            if (snap.metadata.hasPendingWrites || !snap.exists()) return;
            try{ onChange('schedule', JSON.parse(snap.data().json)); } catch(e){}
          });
          fs.onSnapshot(checkedRef, snap => {
            if (snap.metadata.hasPendingWrites || !snap.exists()) return;
            onChange('checked', { ...(snap.data().ids || {}) });
          });
          fs.onSnapshot(rulesRef, snap => {
            if (snap.metadata.hasPendingWrites || !snap.exists()) return;
            try{ onChange('rules', JSON.parse(snap.data().json)); } catch(e){}
          });
        },
        signOut: () => au.signOut(auth).then(() => location.reload()),
      };
    } catch(e){
      if (e.code === 'permission-denied'){
        showGate(user.email + " isn't on the board. Ask Joshua to add it, or switch account.", true);
        await new Promise(resolve => { const stop = au.onAuthStateChanged(auth, u => { if (!u){ stop(); resolve(); } }); });
      } else {
        throw e;
      }
    }
  }
}

let store;
if (cfg && cfg.apiKey){
  try{ store = await cloudStore(); }
  catch(e){ console.error('Firebase failed, using this device only', e); store = localStore(); store.cloudError = true; }
} else {
  store = localStore();
}
window.__resolveStore(store);
</script>

}
function addDays(dateStr, n){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function fmtRange(w){
  const s = new Date(w.week_start + 'T00:00:00');
  const e = new Date(w.week_end + 'T00:00:00');
  return s.toLocaleDateString('en-GB', {day:'numeric',month:'short'}) + ' – ' + e.toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'});
}
function formatDayDate(dateStr){

}
function escapeHTML(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeAttr(s){ return escapeHTML(s).replace(/"/g,'&quot;'); }

/* ---------- week generator: builds weeks from the house rules ---------- */
const EPOCH = '2026-08-24';            // Monday of rotation week 1
const DOWS = ['MON','TUE','WED','THU','FRI','SAT','SUN'];
const PERSON_ORDER = { J:0, A:1, BOTH:2 };
const WEEKS_AHEAD = 4;                 // always keep this many weeks after the current one

function daysSinceEpoch(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  return Math.round((Date.UTC(y,m-1,d) - Date.UTC(2026,7,24)) / 864e5);
}
function mod(n, m){ return ((n % m) + m) % m; }
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function mondayOf(dateStr){ return addDays(dateStr, -mod(daysSinceEpoch(dateStr), 7)); }

// Who does a rule's nth occurrence (n counts from the first turn).
function personFor(rule, n){
  if (rule.who !== 'ALT') return rule.who;
  const other = rule.first === 'A' ? 'J' : 'A';
  return mod(n, 2) === 0 ? (rule.first || 'J') : other;
}
function generateWeek(weekStart, rules){
  const wi = Math.floor(daysSinceEpoch(weekStart) / 7);
  const days = DOWS.map((dow, i) => ({ date: addDays(weekStart, i), dow, tasks: [] }));
  rules.forEach(rule => {
    days.forEach((day, i) => {
      const di = wi*7 + i;
      let n = null;
      if (rule.freq === 'daily') n = di;
      else if (rule.freq === 'alt-days'){ const k = di - (rule.weeks||0); if (mod(k,2)===0) n = k/2; }
      else if (rule.freq === 'weekly'){ if (day.dow === rule.day) n = wi; }
      else if (rule.freq === 'fortnightly'){ const k = wi - (rule.weeks||0); if (day.dow === rule.day && mod(k,2)===0) n = k/2; }
      if (n === null) return;
      // Fixed ids, so two phones generating the same week produce identical tasks.
      day.tasks.push({ id: `g_${day.date}_${rule.id}`, person: personFor(rule, n), task: rule.chore, minutes: rule.minutes, rule: rule.id });
    });
  });
  days.forEach(d => d.tasks.sort((a,b) => (PERSON_ORDER[a.person]-PERSON_ORDER[b.person]) || a.task.localeCompare(b.task)));
  return { sheet_name: weekStart, week_start: weekStart, week_end: addDays(weekStart, 6),
           rotation_week: mod(wi, 4) + 1, days, generated: true };
}
// Add generated weeks so the schedule always reaches WEEKS_AHEAD weeks past today. Returns true if it added any.
function ensureWeeksAhead(){
  const target = addDays(mondayOf(todayStr()), 7*WEEKS_AHEAD);
  const weeks = SCHEDULE.weeks;
  let added = false;
  while (!weeks.length || weeks[weeks.length-1].week_start < target){
    const next = weeks.length ? addDays(weeks[weeks.length-1].week_start, 7) : mondayOf(todayStr());
    weeks.push(generateWeek(next, RULES));
    added = true;
  }
  return added;
}
function weekSignature(w){
  return w.days.flatMap(d => d.tasks.map(t => `${d.date}|${t.person}|${t.task}|${t.minutes}`)).sort().join('\n');
}
// After the rules change, rebuild every week after this one that nobody has edited by hand.
// A week counts as untouched if it still matches what the old rules would have produced.
function regenerateFutureWeeks(oldRules){
  const thisWeek = mondayOf(todayStr());
  SCHEDULE.weeks = SCHEDULE.weeks.map(w => {
    if (w.week_start <= thisWeek || w.edited) return w;
    if (weekSignature(w) !== weekSignature(generateWeek(w.week_start, oldRules))) return w;
    return generateWeek(w.week_start, RULES);
  });
}

function findCurrentWeekIndex(){
  const today = todayStr();   // 'YYYY-MM-DD' strings compare in date order
  const weeks = SCHEDULE.weeks;
  for (let i=0;i<weeks.length;i++){
    if (today >= weeks[i].week_start && today <= weeks[i].week_end) return i;
  }
  if (today < weeks[0].week_start) return 0;
  return weeks.length-1;
}

  try{ todayOnly = localStorage.getItem('jamrit_today') === '1'; } catch(e){}

  renderAccount();
}

/* ---------- live updates from the other phone ---------- */
function onRemoteChange(kind, value){
  if (kind==='schedule'){
    SCHEDULE = value;
    if (currentWeekIdx >= SCHEDULE.weeks.length) currentWeekIdx = SCHEDULE.weeks.length-1;
  } else if (kind==='rules'){
    RULES = value;
  } else {
    checked = value;
  }
  // Don't wipe out a half-typed task or rule; the form re-renders when it closes.
  if (addingInDay || editingTaskId || editingRuleId) return;
  renderAll();
}

/* ---------- mutations ---------- */
function toggleTask(id){
  const on = !checked[id];
  if (on) checked[id] = true; else delete checked[id];
  saveChecked([id], on); renderWeek();
}
function addTask(dayDate, task){
  const week = SCHEDULE.weeks[currentWeekIdx];
  const day = week.days.find(d=>d.date===dayDate);
  day.tasks.push({ id: uid(), person: task.person, task: task.task, minutes: task.minutes });
  week.edited = true;   // keep hand edits when the house rules change
  addingInDay = null;
  saveSchedule(); renderWeek();
}
function editTask(taskId, updates){
  const week = SCHEDULE.weeks[currentWeekIdx];
  for (const day of week.days){
    const t = day.tasks.find(t=>t.id===taskId);
    if (t){ Object.assign(t, updates); break; }
  }
  week.edited = true;
  editingTaskId = null;
  saveSchedule(); renderWeek();
}
function deleteTask(taskId, taskName){
  if (!confirm('Delete "'+taskName+'"?')) return;
  const week = SCHEDULE.weeks[currentWeekIdx];
  for (const day of week.days){
    const idx = day.tasks.findIndex(t=>t.id===taskId);
    if (idx>-1){ day.tasks.splice(idx,1); break; }
  }
  week.edited = true;
  const wasChecked = !!checked[taskId];
  delete checked[taskId];
  saveSchedule(); if (wasChecked) saveChecked([taskId], false); renderWeek();
}
function addNextWeek(){
  const weeks = SCHEDULE.weeks;
  const newWeek = generateWeek(addDays(weeks[weeks.length-1].week_start, 7), RULES);
  weeks.push(newWeek);
  saveSchedule();
  currentWeekIdx = weeks.length-1;
  currentYear = yearOf(newWeek);
  renderAll();
}

/* ---------- progress ---------- */
function computeWeekProgress(week){
  let jPlanned=0,aPlanned=0,bothPlanned=0,jDone=0,aDone=0,bothDone=0;
  week.days.forEach(day=>{
    day.tasks.forEach(t=>{
      const done = !!checked[t.id];
      if (t.person==='J'){ jPlanned+=t.minutes; if(done) jDone+=t.minutes; }
      else if (t.person==='A'){ aPlanned+=t.minutes; if(done) aDone+=t.minutes; }
      else { bothPlanned+=t.minutes; if(done) bothDone+=t.minutes; }
    });
  });
  return { jPlanned,aPlanned,bothPlanned,jDone,aDone,bothDone,
    jFull: jPlanned+bothPlanned, aFull: aPlanned+bothPlanned,
    jFullDone: jDone+bothDone, aFullDone: aDone+bothDone };
}

  return SCHEDULE.weeks.map((w,i)=>i).filter(i=>yearOf(SCHEDULE.weeks[i])===y);
}
function selectYear(y){
  currentYear = y;
  const idxToday = findCurrentWeekIndex();
  const inYear = weeksInYear(y);
  if (inYear.includes(idxToday)) currentWeekIdx = idxToday;
  else currentWeekIdx = inYear.length ? inYear[0] : -1;

function renderWeekNav(){
  const inYear = weeksInYear(currentYear);
  if (currentWeekIdx === -1 || !inYear.length){
    document.getElementById('weekNavRow').style.display = 'none';
    document.getElementById('balanceRow').style.display = 'none';
    return;
  }
  document.getElementById('weekNavRow').style.display = '';

  const week = SCHEDULE.weeks[currentWeekIdx];
  document.getElementById('weekRange').textContent = fmtRange(week);
  document.getElementById('weekRot').textContent = 'Rotation week ' + week.rotation_week + ' · ' + currentYear;

  const posInYear = inYear.indexOf(currentWeekIdx);
  const prevBtn = document.getElementById('prevWeek');

  prevBtn.onclick = ()=>{ todayOnly && setTodayOnly(false); currentWeekIdx = inYear[posInYear-1]; renderAll(); };

  const nextBtn = document.getElementById('nextWeek');

function renderBalance(){
  const week = SCHEDULE.weeks[currentWeekIdx];
  if (!week) return;
  const p = computeWeekProgress(week);
  const total = (p.jPlanned+p.aPlanned+p.bothPlanned) || 1;
  document.getElementById('segJ').style.width = (100*p.jPlanned/total)+'%';
  document.getElementById('segBoth').style.width = (100*p.bothPlanned/total)+'%';
  document.getElementById('segA').style.width = (100*p.aPlanned/total)+'%';
  document.getElementById('jMin').textContent = p.jFullDone+'/'+p.jFull+'m';
  document.getElementById('aMin').textContent = p.aFullDone+'/'+p.aFull+'m';
  const diff = Math.abs(p.jFull-p.aFull);
  document.getElementById('balanceNote').textContent = diff<=10
    ? 'Planned load is close to even this week.'
    : (p.jFull>p.aFull?'Joshua':'Amrit')+' is carrying '+diff+'m more this week, as planned.';
}

/* ---------- stats sheet (tap the balance bar) ---------- */
let statsRange = 'week';
// Totals for a set of days. "Both" chores count for each person, as on the balance bar.
function tallyDays(days){
  const t = { J:{ planned:0, done:0, tasks:0, ticked:0 }, A:{ planned:0, done:0, tasks:0, ticked:0 } };
  days.forEach(d => d.tasks.forEach(task => {
    const who = task.person === 'BOTH' ? ['J','A'] : [task.person];
    who.forEach(p => {
      if (!t[p]) return;
      t[p].planned += task.minutes; t[p].tasks++;
      if (checked[task.id]){ t[p].done += task.minutes; t[p].ticked++; }
    });
  }));
  return t;
}
function statCardHTML(name, colour, s){
  const pct = s.planned ? Math.round(100 * s.done / s.planned) : 0;
  return `<div class="stat-card">
    <div class="who"><span class="dot" style="background:var(${colour})"></span>${name}</div>
    <div class="big">${s.done}m <small>/ ${s.planned}m</small></div>
    <div class="meter"><span style="width:${pct}%;background:var(${colour})"></span></div>
    <div class="sub">${pct}% done · ${s.ticked} of ${s.tasks} chores</div>
  </div>`;
}
// Stacked bars of minutes done by each person, one column per group of days.
function barsHTML(groups){
  const max = Math.max(1, ...groups.map(g => g.t.J.done + g.t.A.done));
  return `<div class="bars">${groups.map(g => `<div class="col ${g.now?'now':''}">
      <div class="stack" title="Joshua ${g.t.J.done}m, Amrit ${g.t.A.done}m">
        <span style="height:${100*g.t.A.done/max}%;background:var(--amrit)"></span>
        <span style="height:${100*g.t.J.done/max}%;background:var(--joshua)"></span>
      </div>
      <div class="lbl">${g.label}</div>
    </div>`).join('')}</div>
    <div class="legend"><span><span class="dot" style="background:var(--joshua)"></span>Joshua</span><span><span class="dot" style="background:var(--amrit)"></span>Amrit</span><span>Minutes done</span></div>`;
}
function renderStats(){
  const week = SCHEDULE.weeks[currentWeekIdx];
  if (!week) return;
  const today = todayStr();
  let days, groups, range;
  if (statsRange === 'week'){
    days = week.days;
    range = fmtRange(week);
    groups = week.days.map(d => ({ label: d.dow.charAt(0) + d.dow.slice(1).toLowerCase(), t: tallyDays([d]), now: d.date === today }));
  } else {

    const weeks = SCHEDULE.weeks.filter(w => w.days.some(d => d.date.startsWith(month)));
    days = weeks.flatMap(w => w.days.filter(d => d.date.startsWith(month)));
    range = new Date(month + '-01T00:00:00').toLocaleDateString('en-GB', { month:'long', year:'numeric' });
    groups = weeks.map(w => {

    });

  document.getElementById('statsBody').innerHTML = `

// A liquid-glass segmented control. The selection is two edges (left, right), each on its own
// spring. The edge moving in the direction of travel is stiff and the trailing edge soft, so the
// drop stretches, then squashes as the back catches up. Both springs are under-damped, so it
// settles with a small bounce. Used by the bottom bar, This week / House rules and Week / Month.
//   bar:      the container; buttons inside it are the options
//   mark:     (button, isSelected) => update its selected state (class / aria)
//   colourFor:(index) => CSS colour that tints the drop
//   onSelect: (index) => called when the user picks a different option
function createLiquid(bar, { tabs, mark, colourFor = () => 'var(--ink)', onSelect = () => {} }){
  for (const cls of ['liquid', 'hover-glow']){
    if (!bar.querySelector('.' + cls)){
      const s = document.createElement('span'); s.className = cls; s.setAttribute('aria-hidden', 'true'); bar.prepend(s);
    }
  }
  const liquid = bar.querySelector('.liquid');
  const glow = bar.querySelector('.hover-glow');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const LEAD = { k: 620, c: 28 }, TRAIL = { k: 240, c: 19 }, GLOW = { k: 420, c: 34 };
  const MIN_W = 28;

  const spring = x => ({ x, v: 0, t: x });
  let drop = { L: spring(0), R: spring(0), rest: 0 };
  let hov = { L: spring(0), R: spring(0) };
  let active = Math.max(0, tabs.findIndex(t => t.classList.contains('active') || t.getAttribute('aria-checked') === 'true'));
  let lean = 0, pressed = null, dragging = false, swallowClick = false, raf = 0, last = 0;

  const padOf = () => parseFloat(getComputedStyle(bar).getPropertyValue('--pad')) || 5;
  const span = i => { const b = bar.getBoundingClientRect(), t = tabs[i].getBoundingClientRect(); return { l: t.left - b.left, r: t.right - b.left }; };
  const nearest = x => {
    let best = 0, d = Infinity;
    tabs.forEach((_, i) => { const s = span(i), m = Math.abs((s.l + s.r) / 2 - x); if (m < d){ d = m; best = i; } });
    return best;
  };
  const localX = e => e.clientX - bar.getBoundingClientRect().left;

  function aim(l, r){ drop.L.t = l; drop.R.t = r; drop.rest = r - l; kick(); }
  function aimTab(i){ const s = span(i); aim(s.l + lean, s.r + lean); }
  function stepSpring(s, p, dt){ const a = p.k * (s.t - s.x) - p.c * s.v; s.v += a * dt; s.x += s.v * dt; }
  const settled = s => Math.abs(s.t - s.x) < 0.05 && Math.abs(s.v) < 0.05;

  function frame(now){
    const dt = Math.min((now - last) / 1000 || 1 / 60, 1 / 30);
    last = now;
    const sub = 4, h = dt / sub, pad = padOf();
    for (let n = 0; n < sub; n++){
      const dir = (drop.L.t + drop.R.t) - (drop.L.x + drop.R.x);
      stepSpring(drop.L, dir < 0 ? LEAD : TRAIL, h);
      stepSpring(drop.R, dir > 0 ? LEAD : TRAIL, h);
      // The bar's ends are walls: an overshooting edge squashes against them.
      const lo = pad, hi = bar.clientWidth - pad;
      if (drop.L.x < lo){ drop.L.x = lo; drop.L.v = Math.max(0, drop.L.v); }
      if (drop.R.x > hi){ drop.R.x = hi; drop.R.v = Math.min(0, drop.R.v); }
      if (drop.R.x - drop.L.x < MIN_W){ const mid = (drop.L.x + drop.R.x) / 2; drop.L.x = mid - MIN_W / 2; drop.R.x = mid + MIN_W / 2; }
      stepSpring(hov.L, GLOW, h); stepSpring(hov.R, GLOW, h);
    }
    render();
    if ([drop.L, drop.R, hov.L, hov.R].every(settled)){ raf = 0; return; }
    raf = requestAnimationFrame(frame);
  }
  function render(){
    const w = drop.R.x - drop.L.x;
    const stretch = w / (drop.rest || w);
    // Keep the drop's "volume": wider gets thinner, narrower gets taller.
    const sy = Math.max(0.74, Math.min(1.12, 1 - (stretch - 1) * 0.38));
    liquid.style.width = w + 'px';
    liquid.style.transform = `translate3d(${drop.L.x}px,0,0) scaleY(${sy})`;
    glow.style.width = (hov.R.x - hov.L.x) + 'px';
    glow.style.transform = `translate3d(${hov.L.x}px,0,0)`;
  }
  function kick(){
    // No animation frames while hidden or with reduced motion: jump straight to the target.
    if (reduceMotion.matches || document.hidden){
      for (const s of [drop.L, drop.R, hov.L, hov.R]){ s.x = s.t; s.v = 0; }
      render(); return;
    }
    if (!raf){ last = performance.now(); raf = requestAnimationFrame(frame); }
  }
  // Put the drop straight onto the selected option (first show, resize, fonts loading).
  function snap(){
    if (!bar.offsetWidth) return;
    const s = span(active);
    drop = { L: spring(s.l), R: spring(s.r), rest: s.r - s.l };
    hov = { L: spring(s.l), R: spring(s.r) };
    render();
  }

  function select(i, { focus = false, quiet = false } = {}){
    i = Math.max(0, Math.min(tabs.length - 1, i));
    const changed = i !== active;
    tabs.forEach((t, n) => { mark(t, n === i); t.tabIndex = n === i ? 0 : -1; });
    active = i;
    liquid.style.setProperty('--lc', colourFor(i));
    if (bar.offsetWidth) aimTab(i);        // hidden (e.g. a closed sheet): placed by snap() when shown
    if (focus) tabs[i].focus();
    if (changed && !quiet){
      const tab = tabs[i];
      tab.classList.remove('pop'); void tab.offsetWidth; tab.classList.add('pop');
      onSelect(i);
    }
  }

  tabs.forEach((t, i) => t.addEventListener('click', () => {
    if (swallowClick){ swallowClick = false; return; }
    select(i);
  }));
  bar.addEventListener('keydown', e => {
    const i = tabs.indexOf(document.activeElement);
    if (i < 0) return;
    const to = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1 }[e.key];
    if (to === undefined) return;
    e.preventDefault();
    select(to, { focus: true });
  });

  // Hover lean and glow with a mouse; press and drag to slide the drop along the bar.
  bar.addEventListener('pointermove', e => {
    const x = localX(e);
    bar.style.setProperty('--mx', x + 'px');
    if (pressed && !dragging && Math.abs(e.clientX - pressed.x) > 6){ dragging = true; bar.setPointerCapture(e.pointerId); }
    if (dragging){
      const pad = padOf(), w = drop.rest || span(active).r - span(active).l;
      const c = Math.max(pad + w / 2, Math.min(bar.clientWidth - pad - w / 2, x));
      aim(c - w / 2, c + w / 2);
      const s = span(nearest(x)); hov.L.t = s.l; hov.R.t = s.r;
      return;
    }
    if (e.pointerType === 'mouse'){
      bar.classList.add('is-hovering');
      const s = span(nearest(x)), a = span(active);
      hov.L.t = s.l; hov.R.t = s.r;
      lean = Math.max(-9, Math.min(9, (x - (a.l + a.r) / 2) * 0.07));   // surface tension pulls toward the cursor
      aimTab(active);
    }
  });
  bar.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    pressed = { x: e.clientX };
    const s = span(nearest(localX(e)));
    hov.L.t = s.l; hov.R.t = s.r;
    if (e.pointerType !== 'mouse'){ hov.L.x = s.l; hov.R.x = s.r; }
    kick();
  });
  const endPress = e => {
    if (dragging){
      swallowClick = e.type === 'pointerup';
      setTimeout(() => { swallowClick = false; }, 0);
      lean = 0;
      select(nearest(localX(e)));
      aimTab(active);
    }
    pressed = null; dragging = false;
  };
  bar.addEventListener('pointerup', endPress);
  bar.addEventListener('pointercancel', endPress);
  bar.addEventListener('pointerleave', () => {
    if (dragging) return;
    bar.classList.remove('is-hovering');
    lean = 0;
    aimTab(active);
  });

  if (window.ResizeObserver) new ResizeObserver(snap).observe(bar);
  window.addEventListener('resize', snap);   // e.g. rotating the phone
  document.fonts && document.fonts.ready.then(snap);
  liquid.style.setProperty('--lc', colourFor(active));
  snap();
  return { select, snap };
}

function wireTaskForm(container){
  container.querySelectorAll('.taskform').forEach(form=>{
    const dayDate = form.dataset.day;
    const editingId = form.dataset.editing || null;
    let selPerson = form.querySelector('.pbtn.sel')?.dataset.p || 'J';
    form.querySelectorAll('.pbtn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        form.querySelectorAll('.pbtn').forEach(b=>{ b.classList.remove('sel','J','A','BOTH'); });
        btn.classList.add('sel', btn.dataset.p);
        selPerson = btn.dataset.p;
      });
    });
    form.querySelector('.cancelform').addEventListener('click', ()=>{
      addingInDay = null; editingTaskId = null; renderWeek();
    });
    form.querySelector('.saveform').addEventListener('click', ()=>{
      const name = form.querySelector('.fname').value.trim();
      const minutes = parseInt(form.querySelector('.fmin').value, 10);
      if (!name || !minutes || minutes<=0){ form.querySelector('.fname').focus(); return; }
      if (editingId){ editTask(editingId, { task:name, person:selPerson, minutes }); }
      else { addTask(dayDate, { task:name, person:selPerson, minutes }); }
    });
  });
}

function renderWeek(){
  renderYearChips();
  renderWeekNav();
  renderBalance();
  const inYear = weeksInYear(currentYear);
  const container = document.getElementById('weekView');
  if (!inYear.length || currentWeekIdx===-1){
    container.innerHTML = `<div class="emptyyear">No weeks yet for ${currentYear}.<br>
      <button class="btn-primary" id="addFirstWeek">+ Add week</button></div>`;
    const b = document.getElementById('addFirstWeek');
    if (b) b.addEventListener('click', addNextWeek);
    return;
  }
  const week = SCHEDULE.weeks[currentWeekIdx];
  const todays = week.days.filter(d => d.date === todayStr());
  const showToday = todayOnly && todays.length > 0;
  const days = showToday ? todays : week.days;
  const totalTasks = days.reduce((a,d)=>a+visibleTasks(d).length,0);
  updateDock();
  container.innerHTML = days.map(d=>dayCardHTML(week,d)).join('') +
    `<div class="weekfoot"><span>${totalTasks} tasks ${showToday ? 'today' : 'this week'}</span>
     ${showToday
       ? '<button class="resetlink" id="showWeek">Show the whole week</button>'
       : '<button class="resetlink" id="resetWeek">Uncheck this week</button>'}</div>`;

  const showWeek = document.getElementById('showWeek');
  if (showWeek) showWeek.addEventListener('click', ()=> setTodayOnly(false));
  container.querySelectorAll('.dayhead').forEach(h=> h.addEventListener('click', ()=>{
    const d = h.dataset.day;
    if (toggledDays[d]) delete toggledDays[d]; else toggledDays[d] = true;
    renderWeek();
  }));

  container.querySelectorAll('.check').forEach(cb=> cb.addEventListener('change', ()=>toggleTask(cb.dataset.id)));
  container.querySelectorAll('.addbtn').forEach(btn=> btn.addEventListener('click', ()=>{ addingInDay = btn.dataset.day; editingTaskId=null; renderWeek(); }));
  container.querySelectorAll('.iconbtn.edit').forEach(btn=> btn.addEventListener('click', ()=>{ editingTaskId = btn.dataset.id; addingInDay=null; renderWeek(); }));
  container.querySelectorAll('.iconbtn.del').forEach(btn=> btn.addEventListener('click', ()=> deleteTask(btn.dataset.id, btn.dataset.name)));
  wireTaskForm(container);

  const resetBtn = document.getElementById('resetWeek');
  if (resetBtn) resetBtn.addEventListener('click', ()=>{
    const ids = [];
    week.days.forEach(day=> day.tasks.forEach(t=>{ if (checked[t.id]){ ids.push(t.id); delete checked[t.id]; } }));
    saveChecked(ids, false); renderWeek();
  });
}

/* ---------- rules view ---------- */
const WHO_LABEL = { J:'Joshua', A:'Amrit', BOTH:'Together', ALT:'Take turns' };
const FREQ_LABEL = { daily:'Every day', 'alt-days':'Every other day', weekly:'Weekly', fortnightly:'Every 2 weeks' };

function ruleSummary(r){
  const who = r.who==='ALT' ? `Take turns (${r.first==='A'?'Amrit':'Joshua'} first)` : WHO_LABEL[r.who];
  let when = FREQ_LABEL[r.freq];
  if (r.freq==='weekly' || r.freq==='fortnightly') when += ' · ' + DOW_NAME[r.day];
  if (r.freq==='fortnightly') when += r.weeks ? ' (weeks 2 & 4)' : ' (weeks 1 & 3)';
  return who + ' · ' + when;
}
function ruleFormHTML(r){
  const isNew = !r;
  r = r || { chore:'', area:'', minutes:10, who: personFilter==='ALL' ? 'J' : personFilter, freq:'weekly', day:'SAT', weeks:0, first:'J', notes:'' };
  const areas = [...new Set(RULES.map(x=>x.area).filter(Boolean))].sort();
  const sel = (v, cur) => v===cur ? 'selected' : '';
  return `<div class="rule-card"><div class="ruleform" data-id="${isNew?'new':r.id}">
    <label>Chore<input type="text" class="rf-chore" value="${escapeAttr(r.chore)}" placeholder="e.g. Clean the oven"></label>
    <div class="two">
      <label>Room<input type="text" class="rf-area" list="areaList" value="${escapeAttr(r.area||'')}" placeholder="e.g. Kitchen"></label>
      <label>Minutes<input type="number" class="rf-min" min="1" max="240" value="${r.minutes}"></label>
    </div>
    <datalist id="areaList">${areas.map(a=>`<option value="${escapeAttr(a)}">`).join('')}</datalist>
    <div class="lbl">Who
      <div class="persongroup">
        ${['J','A','BOTH','ALT'].map(p=>`<button type="button" class="pbtn ${p===r.who?'sel '+p:''}" data-p="${p}">${WHO_LABEL[p]}</button>`).join('')}
      </div>
    </div>
    <div class="two">
      <label>How often
        <select class="rf-freq">${Object.keys(FREQ_LABEL).map(f=>`<option value="${f}" ${sel(f,r.freq)}>${FREQ_LABEL[f]}</option>`).join('')}</select>
      </label>
      <label class="rf-day-wrap">Day
        <select class="rf-day">${DOWS.map(d=>`<option value="${d}" ${sel(d,r.day||'SAT')}>${DOW_NAME[d]}</option>`).join('')}</select>
      </label>
    </div>
    <div class="two">
      <label class="rf-weeks-wrap">Which weeks
        <select class="rf-weeks"><option value="0" ${r.weeks?'':'selected'}>Weeks 1 &amp; 3</option><option value="1" ${r.weeks?'selected':''}>Weeks 2 &amp; 4</option></select>
      </label>
      <label class="rf-altdays-wrap">Which days
        <select class="rf-altdays"><option value="0" ${r.weeks?'':'selected'}>Mon, Wed, Fri, Sun in week 1</option><option value="1" ${r.weeks?'selected':''}>Tue, Thu, Sat in week 1</option></select>
      </label>
      <label class="rf-first-wrap">First turn
        <select class="rf-first"><option value="J" ${sel('J',r.first||'J')}>Joshua</option><option value="A" ${sel('A',r.first)}>Amrit</option></select>
      </label>
    </div>
    <label>Notes<input type="text" class="rf-notes" value="${escapeAttr(r.notes||'')}" placeholder="Optional"></label>
    <div class="formbtns">
      <button type="button" class="btn-text rf-cancel">Cancel</button>
      <button type="button" class="btn-primary rf-save">${isNew?'Add chore':'Save'}</button>
    </div>
  </div></div>`;
}
function renderRules(){
  const view = document.getElementById('rulesView');
  const groups = {};
  RULES.forEach(r=>{ const area = r.area || 'Other'; (groups[area] = groups[area]||[]).push(r); });
  const cards = Object.keys(groups).sort().map(area=>{
    const rows = groups[area].map(r=> editingRuleId===r.id ? ruleFormHTML(r) : `<div class="rule-card">
        <div class="rule-top">
          <div class="rule-name">${escapeHTML(r.chore)}</div>
          <div style="display:flex;align-items:center;gap:6px">
            <div class="rule-min mono">${r.minutes}m</div>
            <div class="rowactions">
              <button class="iconbtn edit" data-rule="${r.id}" title="Edit">✎</button>
              <button class="iconbtn del" data-rule="${r.id}" title="Delete">✕</button>
            </div>
          </div>
        </div>
        <div class="rule-sub">${escapeHTML(ruleSummary(r))}</div>
        ${r.notes?`<div class="rule-note">${escapeHTML(r.notes)}</div>`:''}
      </div>`).join('');
    return `<div class="area-group"><h3>${escapeHTML(area)}</h3>${rows}</div>`;
  }).join('');
  view.innerHTML = `<p class="rules-intro">These rules build every new week. Changes apply from next week, so this week's ticks stay as they are.</p>
    <div class="rules-add">${editingRuleId==='new' ? ruleFormHTML(null) : '<button type="button" class="addbtn" id="addRule">+ Add chore</button>'}</div>
    ${cards}`;

  const add = document.getElementById('addRule');
  if (add) add.addEventListener('click', ()=>{ editingRuleId = 'new'; renderRules(); });
  view.querySelectorAll('.iconbtn.edit').forEach(b=> b.addEventListener('click', ()=>{ editingRuleId = b.dataset.rule; renderRules(); }));
  view.querySelectorAll('.iconbtn.del').forEach(b=> b.addEventListener('click', ()=> deleteRule(b.dataset.rule)));
  const form = view.querySelector('.ruleform');
  if (form) wireRuleForm(form);
}
function wireRuleForm(form){
  let who = form.querySelector('.pbtn.sel')?.dataset.p || 'J';
  const q = s => form.querySelector(s);
  // Only show the fields that matter for the chosen frequency and person.
  function sync(){
    const f = q('.rf-freq').value;
    q('.rf-day-wrap').hidden = !(f==='weekly' || f==='fortnightly');
    q('.rf-weeks-wrap').hidden = f!=='fortnightly';
    q('.rf-altdays-wrap').hidden = f!=='alt-days';
    q('.rf-first-wrap').hidden = who!=='ALT';
  }
  form.querySelectorAll('.pbtn').forEach(btn=> btn.addEventListener('click', ()=>{
    form.querySelectorAll('.pbtn').forEach(b=> b.classList.remove('sel','J','A','BOTH','ALT'));
    btn.classList.add('sel', btn.dataset.p);
    who = btn.dataset.p; sync();
  }));
  q('.rf-freq').addEventListener('change', sync);
  sync();
  q('.rf-cancel').addEventListener('click', ()=>{ editingRuleId = null; renderRules(); renderWeek(); });
  q('.rf-save').addEventListener('click', ()=>{
    const chore = q('.rf-chore').value.trim();
    const minutes = parseInt(q('.rf-min').value, 10);
    if (!chore){ q('.rf-chore').focus(); return; }
    if (!minutes || minutes<=0){ q('.rf-min').focus(); return; }
    const freq = q('.rf-freq').value;
    const rule = { id: form.dataset.id==='new' ? 'r_' + uid().slice(2) : form.dataset.id,
      chore, area: q('.rf-area').value.trim() || 'Other', minutes, who, freq };
    if (freq==='weekly' || freq==='fortnightly') rule.day = q('.rf-day').value;
    if (freq==='fortnightly') rule.weeks = parseInt(q('.rf-weeks').value, 10);
    if (freq==='alt-days') rule.weeks = parseInt(q('.rf-altdays').value, 10);
    if (who==='ALT') rule.first = q('.rf-first').value;
    const notes = q('.rf-notes').value.trim();
    if (notes) rule.notes = notes;
    const next = form.dataset.id==='new' ? [...RULES, rule] : RULES.map(r => r.id===rule.id ? rule : r);
    applyRules(next);
  });
}
function deleteRule(id){
  const r = RULES.find(x=>x.id===id);
  if (!r || !confirm('Remove "'+r.chore+'" from the house rules? It stops appearing from next week.')) return;
  applyRules(RULES.filter(x=>x.id!==id));
}
async function applyRules(next){
  const old = RULES;
  RULES = next;
  editingRuleId = null;
  regenerateFutureWeeks(old);
  renderRules(); renderWeek();
  setSyncNote('Saving…');
  try{ await store.saveRules(RULES); await store.saveSchedule(SCHEDULE); setSyncNote(savedNote()); }
  catch(e){ console.error(e); setSyncNote("Couldn't save. Check your connection."); }
}

/* ---------- tabs / theme ---------- */
function setTab(tab){
  currentTab = tab;
  window.scrollTo(0, 0);
  headerCompact = false; headerAnimating = false;
  headerEl.classList.remove('compact');
  document.getElementById('tabWeek').classList.toggle('active', tab==='week');
  document.getElementById('tabRules').classList.toggle('active', tab==='rules');
  document.getElementById('weekView').style.display = tab==='week' ? '' : 'none';
  document.getElementById('yearRow').style.display = tab==='week' ? '' : 'none';
  document.getElementById('weekNavRow').style.display = tab==='week' ? '' : 'none';
  document.getElementById('balanceRow').style.display = tab==='week' ? '' : 'none';
  document.getElementById('rulesView').style.display = tab==='rules' ? '' : 'none';
  document.getElementById('dock').style.display = tab==='week' ? '' : 'none';
  headerTabs.select(tab==='week' ? 0 : 1, { quiet: true });
  measureHeader();   // the rules tab has a shorter header
}
function setTheme(t){
  theme = t;
  document.documentElement.setAttribute('data-theme', t);
  markActiveTheme();
  syncThemeColor();
  saveTheme();
}
// Tint the browser / status bar to match the theme's background, and offer that theme's icon.
// iOS copies the home-screen icon when you tap "Add to Home Screen", so it shows whichever
// theme was active at that moment; the browser tab icon follows the theme live.
function syncThemeColor(){
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  if (bg) document.querySelector('meta[name="theme-color"]').setAttribute('content', bg);
  document.querySelector('link[rel="apple-touch-icon"]').setAttribute('href', `icons/touch-${theme}.png`);
  document.querySelector('link[rel="icon"]').setAttribute('href', `icons/favicon-${theme}.png`);
}
function markActiveTheme(){
  document.querySelectorAll('.themeopt').forEach(b=> b.classList.toggle('active', b.dataset.t===theme));
}

/* ---------- settings menu ---------- */
const settingsBtn = document.getElementById('settingsBtn');
const settingsMenu = document.getElementById('settingsMenu');
// The menu lives at the top level of the page rather than inside the frosted header:
// glass nested inside other glass can only blur that parent, so the cards behind it
// would show through unblurred. Opening it places it just under the title.
document.body.appendChild(settingsMenu);
function setMenuOpen(open){
  if (open){
    const r = settingsBtn.getBoundingClientRect();
    settingsMenu.style.left = Math.max(16, r.left) + 'px';
    settingsMenu.style.top = (r.bottom + 8) + 'px';
  }
  settingsMenu.hidden = !open;
  settingsBtn.setAttribute('aria-expanded', String(open));
}
window.addEventListener('scroll', ()=>{ if (!settingsMenu.hidden) setMenuOpen(false); }, { passive: true });
settingsBtn.addEventListener('click', e=>{ e.stopPropagation(); setMenuOpen(settingsMenu.hidden); });
document.addEventListener('click', e=>{ if (!settingsMenu.hidden && !settingsMenu.contains(e.target)) setMenuOpen(false); });
document.addEventListener('keydown', e=>{ if (e.key==='Escape' && !settingsMenu.hidden){ setMenuOpen(false); settingsBtn.focus(); } });

/* ---------- shrinking header ---------- */
const headerEl = document.querySelector('header.top');
let headerCompact = false, headerAnimating = false;
// Pad the page by the full-size header height, so shrinking it never shifts the list underneath.
// If it's compact, briefly measure it full size with transitions off (no paint happens in between).
function measureHeader(){
  if (headerAnimating) return;
  headerEl.classList.add('measuring');
  if (headerCompact) headerEl.classList.remove('compact');
  const h = headerEl.offsetHeight;
  if (headerCompact) headerEl.classList.add('compact');
  headerEl.offsetHeight;
  headerEl.classList.remove('measuring');
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
function setHeaderCompact(on){
  if (on === headerCompact) return;
  headerCompact = on;
  headerAnimating = true;
  headerEl.classList.toggle('compact', on);
  setTimeout(()=>{ headerAnimating = false; measureHeader(); }, 320);
}
// Two thresholds so it doesn't flicker when you stop near the top.
window.addEventListener('scroll', ()=>{
  const y = window.scrollY;
  if (!headerCompact && y > 48) setHeaderCompact(true);
  else if (headerCompact && y < 8) setHeaderCompact(false);
}, { passive: true });
if (window.ResizeObserver) new ResizeObserver(measureHeader).observe(headerEl, { box: 'border-box' });
window.addEventListener('resize', measureHeader);
measureHeader();

function renderAll(){
  renderWeek();
  if (currentTab==='rules') renderRules();
  if (!document.getElementById('statsSheet').hidden) renderStats();
}

document.querySelectorAll('.themeopt').forEach(b=> b.addEventListener('click', ()=> setTheme(b.dataset.t)));

  markActiveTheme();
  syncThemeColor();
  setSyncNote('');
  renderWeek();
  measureHeader();
  document.fonts && document.fonts.ready.then(measureHeader);
  store.subscribe(onRemoteChange);
  lastDay = todayStr();
  setInterval(checkNewDay, 30000);
})();

/* ---------- roll over to a new day while the page stays open ----------
   Phones keep the page open for days. Check every 30s and whenever it comes back
   to the foreground; when the date changes, move "today" along. */
let lastDay = null;
function checkNewDay(){
  if (!store || !lastDay) return;
  const day = todayStr();
  if (day === lastDay) return;
  const wasOnThisWeek = SCHEDULE.weeks[currentWeekIdx] && SCHEDULE.weeks[currentWeekIdx].week_start === mondayOf(lastDay);
  lastDay = day;
  toggledDays = {};                    // re-collapse the days that are now in the past
  if (ensureWeeksAhead()) saveSchedule();
  if (wasOnThisWeek || todayOnly){     // follow today into the new week
    currentWeekIdx = findCurrentWeekIndex();
    currentYear = yearOf(SCHEDULE.weeks[currentWeekIdx]);
  }
  renderAll();
}
document.addEventListener('visibilitychange', ()=>{ if (!document.hidden){ checkNewDay(); pillBar.snap(); } });
window.addEventListener('focus', checkNewDay);
