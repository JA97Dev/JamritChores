  html[data-theme="kitty"]{

  /* ---------- iOS (2026 "Liquid Glass"): frosted glass over soft colour, follows the phone's light/dark mode ---------- */
  html[data-theme="ios"]{
    --bg: #F2F2F7;
    --bg-alt: rgba(118,118,128,.12);
    --surface: #FFFFFF;
    --surface-soft: transparent;
    --ink: #1C1C1E;
    --ink-soft: rgba(60,60,67,.6);
    --line: rgba(60,60,67,.18);
    --line-soft: rgba(60,60,67,.1);
    --danger: #FF3B30;

    --joshua: #007AFF;
    --joshua-soft: rgba(0,122,255,.13);
    --amrit: #FF2D55;
    --amrit-soft: rgba(255,45,85,.13);
    --both: #FF9500;
    --both-soft: rgba(255,149,0,.15);
    --radius: 26px;
    --radius-sm: 14px;
    --shadow: 0 8px 32px rgba(0,0,0,.07);
    --glass: rgba(255,255,255,.58);
    --glass-strong: rgba(255,255,255,.86);
    --glass-edge: rgba(255,255,255,.75);
    --glass-blur: blur(24px) saturate(1.8);

  @media (prefers-color-scheme: dark){
    html[data-theme="ios"]{
      --bg: #000000;
      --bg-alt: rgba(118,118,128,.24);
      --surface: #1C1C1E;
      --ink: #FFFFFF;
      --ink-soft: rgba(235,235,245,.6);
      --line: rgba(84,84,88,.6);
      --line-soft: rgba(84,84,88,.35);
      --danger: #FF453A;
      --joshua: #0A84FF;
      --joshua-soft: rgba(10,132,255,.2);
      --amrit: #FF375F;
      --amrit-soft: rgba(255,55,95,.2);
      --both: #FF9F0A;
      --both-soft: rgba(255,159,10,.2);
      --shadow: 0 8px 32px rgba(0,0,0,.4);
      --glass: rgba(44,44,46,.55);
      --glass-strong: rgba(36,36,38,.86);
      --glass-edge: rgba(255,255,255,.14);
      --mesh-1: rgba(10,132,255,.28); --mesh-2: rgba(255,55,95,.2); --mesh-3: rgba(255,159,10,.14);
    }
  }
  html[data-theme="ios"] body{ font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif; }
  html[data-theme="ios"] .brand h1,
  html[data-theme="ios"] .dayhead .dname,
  html[data-theme="ios"] .area-group h3,
  html[data-theme="ios"] .authcard h2{ font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif; font-weight: 700; letter-spacing: -0.02em; }
  html[data-theme="ios"] .mono{ font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  /* Segmented control */
  /* Controls */
  html[data-theme="ios"] .check{ border-color: var(--line); background: transparent; }
  html[data-theme="ios"] .check:checked{ border-color: var(--joshua); background: var(--joshua); }
  html[data-theme="ios"] .check:checked::after{ border-color: #fff; }
  html[data-theme="ios"] .btn-primary{ background: var(--joshua); border-color: var(--joshua); color: #fff; border-radius: 999px; }
  /* White text on the coloured pills */
  html[data-theme="ios"] .todaytag,
  html[data-theme="ios"] .todaybtn,
  html[data-theme="ios"] .dayhead .dmeta .pill.alldone{ color: #fff; }
  html[data-theme="ios"] .themeopt, html[data-theme="ios"] .addbtn{ background: transparent; }

  /* ---------- Halo: Master Chief (olive armour, gold visor) ---------- */
  html[data-theme="chief"]{
    --bg: #12140D;
    --bg-alt: #1D2116;
    --surface: #1B1F14;
    --surface-soft: #22271A;
    --ink: #E8E6D6;
    --ink-soft: #A2A58A;
    --line: #353B28;
    --line-soft: #2A2F20;
    --danger: #E8664A;

    --joshua: #F2A93B;
    --joshua-soft: #3A2C12;
    --amrit: #7FC6D8;
    --amrit-soft: #1C3138;
    --both: #A9C25A;
    --both-soft: #2B3418;
    --radius: 4px;
    --radius-sm: 3px;
    --shadow: 0 0 0 1px #353B28, 0 6px 18px rgba(0,0,0,0.45);
  }
  html[data-theme="chief"] .brand h1,
  html[data-theme="chief"] .dayhead .dname,
  html[data-theme="chief"] .area-group h3,
  html[data-theme="chief"] .authcard h2{ font-family: 'Rajdhani', 'Inter', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  html[data-theme="chief"] .daycard{ border-left: 3px solid #F2A93B; }
  html[data-theme="chief"] .check{ border-radius: 3px; }
  html[data-theme="chief"] .check:checked{ border-color: #F2A93B; background: #F2A93B; }
  html[data-theme="chief"] .check:checked::after{ border-color: #12140D; }
  html[data-theme="chief"] .btn-primary{ background: #F2A93B; border-color: #F2A93B; color: #12140D; }
  html[data-theme="chief"] .tabs,
  html[data-theme="chief"] .tabs button,
  html[data-theme="chief"] .weeknav .navbtn{ border-radius: 3px; }

  /* ---------- Halo: Covenant (purple alloy, plasma glow) ---------- */
  html[data-theme="covenant"]{
    --bg: #12091F;
    --bg-alt: #1E1232;
    --surface: #1C1030;
    --surface-soft: #24153D;
    --ink: #EEE7FF;
    --ink-soft: #A897CC;
    --line: #3A2A5E;
    --line-soft: #2B1F48;
    --danger: #FF6B8B;

    --joshua: #4DD8FF;
    --joshua-soft: #12334A;
    --amrit: #FF5FD2;
    --amrit-soft: #42173C;
    --both: #8CFF7A;
    --both-soft: #1F3A22;
    --radius: 22px;
    --radius-sm: 14px;
    --shadow: 0 0 0 1px #3A2A5E, 0 0 22px rgba(160,90,255,0.16);
  }
  html[data-theme="covenant"] body{ background-image: radial-gradient(ellipse at top, #2A1650 0%, transparent 60%), var(--mesh); }
  html[data-theme="covenant"] .brand h1{ font-family: 'Audiowide', 'Inter', sans-serif; font-weight: 400; font-size: 19px; color: #D9C2FF; text-shadow: 0 0 12px rgba(180,120,255,.55); }
  html[data-theme="covenant"] .dayhead .dname,
  html[data-theme="covenant"] .area-group h3,
  html[data-theme="covenant"] .authcard h2{ font-family: 'Audiowide', 'Inter', sans-serif; font-weight: 400; letter-spacing: .02em; }
  html[data-theme="covenant"] .check:checked{ border-color: #4DD8FF; background: #4DD8FF; box-shadow: 0 0 10px rgba(77,216,255,.7); }
  html[data-theme="covenant"] .check:checked::after{ border-color: #12091F; }
  html[data-theme="covenant"] .btn-primary{ background: #9B5CFF; border-color: #9B5CFF; color: #fff; box-shadow: 0 0 14px rgba(155,92,255,.55); }

  /* ---------- Halo: Cortana (hologram blue, circuit grid) ---------- */
  html[data-theme="cortana"]{
    --bg: #050B1A;
    --bg-alt: #0C1A33;
    --surface: #0A1630;
    --surface-soft: #0E1D3B;
    --ink: #DDF3FF;
    --ink-soft: #7FA9CC;
    --line: #18345C;
    --line-soft: #12284A;
    --danger: #FF7A9A;

    --joshua: #3FD0FF;
    --joshua-soft: #0F2E4A;
    --amrit: #B48CFF;
    --amrit-soft: #261E4A;
    --both: #5CF2C2;
    --both-soft: #10372F;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 0 0 1px rgba(63,208,255,.18), 0 0 20px rgba(63,208,255,.08);
  }
  html[data-theme="cortana"] body{
    background-image:
      linear-gradient(rgba(63,208,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(63,208,255,.05) 1px, transparent 1px),
      var(--mesh);
    background-size: 24px 24px, 24px 24px, 100% 100%, 100% 100%, 100% 100%;
  }
  html[data-theme="cortana"] .brand h1,
  html[data-theme="cortana"] .dayhead .dname,
  html[data-theme="cortana"] .area-group h3,
  html[data-theme="cortana"] .authcard h2{ font-family: 'Exo 2', 'Inter', sans-serif; font-weight: 700; letter-spacing: .01em; }
  html[data-theme="cortana"] .brand h1{ color: #8FE3FF; text-shadow: 0 0 10px rgba(63,208,255,.6); }
  html[data-theme="cortana"] .check:checked{ border-color: #3FD0FF; background: #3FD0FF; box-shadow: 0 0 10px rgba(63,208,255,.75); }
  html[data-theme="cortana"] .check:checked::after{ border-color: #050B1A; }
  html[data-theme="cortana"] .btn-primary{ background: #3FD0FF; border-color: #3FD0FF; color: #050B1A; box-shadow: 0 0 12px rgba(63,208,255,.5); }
  html[data-theme="cortana"] .daycard{ border: 1px solid rgba(63,208,255,.22); }

  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));   /* room for the floating switcher */
    transition: background .2s ease, color .2s ease;
  }
  .mono{ font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
  .display{ font-family: 'Fraunces', Georgia, serif; }

  a, button{ font-family: inherit; }
  button{ cursor:pointer; }
  input, select{ font-family: inherit; }
  :focus-visible{ outline: 2px solid var(--joshua); outline-offset: 2px; }

  .wrap{ max-width: 640px; margin: 0 auto; padding: 0 16px; }

  /* ---------- Header ---------- */
  /* Fixed header; main is padded by its full height (--header-h, set from script) so shrinking it never moves the list */
  header.top{
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    background: var(--bg);
    padding-top: calc(18px + env(safe-area-inset-top, 0px)); padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
    transition: padding .28s ease;
  }
  /* Compact header once you scroll down the list */
  .brand, .brand h1, .brand .sub, .weeklabel .rot, .balance, .balance-labels, .balance-note, .balance-track, .weeknav .navbtn{
    transition: margin .28s ease, font-size .28s ease, max-height .28s ease, opacity .2s ease, height .28s ease, width .28s ease;
  }
  .brand .sub, .weeklabel .rot, .balance-labels, .balance-note{ max-height: 20px; overflow: hidden; }
  header.top.measuring, header.top.measuring *{ transition: none !important; }
  header.top.compact{ padding-top: calc(8px + env(safe-area-inset-top, 0px)); padding-bottom: 8px; }
  header.top.compact .brand{ margin-bottom: 8px; }
  header.top.compact .brand h1{ font-size: 18px; }
  header.top.compact .brand .sub,
  header.top.compact .weeklabel .rot,
  header.top.compact .balance-labels,
  header.top.compact .balance-note{ max-height: 0; opacity: 0; margin-top: 0; margin-bottom: 0; }
  header.top.compact .balance{ margin-top: 8px; }
  header.top.compact .balance-track{ height: 4px; }
  header.top.compact .weeknav .navbtn{ width: 30px; height: 30px; }
  header.top.compact .weeknav .navbtn.addweek{ width: auto; }
  .brand{ display:flex; align-items:center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .brand > div:first-child{ flex-shrink: 0; }
  .tabs .short{ display:none; }
  @media (max-width: 359px){   /* very small phones: "House rules" becomes "Rules" and the title shrinks */
    .tabs .long{ display:none; }
    .tabs .short{ display:inline; }
    .brand{ gap: 6px; }
    .brand h1{ font-size: 19px; }
    .tabs button{ padding: 6px 7px; }
    html[data-theme="kitty"] .brand h1::after{ content: none; }
  }
  .brand h1{
    font-family:'Fraunces', Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 600; font-size: 22px; letter-spacing: -0.01em; margin: 0;
  }
  .brand .sub{ font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--ink-soft); margin-top: 1px; }

  /* ---------- Settings menu ---------- */
  .settings{ position: relative; flex-shrink: 0; }
  /* The title is the settings button: no button chrome, just a small caret */
  .titlebtn{ font: inherit; color: inherit; letter-spacing: inherit; background: none; border: 0; padding: 0; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  .titlebtn .caret{ font-family: 'Inter', sans-serif; font-size: .5em; color: var(--ink-soft); transition: transform .2s ease; }
  .titlebtn[aria-expanded="true"] .caret{ transform: rotate(180deg); }
  .menu{
    position: fixed; left: 16px; top: 72px; z-index: 30;   /* placed under the title by setMenuOpen() */
    width: 260px; max-width: calc(100vw - 32px);
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 14px;
  }
  .menu h4{ margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); font-weight: 600; }
  .menu .section + .section{ margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line-soft); }
  .themegrid{ display:grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .themeopt{
    display:flex; align-items:center; gap: 8px;
    border: 1.5px solid var(--line); background: var(--surface-soft); color: var(--ink);
    border-radius: var(--radius-sm); padding: 7px 8px; font-size: 13px; font-weight: 600; text-align:left;
  }
  .themeopt.active{ border-color: var(--ink); }
  .swatch{ width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(127,127,127,.35); }
  .swatch[data-t="light"]{ background: linear-gradient(135deg, #EDF1EC 50%, #2B6E76 50%); }
  .swatch[data-t="dark"]{ background: linear-gradient(135deg, #141816 50%, #6FC6CE 50%); }
  .swatch[data-t="pink"]{ background: linear-gradient(135deg, #FFF1F6 50%, #E8628F 50%); }
  .swatch[data-t="spotify"]{ background: linear-gradient(135deg, #121212 50%, #1ED760 50%); }
  .swatch[data-t="kitty"]{ background: linear-gradient(135deg, #FFFFFF 50%, #E60033 50%); }
  .swatch[data-t="ios"]{ background: conic-gradient(from 200deg, #007AFF, #FF2D55, #FF9500, #007AFF); }
  .swatch[data-t="chief"]{ background: linear-gradient(135deg, #4B5A2A 50%, #F2A93B 50%); }
  .swatch[data-t="covenant"]{ background: linear-gradient(135deg, #3A1E6E 50%, #4DD8FF 50%); }
  .swatch[data-t="cortana"]{ background: linear-gradient(135deg, #0A1630 50%, #3FD0FF 50%); }
  .menu .account{ font-size: 12.5px; color: var(--ink-soft); line-height: 1.4; word-break: break-word; }
  .menu .account strong{ color: var(--ink); font-weight: 600; }
  .menu .signout{ margin-top: 8px; width: 100%; border: 1px solid var(--line); background: none; color: var(--ink); border-radius: var(--radius-sm); padding: 7px; font-size: 13px; font-weight: 600; }

  /* Tabs sit between the title and the settings button */
  .tabs{ display:flex; gap: 2px; background: var(--bg-alt); border-radius: 999px; padding: 3px; flex: 1 1 auto; min-width: max-content; max-width: 240px; }
  .tabs button{
    flex:1; border:none; background: transparent; padding: 6px 7px; border-radius: 999px; white-space: nowrap;
    font-size: 12px; font-weight: 600; color: var(--ink-soft);
    transition: background .15s ease, color .15s ease;
  }
  .tabs button.active{ background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

  .yearchips{ display:flex; gap:6px; margin-bottom: 10px; flex-wrap: wrap; }
  .yearchips.single{ display:none !important; }   /* only worth showing once there's more than one year */
  .yearchip{
    border: 1px solid var(--line); background: var(--surface);
    border-radius: 999px; padding: 5px 12px; font-size: 12.5px; font-weight: 600;

  .weeknav{ display:flex; align-items:center; gap: 8px; }
  .weeknav .navbtn{

  .weeknav .navbtn.addweek{ width:auto; border-radius: 999px; padding: 0 12px; font-size: 12px; font-weight:700; color: var(--joshua); border-color: var(--joshua-soft); background: var(--joshua-soft); }
  .weeklabel{ flex:1; text-align:center; }
  .weeklabel .range{ font-weight: 600; font-size: 14.5px; }
  .weeklabel .rot{ font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .07em; margin-top: 1px; }
  .todaybtn{
    font-size: 11px; font-weight: 600; color: var(--joshua); background: var(--joshua-soft);

  /* ---------- Balance bar ---------- */
  .balance{ margin-top: 14px; }
  .balance-labels{ display:flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; }
  .balance-labels .who{ display:flex; align-items:center; gap:5px; font-weight: 600; }
  .dot{ width: 8px; height:8px; border-radius:50%; display:inline-block; }
  .balance-track{ display:flex; height: 8px; border-radius: 999px; overflow:hidden; background: var(--line-soft); }
  .balance-track .seg{ height:100%; transition: width .2s ease; }
  .balance-note{ font-size: 11px; color: var(--ink-soft); margin-top: 5px; }

  /* ---------- Day cards ---------- */
  main.wrap{ padding-top: calc(var(--header-h, 220px) + 16px); }
  .daycard{ background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 14px; overflow: hidden; }
  .daycard .dayhead{
    display:flex; align-items:center; justify-content: space-between; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid var(--line-soft); background: var(--surface-soft);
    width: 100%; border-top: none; border-left: none; border-right: none; color: inherit; text-align: left; font: inherit;
  }
  .dayhead > div:first-child{ flex: 1; min-width: 0; }
  .dayhead .chev{ color: var(--ink-soft); font-size: 18px; line-height: 1; transform: rotate(90deg); transition: transform .15s ease; }
  .daycard.collapsed .dayhead{ border-bottom: none; }
  .daycard.collapsed .chev{ transform: rotate(0deg); }
  .daycard.collapsed ul.tasks{ display: none; }
  .daycard.collapsed{ opacity: .75; }
  .daycard.today{ box-shadow: 0 0 0 2px var(--joshua), var(--shadow); }
  .todaytag{ font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    color: var(--joshua); background: var(--joshua-soft); padding: 2px 7px; border-radius: 999px; vertical-align: 2px; margin-left: 4px; }
  .dayhead .dmeta .pill.alldone{ background: var(--joshua-soft); color: var(--joshua); }
  li.emptyday{ padding: 10px 16px; font-size: 13px; color: var(--ink-soft); }

  .dayhead .dname{ font-family:'Fraunces', Georgia, serif; font-weight: 600; font-size: 16px; }
  .dayhead .ddate{ font-size: 11.5px; color: var(--ink-soft); margin-top: 1px; }
  .dayhead .dmeta{ text-align:right; font-size: 11px; color: var(--ink-soft); }
  .dayhead .dmeta .pill{ display:inline-block; margin-top: 3px; padding: 2px 8px; border-radius: 999px; background: var(--bg-alt); font-weight: 600; }

  ul.tasks{ list-style:none; margin:0; padding:0; }
  ul.tasks li.taskrow{ display:flex; align-items:flex-start; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line-soft); }
  ul.tasks li:last-child{ border-bottom:none; }

  .check{

    transition: background .15s ease, border-color .15s ease, transform .1s ease;

  .check:active{ transform: scale(.9); }
  .check:checked{ border-color: var(--ink); background: var(--ink); }
  .check:checked::after{

  .tasktext{ flex:1; min-width:0; }
  .taskname{ font-size: 14.5px; line-height: 1.35; word-break: break-word; }

  .taskmeta{ display:flex; align-items:center; gap:6px; margin-top: 3px; }
  .who-badge{ font-size: 10px; font-weight: 700; letter-spacing: .03em; padding: 1px 6px; border-radius: 5px; border:none; }
  .who-badge.J{ background: var(--joshua-soft); color: var(--joshua); }
  .who-badge.A{ background: var(--amrit-soft); color: var(--amrit); }

  .rowactions{ display:flex; gap: 2px; flex-shrink:0; }
  .iconbtn{
    width: 26px; height: 26px; border-radius: 7px; border: none; background: transparent;

  li.addrow{ padding: 8px 16px; }
  .addbtn{

  .taskform{ width:100%; display:flex; flex-direction:column; gap:7px; }
  .taskform input[type="text"]{

  .persongroup button{

  .taskform input[type="number"]{

  .formbtns{ display:flex; gap:8px; margin-left:auto; }
  .btn-primary{ background: var(--ink); color: var(--surface); border:none; border-radius: var(--radius-sm); padding: 7px 14px; font-size: 12.5px; font-weight: 700; }
  .btn-text{ background: none; border:none; color: var(--ink-soft); font-size: 12.5px; padding: 7px 4px; }

  /* ---------- Rules view ---------- */
  .area-group{ margin-bottom: 18px; }
  .area-group h3{ font-family:'Fraunces', Georgia, serif; font-size: 15px; font-weight: 600; margin: 0 0 8px 2px; }

  .rule-top .rowactions{ margin-right: -6px; }
  .rules-intro{ font-size: 12.5px; color: var(--ink-soft); margin: 0 2px 12px; line-height: 1.45; }

  .ruleform input, .ruleform select{

    background: var(--surface); color: var(--ink); width: 100%; text-transform: none; letter-spacing: 0; font-weight: 400;
  }
  .ruleform .two{ display:grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .ruleform .persongroup button{ flex: 1; }
  .ruleform .persongroup button.sel.ALT{ background: var(--ink); border-color: var(--ink); color: var(--surface); }

  .ruleform [hidden]{ display:none !important; }
  .rule-name{ font-size: 14px; font-weight: 600; }
  .rule-min{ font-size: 11px; color: var(--ink-soft); white-space:nowrap; }
  .rule-sub{ font-size: 11.5px; color: var(--ink-soft); margin-top: 3px; }
  .rule-note{ font-size: 11.5px; color: var(--ink-soft); margin-top: 5px; font-style: italic; }

  .loadnote{ text-align:center; font-size: 12px; color: var(--ink-soft); padding: 10px 0 0; min-height: 16px; }

  /* ---------- Sign-in gate ---------- */
  .authgate{ position: fixed; inset: 0; z-index: 50; background: var(--bg); display:flex; align-items:center; justify-content:center; padding: 24px 16px; }
  .authcard{ background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px 22px; max-width: 360px; width: 100%; text-align:center; }
  .authcard h2{ font-family:'Fraunces', Georgia, serif; font-size: 26px; font-weight: 600; margin: 0 0 6px; }
  .authcard p{ color: var(--ink-soft); font-size: 13.5px; margin: 0 0 18px; line-height: 1.45; }
  .authcard .btn-primary{ font-size: 14px; padding: 10px 18px; }
  .authcard .btn-text{ display:block; margin: 10px auto 0; }
  .name-step{ display: flex; flex-direction: column; gap: 10px; }
  .name-step input, .hh-row input{
    border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px; font: inherit; font-size: 15px;
    background: var(--surface); color: var(--ink); width: 100%;
  }

  .hh-row input{ flex: 1; min-width: 0; padding: 7px 10px; font-size: 14px; }
  .hh-link{ font-weight: 700; color: var(--joshua); padding: 4px 2px; white-space: nowrap; }
  .menu .acct-h{ margin-top: 14px; }
  #hhNewRow{ margin-top: 6px; }
  .hh-switch-h{ font-size: 11px; color: var(--ink-soft); margin: 10px 0 4px; }
  .hh-switch{
    display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 10px; margin-top: 4px; border-radius: var(--radius-sm); font: inherit; font-size: 13px; font-weight: 600;
    color: var(--ink); background: var(--glass); border: 1px solid var(--glass-edge); text-align: left;
  }
  .hh-role{ font-size: 12px; font-weight: 500; color: var(--ink-soft); }

  /* Household sheet */
  #hhTop .sheet-head{ margin-bottom: 4px; }
  #hhTop .sheet-head.hh-row input{ font-size: 16px; }
  .hh-intro{ font-size: 13px; color: var(--ink-soft); margin: 0 0 14px; line-height: 1.45; }
  .hh-h{ font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); font-weight: 600; margin: 16px 0 8px; }
  .hh-people{ list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .hh-person{ padding: 10px 12px; border-radius: var(--radius-sm); background: var(--glass); border: 1px solid var(--glass-edge); }
  .hh-who{ display: flex; align-items: center; gap: 8px; min-height: 24px; }
  .hh-email{ font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .hh-you{ font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 99px; background: var(--joshua-soft); color: var(--joshua); flex: none; }
  .hh-x{ margin-left: auto; flex: none; width: 28px; height: 28px; border-radius: 50%; border: none; background: none; color: var(--ink-soft); font-size: 13px; }
  .hh-x:hover{ background: var(--hover-fill); color: var(--danger); }
  .hh-person .hh-role{ margin-top: 4px; }
  .hh-roles{ margin-top: 8px; }
  #hhAdd .todo-input-row input{ font-size: 16px; }   /* 16px stops iPhone zooming in */
  #hhAdd .hh-roles{ margin-top: 10px; }
  .hh-err{ font-size: 12.5px; color: var(--danger); margin-top: 6px; min-height: 1em; }
  .hh-leave{ display: block; margin: 16px auto 0; color: var(--danger); }
  .hh-linkrow{ display: flex; align-items: center; gap: 10px; }
  .hh-linkrow .hh-roles{ margin-top: 0; flex: 1; min-width: 0; }
  .hh-linkrow .btn-primary{ flex: none; padding: 8px 14px; font-size: 13px; }
  .hh-invites{ list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .hh-invite{ display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 12px; border-radius: var(--radius-sm); background: var(--glass); border: 1px solid var(--glass-edge); }
  .hh-invite-what{ flex: 1; min-width: 0; font-size: 13px; }
  .hh-invite .hh-x{ margin-left: 0; }

  /* First run: create or join */
  .start-step{ display: flex; flex-direction: column; gap: 10px; }
  .start-or{ display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--ink-soft); margin: 6px 0 2px; }
  .start-or::before, .start-or::after{ content: ''; flex: 1; height: 1px; background: var(--line); }
  .start-join{ display: flex; gap: 8px; }
  .start-join input{
    flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px;
    font: inherit; font-size: 16px; background: var(--surface); color: var(--ink);
  }
  .start-err{ font-size: 12.5px; color: var(--danger); min-height: 1em; }
  .authcard .start-hint{ font-size: 12.5px; margin: 0; }
  .join-step{ display: flex; flex-direction: column; align-items: center; }
  .name-step .btn-text{ margin-top: 0; }

  /* View only: hide the controls that change the board */
  .readonly :is(.iconbtn, .addrow .addbtn, .rules-add, .paste-open, .todo-add, [data-plan], #resetWeek, #todoClear, #addFirstWeek, .meal-row .chev){ display: none !important; }
  .readonly :is(.check, .meal-row){ pointer-events: none; }

  /* ---------- Liquid glass, for every theme ----------
     Surfaces are frosted and tinted by the theme; a soft wash of the theme's
     Joshua / Amrit / Both colours sits behind them so the glass has something to show. */
  :root{
    --glass: color-mix(in srgb, var(--surface) 62%, transparent);
    --glass-strong: color-mix(in srgb, var(--surface) 86%, transparent);
    --glass-edge: rgba(255,255,255,.7);
    --glass-blur: blur(22px) saturate(1.7);
    --mesh-1: color-mix(in srgb, var(--joshua) 22%, transparent);
    --mesh-2: color-mix(in srgb, var(--amrit) 18%, transparent);
    --mesh-3: color-mix(in srgb, var(--both) 16%, transparent);
    --mesh:
      radial-gradient(60% 40% at 0% 0%, var(--mesh-1), transparent 70%),
      radial-gradient(50% 40% at 100% 30%, var(--mesh-2), transparent 70%),
      radial-gradient(60% 45% at 30% 100%, var(--mesh-3), transparent 70%);
  }
  html[data-theme="dark"], html[data-theme="spotify"], html[data-theme="chief"],
  html[data-theme="covenant"], html[data-theme="cortana"]{ --glass-edge: rgba(255,255,255,.1); }
  body{ background-color: var(--bg); background-image: var(--mesh); background-attachment: fixed; }

  header.top, .daycard, .rule-card, .menu, .weeknav .navbtn, .authcard{
    background: var(--glass);
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-edge);
    box-shadow: inset 0 1px 0 var(--glass-edge), var(--shadow);
  }
  header.top{ border-width: 0 0 1px; border-color: var(--line-soft); box-shadow: none; }
  .menu{ background: var(--glass-strong); }
  .daycard .dayhead{ background: transparent; border-bottom-color: var(--line-soft); }
  ul.tasks li.taskrow{ border-bottom-color: var(--line-soft); }

  /* ---------- Pills: glossy capsules ---------- */
  /* Shared "gem" look: a lit top edge, a soft shade underneath and a glow in the pill's own colour */
  .todaytag, .todaybtn, .dayhead .dmeta .pill.alldone{
    --gc: var(--joshua);
    background: linear-gradient(180deg, color-mix(in srgb, var(--gc), white 22%), var(--gc));
    color: var(--surface);
    box-shadow: inset 0 1px 1px rgba(255,255,255,.5), inset 0 -1px 2px rgba(0,0,0,.15), 0 3px 10px color-mix(in srgb, var(--gc) 40%, transparent);
  }
  .todaybtn{ padding: 6px 12px; font-weight: 700; }
  .dayhead .dmeta .pill{
    background: color-mix(in srgb, var(--ink) 7%, transparent);
    border: 1px solid var(--line-soft);
    box-shadow: inset 0 1px 0 var(--glass-edge);
  }
  .dayhead .dmeta .pill.alldone{ border-color: transparent; }

  .who-badge{
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10.5px; font-weight: 700; letter-spacing: .01em;
    padding: 2px 8px 2px 6px; border-radius: 999px;
    border: 1px solid color-mix(in srgb, currentColor 24%, transparent);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35);
  }
  .who-badge::before{ content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 6px currentColor; }
  .who-badge.J{ color: var(--joshua); }
  .who-badge.A{ color: var(--amrit); }
  .who-badge.BOTH{ color: var(--both); }
  .who-badge.J, .who-badge.A, .who-badge.BOTH{
    background: linear-gradient(180deg, color-mix(in srgb, currentColor 18%, transparent), color-mix(in srgb, currentColor 8%, transparent));
  }


  /* ---------- Liquid glass pill bar (bottom dock) ----------
     The selection is a drop of liquid: it stretches toward the person you pick,
     lags at the back edge, then settles with a small wobble (spring physics in script).
     Labels stay ink-coloured on a clear drop, so they read in every theme. */
  :root{
    --liquid-fill: rgba(255,255,255,.72);
    --liquid-edge: rgba(255,255,255,.95);
    --hover-fill: rgba(255,255,255,.32);
    --bar-top: rgba(255,255,255,.62);
    --bar-shadow: rgba(18,34,48,.22);
  }
  html[data-theme="dark"], html[data-theme="spotify"], html[data-theme="chief"],
  html[data-theme="covenant"], html[data-theme="cortana"]{
    --liquid-fill: rgba(255,255,255,.14); --liquid-edge: rgba(255,255,255,.4);
    --hover-fill: rgba(255,255,255,.07); --bar-top: rgba(255,255,255,.1); --bar-shadow: rgba(0,0,0,.55);
  }
  @media (prefers-color-scheme: dark){
    html[data-theme="ios"]{
      --liquid-fill: rgba(255,255,255,.14); --liquid-edge: rgba(255,255,255,.4);
      --hover-fill: rgba(255,255,255,.07); --bar-top: rgba(255,255,255,.1); --bar-shadow: rgba(0,0,0,.55);
    }
  }
  .dock{
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 25;
    bottom: max(10px, calc(env(safe-area-inset-bottom, 0px) - 8px));
    display: flex; align-items: center; gap: 8px;
  }
  .pill-bar, .todayonly{
    background: linear-gradient(180deg, var(--bar-top), var(--glass) 60%);
    -webkit-backdrop-filter: blur(24px) saturate(185%); backdrop-filter: blur(24px) saturate(185%);
    border: 1px solid var(--glass-edge);
    box-shadow:
      inset 0 1px 0 var(--liquid-edge),
      inset 0 -10px 22px -12px var(--liquid-fill),
      0 12px 32px -10px var(--bar-shadow),
      0 2px 6px -2px var(--bar-shadow);
  }
  .pill-bar{
    --pad: 5px;
    position: relative; display: flex; padding: var(--pad); border-radius: 999px;
    touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  /* Specular sheen that follows the pointer across the glass */
  .liquid, .hover-glow{
    position: absolute; top: var(--pad); bottom: var(--pad); left: 0; width: 0;
    border-radius: 999px; pointer-events: none; will-change: transform, width;
  }
  .liquid{
    z-index: 1;
    --tint: color-mix(in srgb, var(--lc, var(--ink)) 22%, transparent);
    background:
      radial-gradient(120% 90% at 50% 0%, var(--liquid-edge) 0%, transparent 55%),
      linear-gradient(180deg, var(--liquid-fill), var(--tint));
    border: 1px solid var(--liquid-edge);
    box-shadow: inset 0 1px 1px var(--liquid-edge), inset 0 -6px 12px -6px var(--tint), 0 6px 16px -6px var(--bar-shadow);
    transition: --lc .3s ease;
  }
  .hover-glow{ z-index: 0; background: var(--hover-fill); opacity: 0; transition: opacity .25s ease; }
  .pill-bar.is-hovering .hover-glow{ opacity: 1; }
  .ptab{
    position: relative; z-index: 2;
    width: 70px; height: 52px; padding: 0; border: 0; border-radius: 999px; background: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    font: 600 11px/1 'Inter', sans-serif; letter-spacing: .01em; color: var(--ink-soft);
    transition: color .25s ease, transform .35s cubic-bezier(.34,1.56,.64,1);
  }
  .ptab svg{
    width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round;
    transition: transform .35s cubic-bezier(.34,1.56,.64,1), stroke .25s ease;
  }
  .ptab:hover{ color: var(--ink); }
  .ptab:active{ transform: scale(.92); }
  .ptab[aria-checked="true"]{ color: var(--ink); }
  .ptab[aria-checked="true"] svg{ stroke: var(--pc, var(--ink)); stroke-width: 2.1; }
  .ptab.pop svg{ animation: pop .5s cubic-bezier(.34,1.56,.64,1); }
  .ptab:focus-visible{ outline: 2px solid var(--joshua); outline-offset: -3px; }
  @keyframes pop{ 0%{ transform: scale(1); } 35%{ transform: scale(1.22) translateY(-2px); } 65%{ transform: scale(.94); } 100%{ transform: scale(1); } }

  /* Today's date: tap to jump to today; tap again to show only today */
  .todayonly{
    width: 54px; height: 54px; flex-shrink: 0; padding: 0; border-radius: 50%; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1;
    color: var(--ink); -webkit-tap-highlight-color: transparent;
    transition: transform .35s cubic-bezier(.34,1.56,.64,1);
  }
  .todayonly:active{ transform: scale(.92); }
  .todayonly .tm{ font: 800 9px/1 'Inter', sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--danger); }
  .todayonly .td{ font: 700 19px/1 'Inter', sans-serif; margin-top: 2px; }
  .todayonly[aria-pressed="true"]{
    background:
      radial-gradient(120% 90% at 50% 0%, var(--liquid-edge) 0%, transparent 55%),
      linear-gradient(180deg, var(--liquid-fill), color-mix(in srgb, var(--joshua) 30%, transparent));
    border-color: var(--liquid-edge);
  }
  .todayonly[aria-pressed="true"] .td{ color: var(--joshua); }
  @media (max-width: 359px){ .ptab{ width: 62px; } .todayonly{ width: 50px; height: 50px; } }

  /* ---------- Balance bar opens stats ---------- */
  .balance{ cursor: pointer; border-radius: var(--radius-sm); -webkit-tap-highlight-color: transparent; }
  .balance:focus-visible{ outline: 2px solid var(--joshua); outline-offset: 4px; }
  .balance-foot{ display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .stats-hint{ font-size: 11px; font-weight: 700; color: var(--joshua); white-space: nowrap; margin-top: 5px; }
  header.top.compact .stats-hint{ display: none; }

  /* ---------- Stats sheet ---------- */
  .sheet-backdrop{ position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.28); }
  .sheet{
    position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); z-index: 41;
    width: min(640px, 100%); max-height: 86vh; overflow-y: auto;
    padding: 10px 18px calc(18px + env(safe-area-inset-bottom, 0px));
    border-radius: 28px 28px 0 0;
    background: var(--glass-strong);
    -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid var(--glass-edge); border-bottom: 0;
    box-shadow: inset 0 1px 0 var(--liquid-edge), 0 -12px 40px rgba(0,0,0,.25);
    animation: sheet-in .32s cubic-bezier(.2,.9,.3,1.1);
  }
  @keyframes sheet-in{ from{ transform: translate(-50%, 40%); opacity: 0; } to{ transform: translate(-50%, 0); opacity: 1; } }
  .sheet-grab{ width: 38px; height: 5px; border-radius: 99px; background: var(--line); margin: 0 auto 10px; }
  .sheet-head{ display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .sheet-head h2{ margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: 22px; font-weight: 600; }
  .sheet-tabs{ flex: 0 0 auto; min-width: 150px; }
  .sheet-close{ display: block; margin: 14px auto 0; font-weight: 700; font-size: 14px; color: var(--joshua); }
  .stats-range{ font-size: 12px; color: var(--ink-soft); margin: -6px 0 12px; }
  .stat-people{ display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-card{
    border-radius: var(--radius-sm); padding: 12px; background: var(--glass); border: 1px solid var(--glass-edge);
    box-shadow: inset 0 1px 0 var(--glass-edge);
  }
  .stat-card .who{ display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; }
  .stat-card .big{ font-size: 26px; font-weight: 700; margin-top: 6px; letter-spacing: -.02em; }
  .stat-card .big small{ font-size: 13px; font-weight: 600; color: var(--ink-soft); }
  .stat-card .meter{ height: 6px; border-radius: 99px; background: var(--line-soft); overflow: hidden; margin-top: 8px; }
  .stat-card .meter span{ display: block; height: 100%; border-radius: 99px; }
  .stat-card .sub{ font-size: 11.5px; color: var(--ink-soft); margin-top: 6px; }
  .stat-note{ font-size: 13px; margin: 12px 2px 0; line-height: 1.45; }
  .stat-chart{ margin-top: 16px; }
  .stat-chart h3{ font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); margin: 0 0 8px; font-weight: 700; }
  .bars{ display: flex; align-items: flex-end; gap: 6px; height: 110px; }
  .bars .col{ flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; }
  .bars .stack{ flex: 1; width: 100%; max-width: 30px; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; }
  .bars .stack span{ display: block; border-radius: 5px; min-height: 0; }
  .bars .lbl{ font-size: 10px; color: var(--ink-soft); font-weight: 600; }
  .bars .col.now .lbl{ color: var(--ink); }
  .legend{ display: flex; gap: 12px; font-size: 11px; color: var(--ink-soft); margin-top: 8px; }
  .legend span{ display: inline-flex; align-items: center; gap: 5px; }

  /* ---------- Liquid glass on every control ----------
     The bottom bar's glass and liquid drop, carried over to the other buttons and menus. */
  :root{ --spring: cubic-bezier(.34,1.56,.64,1); }

  /* Segmented controls (This week / House rules, Week / Month) become glass bars with a liquid drop */
  .tabs{
    --pad: 3px;
    position: relative; isolation: isolate;
    background: linear-gradient(180deg, var(--bar-top), var(--glass) 60%);
    -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid var(--glass-edge);
    box-shadow: inset 0 1px 0 var(--liquid-edge), inset 0 -8px 18px -12px var(--liquid-fill), 0 6px 18px -10px var(--bar-shadow);
    touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .pill-bar::after, .tabs::after{
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: radial-gradient(120px 60px at var(--mx, 30%) -10%, var(--liquid-edge), transparent 70%);
    opacity: .45; mix-blend-mode: soft-light;
  }
  .tabs button{ position: relative; z-index: 2; transition: color .25s ease, transform .35s var(--spring); }
  .tabs button.active{ background: transparent; box-shadow: none; color: var(--ink); }
  .tabs button:active{ transform: scale(.94); }
  html[data-theme="chief"] .tabs .liquid, html[data-theme="chief"] .tabs .hover-glow{ border-radius: 2px; }

  /* Selected chips and pickers: a still drop of liquid, tinted with the person's colour */
  .persongroup button.sel.J, .persongroup button.sel.A, .persongroup button.sel.BOTH,
  .ruleform .persongroup button.sel.ALT, html .themeopt.active, .yearchip.active{
    --tint: color-mix(in srgb, var(--lc, var(--ink)) 26%, transparent);
    background:
      radial-gradient(120% 90% at 50% 0%, var(--liquid-edge) 0%, transparent 55%),
      linear-gradient(180deg, var(--liquid-fill), var(--tint));
    border-color: var(--liquid-edge);
    color: var(--ink);
    box-shadow: inset 0 1px 1px var(--liquid-edge), inset 0 -6px 12px -6px var(--tint), 0 4px 12px -6px var(--bar-shadow);
  }
  .persongroup button.sel.J{ --lc: var(--joshua); }
  .persongroup button.sel.A{ --lc: var(--amrit); }
  .persongroup button.sel.BOTH{ --lc: var(--both); }
  /* Unselected chips: clear glass */
  .persongroup button, .themeopt, .yearchip, .menu .signout{
    background: color-mix(in srgb, var(--surface) 35%, transparent);
    border: 1px solid var(--glass-edge);
    box-shadow: inset 0 1px 0 var(--glass-edge);
    transition: transform .35s var(--spring), background .2s ease, color .2s ease;
  }
  .persongroup button:active, .themeopt:active, .yearchip:active, .menu .signout:active{ transform: scale(.94); }
  .persongroup button{ border-radius: 999px; padding: 6px 11px; }

  /* Round glass buttons with a lit rim and a springy press */
  .weeknav .navbtn{
    box-shadow: inset 0 1px 0 var(--liquid-edge), 0 6px 16px -8px var(--bar-shadow);
    transition: width .28s ease, height .28s ease, transform .35s var(--spring);
  }
  .weeknav .navbtn:active:not(:disabled){ transform: scale(.88); }
  .addbtn{ background: color-mix(in srgb, var(--surface) 22%, transparent); transition: transform .35s var(--spring), border-color .2s ease, color .2s ease; }
  .addbtn:active{ transform: scale(.98); }

  /* Primary buttons: a glossy liquid capsule */
  .btn-primary{
    position: relative; overflow: hidden; border-radius: 999px;
    box-shadow: inset 0 1px 1px rgba(255,255,255,.45), inset 0 -2px 4px rgba(0,0,0,.14), 0 4px 12px -4px var(--bar-shadow);
    transition: transform .35s var(--spring);
  }
  .btn-primary::after{
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,.32), rgba(255,255,255,0) 55%);
  }
  .btn-primary:active{ transform: scale(.95); }
  html[data-theme="chief"] .btn-primary{ border-radius: 3px; }

  /* Menus and sheets: lit rim, soft inner glow and a gentle sheen */
  .menu{ box-shadow: inset 0 1px 0 var(--liquid-edge), inset 0 -14px 30px -20px var(--liquid-fill), 0 18px 40px -12px var(--bar-shadow); }
  .menu::before, .sheet::before{
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1;
    background: radial-gradient(140% 60% at 30% -10%, var(--liquid-edge), transparent 60%);
    opacity: .3;
  }
  .menu:not([hidden]){ transform-origin: 24px -8px; animation: menu-in .38s var(--spring); }
  @keyframes menu-in{ from{ opacity: 0; transform: scale(.9) translateY(-6px); } to{ opacity: 1; transform: none; } }

  /* ---------- To-do list ---------- */
  .todo-add{ display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; padding: 12px; }
  .todo-input-row{ display: flex; gap: 8px; }
  .todo-input-row input{
    flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 9px 12px; font-size: 15px;
    background: color-mix(in srgb, var(--surface) 70%, transparent); color: var(--ink);
  }
  .todo-input-row .btn-primary{ padding: 8px 18px; font-size: 13.5px; }
  .todo-add .persongroup{ flex-wrap: wrap; }
  .todo-add .persongroup button.sel.ANY{
    --tint: color-mix(in srgb, var(--ink) 26%, transparent);
    background: radial-gradient(120% 90% at 50% 0%, var(--liquid-edge) 0%, transparent 55%), linear-gradient(180deg, var(--liquid-fill), var(--tint));
    border-color: var(--liquid-edge); color: var(--ink);
    box-shadow: inset 0 1px 1px var(--liquid-edge), inset 0 -6px 12px -6px var(--tint), 0 4px 12px -6px var(--bar-shadow);
  }
  .todo-empty{ padding: 22px 16px; text-align: center; font-size: 13.5px; color: var(--ink-soft); }
  @media (max-width: 359px){   /* three header tabs on very small phones */
    .brand .tabs button{ padding: 6px 5px; font-size: 11.5px; }
    html[data-theme="covenant"] .brand h1{ font-size: 16px; }
    html[data-theme="chief"] .brand h1{ font-size: 16px; letter-spacing: .02em; }
    html[data-theme="cortana"] .brand h1{ font-size: 18px; }
    .brand .sub{ letter-spacing: .04em; }
  }
  .todo-done .dayhead .dname{ font-size: 14px; }

  /* ---------- Person pickers as liquid glass (task form, rule form, to-do) ---------- */
  .persongroup.lq{
    --pad: 3px;
    position: relative; isolation: isolate; display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px;
    background: linear-gradient(180deg, var(--bar-top), var(--glass) 60%);
    -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid var(--glass-edge);
    box-shadow: inset 0 1px 0 var(--liquid-edge), inset 0 -8px 18px -12px var(--liquid-fill), 0 6px 18px -10px var(--bar-shadow);
    touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .ruleform .persongroup.lq{ display: flex; }
  .persongroup.lq::after{
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: radial-gradient(120px 60px at var(--mx, 30%) -10%, var(--liquid-edge), transparent 70%);
    opacity: .45; mix-blend-mode: soft-light;
  }
  .persongroup.lq button.pbtn,
  .persongroup.lq button.pbtn.sel{
    position: relative; z-index: 2;
    background: transparent; border-color: transparent; box-shadow: none;
    border-radius: 999px; color: var(--ink-soft);
    transition: color .25s ease, transform .35s var(--spring);
  }
  .persongroup.lq button.pbtn:hover{ color: var(--ink); }
  .persongroup.lq button.pbtn.sel{ color: var(--ink); }
  .persongroup.lq button.pbtn:active{ transform: scale(.94); }
  html[data-theme="chief"] .persongroup.lq,
  html[data-theme="chief"] .persongroup.lq .liquid,
  html[data-theme="chief"] .persongroup.lq .hover-glow{ border-radius: 3px; }

  /* ---------- Meals ---------- */
  .tonight{ padding: 16px; margin-bottom: 14px; }
  .tonight-label{ font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--joshua); }
  .tonight-meal{ font-family: 'Fraunces', Georgia, serif; font-size: 24px; font-weight: 600; line-height: 1.2; margin: 6px 0 8px; }
  .tonight-meal.muted{ color: var(--ink-soft); font-size: 18px; }
  .tonight-meta{ display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-soft); }
  .tonight-next{ margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line-soft); font-size: 13px; color: var(--ink-soft); }
  .tonight-next strong{ color: var(--ink); font-weight: 600; }
  .tonight .btn-primary{ margin-top: 2px; }
  .meal-weekbar{ margin: 0 0 12px; }
  ul.tasks li:has(> .meal-row){ border-bottom: 1px solid var(--line-soft); }
  ul.tasks li:has(> .meal-row):last-child{ border-bottom: none; }
  .meal-row{
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 16px;
    background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer;
    transition: background .2s ease;
  }
  .meal-row:hover{ background: color-mix(in srgb, var(--ink) 4%, transparent); }
  .meal-row.is-today{ box-shadow: inset 3px 0 0 var(--joshua); }
  .meal-day{ display: flex; flex-direction: column; align-items: center; width: 34px; flex-shrink: 0; }
  .md-name{ font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft); }
  .meal-row.is-today .md-name{ color: var(--joshua); }
  .md-date{ font-size: 17px; font-weight: 600; margin-top: 1px; }
  .meal-main{ flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .meal-name{ font-size: 15px; font-weight: 500; overflow-wrap: anywhere; }
  .meal-name.muted{ color: var(--ink-soft); font-weight: 400; }
  .meal-row .chev{ color: var(--ink-soft); font-size: 18px; }
  .meal-edit{ display: flex; flex-direction: column; gap: 9px; padding: 14px 16px; border-bottom: 1px solid var(--line-soft); }
  .meal-edit-day{ font-weight: 700; font-size: 13px; color: var(--joshua); }
  .meal-edit .lbl{ display: flex; flex-direction: column; gap: 4px; font-size: 11px; font-weight: 600; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .05em; }
  .meal-edit .lbl .hint{ text-transform: none; letter-spacing: 0; font-weight: 400; }
  .meal-edit input, .meal-edit textarea, .paste-card textarea{
    border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 9px 11px; font: inherit; font-size: 15px;
    background: color-mix(in srgb, var(--surface) 70%, transparent); color: var(--ink); width: 100%; resize: vertical;
    text-transform: none; letter-spacing: 0; font-weight: 400;
  }
  .meal-edit .formbtns, .paste-card .formbtns{ margin-left: 0; justify-content: flex-end; }
  .paste-open{ margin-bottom: 14px; }
  .paste-card{ display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; padding: 14px; }
  .paste-card .dname{ font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 16px; }
  .paste-card .rules-intro{ margin: 0; }
  .plan-preview ul{ list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13px; }
  .shop .shop-head{ align-items: center; }
  .shop-copy{ font-weight: 700; color: var(--joshua); }
  .dinner-banner{
    display: flex; align-items: center; gap: 8px; width: 100%; margin-bottom: 12px; padding: 10px 14px;
    border-radius: var(--radius); border: 1px solid var(--glass-edge); background: var(--glass); color: var(--ink);
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
    box-shadow: inset 0 1px 0 var(--glass-edge), var(--shadow); font: inherit; text-align: left; cursor: pointer;
  }
  .db-label{ font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--joshua); }
  .db-meal{ font-weight: 600; font-size: 14px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .db-cook{ font-size: 11.5px; color: var(--ink-soft); white-space: nowrap; }
  .dinner-banner .chev{ color: var(--ink-soft); }
  /* House rules: tucked away at the bottom of the Chores list */
  .rules-link{
    display: flex; align-items: center; gap: 10px; width: 100%; margin-top: 14px; padding: 12px 14px;
    border-radius: var(--radius-sm); border: 1px solid var(--glass-edge); background: color-mix(in srgb, var(--surface) 30%, transparent);
    box-shadow: inset 0 1px 0 var(--glass-edge); color: var(--ink); font: inherit; text-align: left; cursor: pointer;
    transition: transform .35s var(--spring), background .2s ease;
  }
  .rules-link:hover{ background: var(--glass); }
  .rules-link:active{ transform: scale(.98); }
  .rules-link .rl-text{ flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .rules-link .rl-title{ font-weight: 600; font-size: 14px; }
  .rules-link .rl-sub{ font-size: 12px; color: var(--ink-soft); }
  .rules-link .chev{ color: var(--ink-soft); font-size: 18px; }
  .rules-back{ margin: 0 0 6px -4px; font-weight: 700; color: var(--joshua); font-size: 14px; }

  /* ---------- Liquid hover on single buttons ----------
     The pill bars' best bit, on its own: a soft light that follows the pointer across the
     glass (and appears where you press on a phone). Script sets --hx / --hy. */
  :is(.rules-link, .addbtn, .btn-primary, .weeknav .navbtn, .todayonly, .iconbtn, .dinner-banner,
      .meal-row, .themeopt, .daycard .dayhead, .menu .signout, .yearchip, .balance, #weekLabel, .stat-card, .bars .col){ position: relative; isolation: isolate; }
  :is(.rules-link, .addbtn, .btn-primary, .weeknav .navbtn, .todayonly, .iconbtn, .dinner-banner,
      .meal-row, .themeopt, .daycard .dayhead, .menu .signout, .yearchip, .balance, #weekLabel, .stat-card, .bars .col)::before{
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1;
    background: radial-gradient(130px circle at var(--hx, 50%) var(--hy, 50%), color-mix(in srgb, var(--joshua) 30%, var(--liquid-edge)), transparent 65%);
    opacity: 0; transition: opacity .3s ease;
  }
  @media (hover: hover){
    :is(.rules-link, .addbtn, .btn-primary, .weeknav .navbtn, .todayonly, .iconbtn, .dinner-banner,
        .meal-row, .themeopt, .daycard .dayhead, .menu .signout, .yearchip, .balance, #weekLabel, .stat-card, .bars .col):hover::before{ opacity: .7; }
  }
  :is(.rules-link, .addbtn, .btn-primary, .weeknav .navbtn, .todayonly, .iconbtn, .dinner-banner,
      .meal-row, .themeopt, .daycard .dayhead, .menu .signout, .yearchip, .balance, #weekLabel, .stat-card, .bars .col):active::before{ opacity: .85; transition-duration: .05s; }

  /* Stats: the week's dates open them too; chart columns show their minutes on hover / tap */
  #weekLabel{ cursor: pointer; border-radius: var(--radius-sm); padding: 2px 6px; -webkit-tap-highlight-color: transparent; }
  #weekLabel:focus-visible{ outline: 2px solid var(--joshua); outline-offset: 2px; }
  .bars .col{ border-radius: 8px; padding-top: 2px; }
  .bars .col .val{ font-size: 10px; color: var(--ink); opacity: 0; transition: opacity .2s ease; }
  .bars .col:hover .val, .bars .col:active .val{ opacity: 1; }
  .stat-card{ transition: transform .35s var(--spring); }
  .stat-card:active{ transform: scale(.98); }

  /* iOS Dark: the iOS theme's dark mode, whatever the phone is set to */
  html[data-theme="ios"][data-ios="dark"]{
    --bg: #000000;
    --bg-alt: rgba(118,118,128,.24);
    --surface: #1C1C1E;
    --ink: #FFFFFF;
    --ink-soft: rgba(235,235,245,.6);
    --line: rgba(84,84,88,.6);
    --line-soft: rgba(84,84,88,.35);
    --danger: #FF453A;
    --joshua: #0A84FF;
    --joshua-soft: rgba(10,132,255,.2);
    --amrit: #FF375F;
    --amrit-soft: rgba(255,55,95,.2);
    --both: #FF9F0A;
    --both-soft: rgba(255,159,10,.2);
    --shadow: 0 8px 32px rgba(0,0,0,.4);
    --glass: rgba(44,44,46,.55);
    --glass-strong: rgba(36,36,38,.86);
    --glass-edge: rgba(255,255,255,.14);

<script>
  // The store module below resolves this once data is loaded (from Firebase or this device).
  window.storeReady = new Promise(resolve => { window.__resolveStore = resolve; });
</script>
<script type="module">
/* ---------- store: Firebase when configured, otherwise this device only ---------- */
const SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
const cfg = window.FIREBASE_CONFIG;
const LS = { schedule: 'jamrit_schedule', checked: 'jamrit_checked', rules: 'jamrit_rules', todos: 'jamrit_todos', meals: 'jamrit_meals' };

function lsGet(k){ try{ return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k, v){ localStorage.setItem(k, v); }   // let failures surface as "Couldn't save"

function localStore(){
  let checked = {};
  try{ checked = JSON.parse(lsGet(LS.checked) || '{}') || {}; } catch(e){}
  let schedule = null;
  try{ schedule = JSON.parse(lsGet(LS.schedule) || 'null'); } catch(e){}
  let rules = null;
  try{ rules = JSON.parse(lsGet(LS.rules) || 'null'); } catch(e){}
  let todos = {};
  try{ todos = JSON.parse(lsGet(LS.todos) || '{}') || {}; } catch(e){}
  let meals = {};
  try{ meals = JSON.parse(lsGet(LS.meals) || '{}') || {}; } catch(e){}
  return {
    mode: 'local',
    schedule, checked, rules, todos, meals, user: null, memberName: null,
    async setMeal(date, meal){
      if (meal) meals[date] = meal; else delete meals[date];
      lsSet(LS.meals, JSON.stringify(meals));
    },
    async saveSchedule(s){ lsSet(LS.schedule, JSON.stringify(s)); },
    async saveRules(r){ lsSet(LS.rules, JSON.stringify(r)); },
    async setChecked(ids, on){
      ids.forEach(id => { if (on) checked[id] = true; else delete checked[id]; });
      lsSet(LS.checked, JSON.stringify(checked));
    },
    async setTodo(id, item){
      if (item) todos[id] = item; else delete todos[id];
      lsSet(LS.todos, JSON.stringify(todos));
    },
    subscribe(){},
    signOut: null,
  };
}

// An invite link (…?join=CODE) is held on to while the person signs in, then offered to them.
const INVITE_KEY = 'jamrit_invite';
function inviteCodeIn(text){
  const m = String(text || '').match(/[?&]join=([a-z0-9]+)/i) || String(text || '').match(/^\s*([a-z0-9]{10,})\s*$/i);
  return m ? m[1].toLowerCase() : null;
}
{
  const code = inviteCodeIn(location.search);
  if (code){
    try{ localStorage.setItem(INVITE_KEY, code); } catch(e){}
    history.replaceState(null, '', location.pathname + location.hash);
  }
}

const gate = document.getElementById('authGate');
const authMsg = document.getElementById('authMsg');
const signInBtn = document.getElementById('signInBtn');
const authSignOut = document.getElementById('authSignOut');
// step: which part of the card to show under the message (naming, first-run choice, joining).
function showGate(msg, canSwitch, step){
  authMsg.textContent = msg;
  signInBtn.style.display = canSwitch ? 'none' : '';
  authSignOut.style.display = canSwitch ? '' : 'none';
  ['nameStep', 'startStep', 'joinStep'].forEach(s => { document.getElementById(s).style.display = s === step ? '' : 'none'; });
  gate.style.display = '';
}

async function cloudStore(){
  const [{ initializeApp }, fs, au] = await Promise.all([
    import(SDK + 'firebase-app.js'),
    import(SDK + 'firebase-firestore.js'),
    import(SDK + 'firebase-auth.js'),
  ]);
  const app = initializeApp(cfg);
  const auth = au.getAuth(app);
  const db = fs.getFirestore(app);
  // The board lives under the chosen household: households/{id}/board/*.
  let scheduleRef, checkedRef, rulesRef, todosRef, mealsRef;
  function pointAt(hid){
    const at = name => fs.doc(db, 'households', hid, 'board', name);
    scheduleRef = at('schedule'); checkedRef = at('checked'); rulesRef = at('rules'); todosRef = at('todos'); mealsRef = at('meals');
  }
  const BOARD_DOCS = ['schedule', 'checked', 'rules', 'todos', 'meals'];

  // A household's open invite links, as { code: { role, expires (ms) } }; expired ones are left out.
  const openInvites = m => Object.fromEntries(Object.entries(m || {})
    .map(([code, v]) => [code, { role: v.role, expires: v.expiresAt && v.expiresAt.toMillis ? v.expiresAt.toMillis() : 0 }])
    .filter(([, v]) => v.expires > Date.now()));

  // Firebase calls give up after 15 seconds, rather than leaving the page on "Loading…".
  const within = p => Promise.race([p, new Promise((_, reject) => setTimeout(() => reject(new Error('Timed out reaching Firebase')), 15000))]);

  // Ask whoever sets up the household what to call it. Owners can rename it later in settings.
  // canGoBack: offer "‹ Back" to the first-run choice (resolves null).
  function askHouseholdName(canGoBack){
    return new Promise(resolve => {
      showGate('Name your household. Everyone in it will see this name, and owners can change it later.', canGoBack, 'nameStep');
      const input = document.getElementById('hhName'), btn = document.getElementById('hhNameBtn'), back = document.getElementById('hhNameBack');
      back.style.display = canGoBack ? '' : 'none';
      input.focus();
      const done = () => {
        const name = input.value.trim().slice(0, 40);
        if (!name){ input.focus(); return; }
        btn.disabled = true;
        resolve(name);
      };
      btn.disabled = false;
      btn.onclick = done;
      input.onkeydown = e => { if (e.key === 'Enter') done(); };
      back.onclick = () => resolve(null);
    });
  }

  // First run, for someone who isn't in a household: start one, or join one with an invite link.
  function askStart(user){
    return new Promise(resolve => {
      showGate(`Welcome! You're signed in as ${user.email}. Start a household of your own, or join someone else's.`, true, 'startStep');
      document.getElementById('startHint').textContent = 'To join, ask someone in the household to send you an invite link (owners find it under People). '
        + `Or they can add ${user.email}, and you'll be in when you next open the app.`;
      const input = document.getElementById('joinCode'), err = document.getElementById('joinCodeErr');
      err.textContent = '';
      document.getElementById('startCreate').onclick = () => resolve({ create: true });
      const join = () => {
        const code = inviteCodeIn(input.value);
        if (!code){ err.textContent = "That doesn't look like an invite link."; input.focus(); return; }
        input.value = '';
        resolve({ code });
      };
      document.getElementById('joinCodeBtn').onclick = join;
      input.onkeydown = e => { if (e.key === 'Enter') join(); };
    });
  }

  // Offer to join the household an invite link is for. Resolves with its id once joined, or
  // null if the link has expired or they'd rather not.
  async function offerInvite(user, code, households){
    const email = user.email.toLowerCase();
    let inv = null;
    try{
      const snap = await within(fs.getDoc(fs.doc(db, 'invites', code)));
      if (snap.exists() && snap.data().expiresAt.toMillis() > Date.now()) inv = snap.data();
    } catch(e){ console.error(e); }
    if (inv && households.some(h => h.id === inv.hid)) return inv.hid;   // already in it
    const yes = document.getElementById('joinYes'), no = document.getElementById('joinNo');
    return new Promise(resolve => {
      const stop = msg => { authMsg.textContent = msg; yes.style.display = 'none'; no.textContent = 'Continue'; };
      showGate(inv ? `Join ${inv.name}? You'll be able to ${inv.role === 'viewer' ? 'see its board, but not change anything' : 'see and change its board'}.` : '', true, 'joinStep');
      yes.style.display = ''; yes.disabled = false; no.textContent = 'Not now';
      if (!inv) stop('That invite link has expired or been cancelled. Ask for a new one.');
      no.onclick = () => resolve(null);
      yes.onclick = async () => {
        yes.disabled = true;
        try{
          await within(fs.updateDoc(fs.doc(db, 'households', inv.hid),
            new fs.FieldPath('members', email), inv.role, 'memberEmails', fs.arrayUnion(email), 'joinedWith', code));
          resolve(inv.hid);
        } catch(e){
          console.error(e);
          stop("Couldn't join. The link may have been cancelled, or the household already has 8 people.");
        }
      };
    });
  }

  // Get someone into a household: an invite link they opened comes first; then, if they
  // aren't in any household, they choose to create one or join one.
  async function onboard(user, households){
    let code = null;
    try{ code = localStorage.getItem(INVITE_KEY); localStorage.removeItem(INVITE_KEY); } catch(e){}
    for (;;){
      if (code){
        const hid = await offerInvite(user, code, households);
        code = null;
        if (hid){
          try{ localStorage.setItem('jamrit_household', hid); } catch(e){}
          return findHouseholds(user, false);
        }
      }
      if (households.length) return households;
      const choice = await askStart(user);
      if (choice.code){ code = choice.code; continue; }
      const name = await askHouseholdName(true);
      if (!name) continue;
      const id = await within(createHousehold(user, name));
      try{ localStorage.setItem('jamrit_household', id); } catch(e){}
      return findHouseholds(user, false);
    }
  }

  // Find the households this account belongs to. The original two members are moved into
  // one shared household the first time they open the app: the first one names it, creates it and copies the
  // old board across (the old board is left as it was, as a backup); the other one joins it.
  async function findHouseholds(user, isLegacy){
    const email = user.email.toLowerCase();
    const q = fs.query(fs.collection(db, 'households'), fs.where('memberEmails', 'array-contains', email));
    let list = (await within(fs.getDocs(q))).docs.map(d => ({ id: d.id, ...d.data() }));
    if (!list.length && isLegacy){
      const ref = fs.doc(db, 'households', 'home');
      const snap = await within(fs.getDoc(ref));
      if (!snap.exists()){
        const name = await askHouseholdName(false);
        await fs.setDoc(ref, { name, members: { [email]: 'owner' }, memberEmails: [email], createdBy: email, createdAt: fs.serverTimestamp() });
        const batch = fs.writeBatch(db);
        for (const name of BOARD_DOCS){
          const old = await fs.getDoc(fs.doc(db, 'board', name));
          if (old.exists()) batch.set(fs.doc(db, 'households', 'home', 'board', name), old.data());
        }
        await batch.commit();
      } else {
        await fs.updateDoc(ref, new fs.FieldPath('members', email), 'owner', 'memberEmails', fs.arrayUnion(email));
      }
      const joined = await fs.getDoc(ref);
      list = [{ id: joined.id, ...joined.data() }];
    }
    return list;
  }

  // A new household starts with an empty board: no house rules and no weeks yet.
  // The household has to exist first, since the board's rules look up who's in it.
  async function createHousehold(user, name){
    const email = user.email.toLowerCase();
    const ref = fs.doc(fs.collection(db, 'households'));
    await fs.setDoc(ref, { name, members: { [email]: 'owner' }, memberEmails: [email], createdBy: email, createdAt: fs.serverTimestamp() });
    const batch = fs.writeBatch(db);
    const stamp = { updatedBy: user.email, updatedAt: fs.serverTimestamp() };
    batch.set(fs.doc(db, 'households', ref.id, 'board', 'rules'), { json: '[]', ...stamp });
    batch.set(fs.doc(db, 'households', ref.id, 'board', 'schedule'), { json: JSON.stringify({ weeks: [] }), ...stamp });
    await batch.commit();
    return ref.id;
  }

  signInBtn.onclick = async () => {
    const provider = new au.GoogleAuthProvider();
    try{ await au.signInWithPopup(auth, provider); }
    catch(e){
      if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') au.signInWithRedirect(auth, provider);
      else if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') showGate('Sign-in failed: ' + e.code, false);
    }
  };
  authSignOut.onclick = () => au.signOut(auth);

  // Wait until someone is signed in and allowed to read the board.
  for (;;){
    const user = await new Promise(resolve => {
      const stop = au.onAuthStateChanged(auth, u => { if (u){ stop(); resolve(u); } else showGate('Sign in so your ticks and edits sync between both phones.', false); });
    });
    try{
      const mSnap = await within(fs.getDoc(fs.doc(db, 'members', user.email)));
      // "Use a different account" during onboarding starts over with the new account.
      const signedOut = new Promise(resolve => { const stop = au.onAuthStateChanged(auth, u => { if (!u){ stop(); resolve(null); } }); });
      const households = await Promise.race([findHouseholds(user, mSnap.exists()).then(list => onboard(user, list)), signedOut]);
      if (!households) continue;
      if (!households.length) throw new Error('No household after onboarding');
      // Open the household this phone used last, otherwise the first one.
      let savedId = null;
      try{ savedId = localStorage.getItem('jamrit_household'); } catch(e){}
      const household = households.find(h => h.id === savedId) || households[0];
      try{ localStorage.setItem('jamrit_household', household.id); } catch(e){}
      const me = user.email.toLowerCase();
      const role = household.members[me];
      const hhRef = fs.doc(db, 'households', household.id);
      pointAt(household.id);

      const [sSnap, cSnap, rSnap, tSnap, mealSnap] = await within(Promise.all([
        fs.getDoc(scheduleRef), fs.getDoc(checkedRef), fs.getDoc(rulesRef), fs.getDoc(todosRef), fs.getDoc(mealsRef),
      ]));
      const canEdit = role === 'owner' || role === 'editor';
      if (canEdit){   // viewers can't write, so only editors set up empty documents
        if (!cSnap.exists()) await fs.setDoc(checkedRef, { ids: {} }, { merge: true });
        if (!tSnap.exists()) await fs.setDoc(todosRef, { items: {} }, { merge: true });
        if (!mealSnap.exists()) await fs.setDoc(mealsRef, { days: {} }, { merge: true });
      }
      gate.style.display = 'none';
      let schedule = null, rules = null;
      if (sSnap.exists()){ try{ schedule = JSON.parse(sSnap.data().json); } catch(e){} }
      if (rSnap.exists()){ try{ rules = JSON.parse(rSnap.data().json); } catch(e){} }
      return {
        mode: 'cloud',
        user, schedule, rules,
        household: { id: household.id, name: household.name, role, members: { ...household.members }, invites: openInvites(household.invites) },
        households: households.map(h => ({ id: h.id, name: h.name, role: h.members[me] })),
        memberName: mSnap.exists() ? (mSnap.data().name || null) : null,
        checked: cSnap.exists() ? { ...(cSnap.data().ids || {}) } : {},
        todos: tSnap.exists() ? { ...(tSnap.data().items || {}) } : {},
        meals: mealSnap.exists() ? { ...(mealSnap.data().days || {}) } : {},
        async setMeal(date, meal){
          // One field per day, so you can both plan different days at once.
          await fs.updateDoc(mealsRef, new fs.FieldPath('days', date), meal || fs.deleteField());
        },
        async saveSchedule(s){
          await fs.setDoc(scheduleRef, { json: JSON.stringify(s), updatedBy: user.email, updatedAt: fs.serverTimestamp() });
        },
        async saveRules(r){
          await fs.setDoc(rulesRef, { json: JSON.stringify(r), updatedBy: user.email, updatedAt: fs.serverTimestamp() });
        },
        async setChecked(ids, on){
          if (!ids.length) return;
          // Only touch the ticks that changed, so both of you can tick at the same time safely.
          const args = [];
          ids.forEach(id => { args.push(new fs.FieldPath('ids', id), on ? true : fs.deleteField()); });
          await fs.updateDoc(checkedRef, ...args);
        },
        async setTodo(id, item){
          // One field per to-do, so you can both add and tick at the same time.
          await fs.updateDoc(todosRef, new fs.FieldPath('items', id), item || fs.deleteField());
        },
        async renameHousehold(name){
          await fs.updateDoc(hhRef, { name });
        },
        // Add someone (by their Google email), change their role, or remove them (role null).
        // Adding an email is the invite: they join by signing in with that account.
        async setMember(email, role){
          await fs.updateDoc(hhRef, new fs.FieldPath('members', email), role || fs.deleteField(),
            'memberEmails', role ? fs.arrayUnion(email) : fs.arrayRemove(email));
        },
        async createHousehold(name){
          return createHousehold(user, name);
        },
        // An invite link: anyone who opens it can join with this role for the next 7 days.
        // The invite is saved on its own (so the person joining can read it) and listed on the
        // household (so owners see it, and can cancel it by taking it off).
        async createInvite(role, name){
          const ABC = 'abcdefghjkmnpqrstuvwxyz23456789';
          const code = [...crypto.getRandomValues(new Uint8Array(12))].map(n => ABC[n % ABC.length]).join('');
          const expiresAt = fs.Timestamp.fromMillis(Date.now() + 7 * 864e5);
          await fs.setDoc(fs.doc(db, 'invites', code), { hid: household.id, name, role, createdBy: me, expiresAt });
          await fs.updateDoc(hhRef, new fs.FieldPath('invites', code), { role, expiresAt });
          return { code, role, expires: expiresAt.toMillis() };
        },
        async cancelInvite(code){
          await fs.updateDoc(hhRef, new fs.FieldPath('invites', code), fs.deleteField());
          try{ await fs.deleteDoc(fs.doc(db, 'invites', code)); } catch(e){}   // taking it off the household is what stops it working
        },
        subscribe(onChange){
          fs.onSnapshot(hhRef, snap => {
            if (snap.metadata.hasPendingWrites) return;
            const h = snap.exists() ? snap.data() : { members: {} };
            onChange('household', { id: household.id, name: h.name, role: (h.members || {})[me], members: { ...(h.members || {}) }, invites: openInvites(h.invites) });
          }, err => {   // removed by an owner, so it can't be read any more
            if (err.code === 'permission-denied') onChange('household', { id: household.id, role: undefined, members: {} });
          });
          fs.onSnapshot(scheduleRef, snap => {
            if (snap.metadata.hasPendingWrites || !snap.exists()) return;
            try{ onChange('schedule', JSON.parse(snap.data().json)); } catch(e){}
          });
          fs.onSnapshot(checkedRef, snap => {
            if (snap.metadata.hasPendingWrites || !snap.exists()) return;
            onChange('checked', { ...(snap.data().ids || {}) });
          });
          fs.onSnapshot(rulesRef, snap => {
            if (snap.metadata.hasPendingWrites || !snap.exists()) return;
            try{ onChange('rules', JSON.parse(snap.data().json)); } catch(e){}
          });
          fs.onSnapshot(todosRef, snap => {
            if (snap.metadata.hasPendingWrites || !snap.exists()) return;
            onChange('todos', { ...(snap.data().items || {}) });
          });
          fs.onSnapshot(mealsRef, snap => {
            if (snap.metadata.hasPendingWrites || !snap.exists()) return;
            onChange('meals', { ...(snap.data().days || {}) });
          });
        },
        signOut: () => au.signOut(auth).then(() => location.reload()),
      };
    } catch(e){
      if (e.code === 'permission-denied'){
        showGate(user.email + " isn't on the board. Ask the household's owner to add it, or switch account.", true);
        await new Promise(resolve => { const stop = au.onAuthStateChanged(auth, u => { if (!u){ stop(); resolve(); } }); });
      } else {
        throw e;
      }
    }
  }
}

  try{ store = await cloudStore(); }
  catch(e){ console.error('Firebase failed, using this device only', e); store = localStore(); store.cloudError = true; }
} else {
  store = localStore();
}
window.__resolveStore(store);
</script>

/* ---------- utils ---------- */
function uid(){
  if (window.crypto && crypto.randomUUID) return 'u_' + crypto.randomUUID();
  return 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2);
}
function addDays(dateStr, n){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function yearOf(week){ return parseInt(week.week_start.slice(0,4), 10); }
function fmtRange(w){
  const s = new Date(w.week_start + 'T00:00:00');
  const e = new Date(w.week_end + 'T00:00:00');
  return s.toLocaleDateString('en-GB', {day:'numeric',month:'short'}) + ' – ' + e.toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'});
}
function formatDayDate(dateStr){
  return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'});
}
function escapeHTML(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeAttr(s){ return escapeHTML(s).replace(/"/g,'&quot;'); }

function dayMinutes(day){ return day.tasks.reduce((a,t)=>a+t.minutes,0); }

/* ---------- week generator: builds weeks from the house rules ---------- */
const EPOCH = '2026-08-24';            // Monday of rotation week 1
const DOWS = ['MON','TUE','WED','THU','FRI','SAT','SUN'];
const PERSON_ORDER = { J:0, A:1, BOTH:2 };
const WEEKS_AHEAD = 4;                 // always keep this many weeks after the current one

function daysSinceEpoch(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  return Math.round((Date.UTC(y,m-1,d) - Date.UTC(2026,7,24)) / 864e5);
}
function mod(n, m){ return ((n % m) + m) % m; }
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function mondayOf(dateStr){ return addDays(dateStr, -mod(daysSinceEpoch(dateStr), 7)); }

// Who does a rule's nth occurrence (n counts from the first turn).
function personFor(rule, n){
  if (rule.who !== 'ALT') return rule.who;
  const other = rule.first === 'A' ? 'J' : 'A';
  return mod(n, 2) === 0 ? (rule.first || 'J') : other;
}
function generateWeek(weekStart, rules){
  const wi = Math.floor(daysSinceEpoch(weekStart) / 7);
  const days = DOWS.map((dow, i) => ({ date: addDays(weekStart, i), dow, tasks: [] }));
  rules.forEach(rule => {
    days.forEach((day, i) => {
      const di = wi*7 + i;
      let n = null;
      if (rule.freq === 'daily') n = di;
      else if (rule.freq === 'alt-days'){ const k = di - (rule.weeks||0); if (mod(k,2)===0) n = k/2; }
      else if (rule.freq === 'weekly'){ if (day.dow === rule.day) n = wi; }
      else if (rule.freq === 'fortnightly'){ const k = wi - (rule.weeks||0); if (day.dow === rule.day && mod(k,2)===0) n = k/2; }
      if (n === null) return;
      // Fixed ids, so two phones generating the same week produce identical tasks.
      day.tasks.push({ id: `g_${day.date}_${rule.id}`, person: personFor(rule, n), task: rule.chore, minutes: rule.minutes, rule: rule.id });
    });
  });
  days.forEach(d => d.tasks.sort((a,b) => (PERSON_ORDER[a.person]-PERSON_ORDER[b.person]) || a.task.localeCompare(b.task)));
  return { sheet_name: weekStart, week_start: weekStart, week_end: addDays(weekStart, 6),
           rotation_week: mod(wi, 4) + 1, days, generated: true };
}
// Add generated weeks so the schedule always reaches WEEKS_AHEAD weeks past today. Returns true if it added any.
function ensureWeeksAhead(){
  const target = addDays(mondayOf(todayStr()), 7*WEEKS_AHEAD);
  const weeks = SCHEDULE.weeks;
  let added = false;
  while (!weeks.length || weeks[weeks.length-1].week_start < target){
    const next = weeks.length ? addDays(weeks[weeks.length-1].week_start, 7) : mondayOf(todayStr());
    weeks.push(generateWeek(next, RULES));
    added = true;
  }
  return added;
}
function weekSignature(w){
  return w.days.flatMap(d => d.tasks.map(t => `${d.date}|${t.person}|${t.task}|${t.minutes}`)).sort().join('\n');
}
// After the rules change, rebuild every week after this one that nobody has edited by hand.
// A week counts as untouched if it still matches what the old rules would have produced.
function regenerateFutureWeeks(oldRules){
  const thisWeek = mondayOf(todayStr());
  SCHEDULE.weeks = SCHEDULE.weeks.map(w => {
    if (w.week_start <= thisWeek || w.edited) return w;
    if (weekSignature(w) !== weekSignature(generateWeek(w.week_start, oldRules))) return w;
    return generateWeek(w.week_start, RULES);
  });
}

function findCurrentWeekIndex(){
  const today = todayStr();   // 'YYYY-MM-DD' strings compare in date order
  const weeks = SCHEDULE.weeks;
  for (let i=0;i<weeks.length;i++){
    if (today >= weeks[i].week_start && today <= weeks[i].week_end) return i;
  }
  if (today < weeks[0].week_start) return 0;
  return weeks.length-1;
}

  SCHEDULE = store.schedule && store.schedule.weeks ? store.schedule : { weeks: SEED_WEEKS };

// Swap a row for a name box and a button (renaming or creating a household).
function inlineNameInput(row, value, label, onSave, placeholder){

// Shows the change straight away, and puts it back if it couldn't be saved.
async function saveMember(email, role){
  const h = store.household, isMe = email === store.user.email.toLowerCase();
  const apply = r => {
    if (r) h.members[email] = r; else delete h.members[email];
    if (isMe){ h.role = r; applyReadOnly(); renderHouseholdName(); renderAll(); }
  };
  const before = h.members[email];
  apply(role);
  setSyncNote('Saving…');
  try{ await store.setMember(email, role); setSyncNote(savedNote()); return true; }
  catch(err){
    console.error(err); apply(before);
    setSyncNote("Couldn't save. Check your connection.");
    if (householdOpen()) renderHouseholdSheet(isMe);
    return false;
  }

async function addMember(input, role){

    : Object.keys(members).length >= 8 ? 'A household can have up to 8 people.' : '';
