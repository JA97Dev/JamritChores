<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Board — Joshua &amp; Amrit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EDF1EC;
    --bg-alt: #E4EAE3;
    --surface: #FFFFFF;
    --surface-soft: #F7F9F6;
    --ink: #1D211D;
    --ink-soft: #5B635A;
    --line: #DCE3DA;
    --line-soft: #E9EDE7;
    --danger: #A6432F;

    --joshua: #2B6E76;
    --joshua-soft: #DDEBEC;
    --amrit: #8A3B63;
    --amrit-soft: #F1DDE6;
    --both: #A97A1F;
    --both-soft: #F0E4CC;

    --radius: 14px;
    --radius-sm: 9px;
    --shadow: 0 1px 2px rgba(29,33,29,0.04), 0 6px 20px rgba(29,33,29,0.06);
  }

  html[data-theme="dark"]{
    --bg: #141816;
    --bg-alt: #1C211E;
    --surface: #1E2422;
    --surface-soft: #232A27;
    --ink: #ECEFE9;
    --ink-soft: #939D95;
    --line: #2B332F;
    --line-soft: #262E2A;
    --danger: #E08064;

    --joshua: #6FC6CE;
    --joshua-soft: #203B3D;
    --amrit: #E48FB4;
    --amrit-soft: #3A2530;
    --both: #E6B563;
    --both-soft: #3A2F1B;
    --shadow: 0 1px 2px rgba(0,0,0,0.25), 0 8px 24px rgba(0,0,0,0.35);
  }

  html[data-theme="pink"]{
    --bg: #FFF1F6;
    --bg-alt: #FCE3EC;
    --surface: #FFFFFF;
    --surface-soft: #FFF7FA;
    --ink: #4A2536;
    --ink-soft: #B3789A;
    --line: #F7D9E6;
    --line-soft: #FCECF3;
    --danger: #C6456F;

    --joshua: #5B95A3;
    --joshua-soft: #E1EEF1;
    --amrit: #E8628F;
    --amrit-soft: #FBDCE7;
    --both: #E8A24E;
    --both-soft: #FBEAD2;
    --radius: 20px;
    --radius-sm: 14px;
    --shadow: 0 2px 4px rgba(200,80,130,0.06), 0 10px 26px rgba(200,80,130,0.12);
  }

  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding-bottom: 48px;
    transition: background .2s ease, color .2s ease;
  }
  .mono{ font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; }
  .display{ font-family: 'Fraunces', Georgia, serif; }

  a, button{ font-family: inherit; }
  button{ cursor:pointer; }
  input, select{ font-family: inherit; }
  :focus-visible{ outline: 2px solid var(--joshua); outline-offset: 2px; }

  .wrap{ max-width: 640px; margin: 0 auto; padding: 0 16px; }

  /* ---------- Header ---------- */
  header.top{
    position: sticky; top: 0; z-index: 20;
    background: var(--bg);
    padding-top: 18px; padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
  }
  .brand{ display:flex; align-items:center; justify-content: space-between; margin-bottom: 12px; }
  .brand h1{
    font-family:'Fraunces', Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 600; font-size: 22px; letter-spacing: -0.01em; margin: 0;
  }
  .brand .sub{ font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--ink-soft); margin-top: 1px; }

  .theme-switch{ display:flex; gap:6px; }
  .swatch{
    width: 24px; height: 24px; border-radius: 50%;
    border: 2px solid transparent;
    padding: 0;
    position: relative;
  }
  .swatch[data-t="light"]{ background: linear-gradient(135deg, #EDF1EC 50%, #2B6E76 50%); }
  .swatch[data-t="dark"]{ background: linear-gradient(135deg, #141816 50%, #6FC6CE 50%); }
  .swatch[data-t="pink"]{ background: linear-gradient(135deg, #FFF1F6 50%, #E8628F 50%); }
  .swatch.active{ border-color: var(--ink); }

  .tabs{ display:flex; gap: 4px; background: var(--bg-alt); border-radius: 999px; padding: 3px; margin-bottom: 10px; }
  .tabs button{
    flex:1; border:none; background: transparent; padding: 7px 10px; border-radius: 999px;
    font-size: 13px; font-weight: 600; color: var(--ink-soft);
    transition: background .15s ease, color .15s ease;
  }
  .tabs button.active{ background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

  .yearchips{ display:flex; gap:6px; margin-bottom: 10px; flex-wrap: wrap; }
  .yearchip{
    border: 1px solid var(--line); background: var(--surface);
    border-radius: 999px; padding: 5px 12px; font-size: 12.5px; font-weight: 600;
    color: var(--ink-soft);
  }
  .yearchip.active{ background: var(--ink); color: var(--surface); border-color: var(--ink); }

  .weeknav{ display:flex; align-items:center; gap: 8px; }
  .weeknav .navbtn{
    width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--surface);
    display:flex; align-items:center; justify-content:center;
    font-size: 15px; color: var(--ink); flex-shrink:0;
  }
  .weeknav .navbtn:disabled{ opacity:.35; cursor:default; }
  .weeknav .navbtn.addweek{ width:auto; border-radius: 999px; padding: 0 12px; font-size: 12px; font-weight:700; color: var(--joshua); border-color: var(--joshua-soft); background: var(--joshua-soft); }
  .weeklabel{ flex:1; text-align:center; }
  .weeklabel .range{ font-weight: 600; font-size: 14.5px; }
  .weeklabel .rot{ font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .07em; margin-top: 1px; }
  .todaybtn{
    font-size: 11px; font-weight: 600; color: var(--joshua); background: var(--joshua-soft);
    border: none; border-radius: 999px; padding: 5px 10px; white-space: nowrap;
  }

  /* ---------- Balance bar ---------- */
  .balance{ margin-top: 14px; }
  .balance-labels{ display:flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; }
  .balance-labels .who{ display:flex; align-items:center; gap:5px; font-weight: 600; }
  .dot{ width: 8px; height:8px; border-radius:50%; display:inline-block; }
  .balance-track{ display:flex; height: 8px; border-radius: 999px; overflow:hidden; background: var(--line-soft); }
  .balance-track .seg{ height:100%; transition: width .2s ease; }
  .balance-note{ font-size: 11px; color: var(--ink-soft); margin-top: 5px; }

  /* ---------- Day cards ---------- */
  main{ padding-top: 16px; }
  .daycard{ background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 14px; overflow: hidden; }
  .daycard .dayhead{
    display:flex; align-items:center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--line-soft); background: var(--surface-soft);
  }
  .dayhead .dname{ font-family:'Fraunces', Georgia, serif; font-weight: 600; font-size: 16px; }
  .dayhead .ddate{ font-size: 11.5px; color: var(--ink-soft); margin-top: 1px; }
  .dayhead .dmeta{ text-align:right; font-size: 11px; color: var(--ink-soft); }
  .dayhead .dmeta .pill{ display:inline-block; margin-top: 3px; padding: 2px 8px; border-radius: 999px; background: var(--bg-alt); font-weight: 600; }

  ul.tasks{ list-style:none; margin:0; padding:0; }
  ul.tasks li.taskrow{ display:flex; align-items:flex-start; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line-soft); }
  ul.tasks li:last-child{ border-bottom:none; }

  .check{
    appearance:none; -webkit-appearance:none;
    width: 21px; height: 21px; border-radius: 50%;
    border: 1.6px solid var(--line); background: var(--surface);
    flex-shrink:0; margin-top: 1px; position: relative;
    transition: background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .check:active{ transform: scale(.9); }
  .check:checked{ border-color: var(--ink); background: var(--ink); }
  .check:checked::after{
    content:''; position:absolute; left: 6px; top: 2px; width: 5px; height: 10px;
    border: solid var(--surface); border-width: 0 2px 2px 0; transform: rotate(40deg);
  }

  .tasktext{ flex:1; min-width:0; }
  .taskname{ font-size: 14.5px; line-height: 1.35; word-break: break-word; }
  li.done .taskname{ color: var(--ink-soft); text-decoration: line-through; text-decoration-color: var(--line); }
  .taskmeta{ display:flex; align-items:center; gap:6px; margin-top: 3px; }
  .who-badge{ font-size: 10px; font-weight: 700; letter-spacing: .03em; padding: 1px 6px; border-radius: 5px; border:none; }
  .who-badge.J{ background: var(--joshua-soft); color: var(--joshua); }
  .who-badge.A{ background: var(--amrit-soft); color: var(--amrit); }
  .who-badge.BOTH{ background: var(--both-soft); color: var(--both); }
  .taskmin{ font-size: 11px; color: var(--ink-soft); }

  .rowactions{ display:flex; gap: 2px; flex-shrink:0; }
  .iconbtn{
    width: 26px; height: 26px; border-radius: 7px; border: none; background: transparent;
    color: var(--ink-soft); font-size: 13px; display:flex; align-items:center; justify-content:center;
  }
  .iconbtn:hover{ background: var(--bg-alt); }
  .iconbtn.del:hover{ background: var(--amrit-soft); color: var(--danger); }

  li.addrow{ padding: 8px 16px; }
  .addbtn{
    width:100%; border: 1.4px dashed var(--line); background: transparent; color: var(--ink-soft);
    border-radius: var(--radius-sm); padding: 8px; font-size: 13px; font-weight: 600;
  }
  .addbtn:hover{ border-color: var(--joshua); color: var(--joshua); }

  .taskform{ width:100%; display:flex; flex-direction:column; gap:7px; }
  .taskform input[type="text"]{
    border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 14px;
    background: var(--surface); color: var(--ink); width:100%;
  }
  .taskform .row2{ display:flex; gap:7px; align-items:center; flex-wrap: wrap; }
  .persongroup{ display:flex; gap:4px; }
  .persongroup button{
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft);
    font-size: 11px; font-weight: 700; padding: 6px 9px; border-radius: 7px;
  }
  .persongroup button.sel.J{ background: var(--joshua); border-color: var(--joshua); color: #fff; }
  .persongroup button.sel.A{ background: var(--amrit); border-color: var(--amrit); color: #fff; }
  .persongroup button.sel.BOTH{ background: var(--both); border-color: var(--both); color: #fff; }
  .taskform input[type="number"]{
    width: 62px; border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 6px 8px; font-size: 13px; background: var(--surface); color: var(--ink);
  }
  .taskform .minlabel{ font-size: 11px; color: var(--ink-soft); }
  .formbtns{ display:flex; gap:8px; margin-left:auto; }
  .btn-primary{ background: var(--ink); color: var(--surface); border:none; border-radius: var(--radius-sm); padding: 7px 14px; font-size: 12.5px; font-weight: 700; }
  .btn-text{ background: none; border:none; color: var(--ink-soft); font-size: 12.5px; padding: 7px 4px; }

  .weekfoot{ display:flex; justify-content: space-between; align-items:center; padding: 10px 4px 0; font-size: 12px; color: var(--ink-soft); }
  .resetlink{ background:none; border:none; color: var(--ink-soft); text-decoration: underline; font-size: 12px; padding: 4px 0; }

  .emptyyear{ text-align:center; padding: 40px 16px; color: var(--ink-soft); }
  .emptyyear .btn-primary{ margin-top: 12px; }

  /* ---------- Rules view ---------- */
  .area-group{ margin-bottom: 18px; }
  .area-group h3{ font-family:'Fraunces', Georgia, serif; font-size: 15px; font-weight: 600; margin: 0 0 8px 2px; }
  .rule-card{ background: var(--surface); border-radius: var(--radius-sm); box-shadow: var(--shadow); margin-bottom: 8px; padding: 10px 14px; }
  .rule-top{ display:flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .rule-name{ font-size: 14px; font-weight: 600; }
  .rule-min{ font-size: 11px; color: var(--ink-soft); white-space:nowrap; }
  .rule-sub{ font-size: 11.5px; color: var(--ink-soft); margin-top: 3px; }
  .rule-note{ font-size: 11.5px; color: var(--ink-soft); margin-top: 5px; font-style: italic; }

  .loadnote{ text-align:center; font-size: 12px; color: var(--ink-soft); padding: 10px 0 0; min-height: 16px; }

  @media (prefers-reduced-motion: reduce){ *{ transition: none !important; } }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <div>
        <h1 class="display">The Board</h1>
        <div class="sub">Joshua &amp; Amrit</div>
      </div>
      <div class="theme-switch" id="themeSwitch">
        <button class="swatch" data-t="light" title="Light" aria-label="Light theme"></button>
        <button class="swatch" data-t="dark" title="Dark" aria-label="Dark theme"></button>
        <button class="swatch" data-t="pink" title="Pink" aria-label="Pink theme"></button>
      </div>
    </div>

    <div class="tabs">
      <button id="tabWeek" class="active">This week</button>
      <button id="tabRules">House rules</button>
    </div>

    <div id="yearRow" class="yearchips"></div>

    <div id="weekNavRow" class="weeknav">
      <button class="navbtn" id="prevWeek" aria-label="Previous week">‹</button>
      <div class="weeklabel">
        <div class="range" id="weekRange">—</div>
        <div class="rot" id="weekRot">—</div>
      </div>
      <button class="navbtn" id="nextWeek" aria-label="Next week">›</button>
      <button class="todaybtn" id="jumpToday">Today</button>
    </div>

    <div class="balance" id="balanceRow">
      <div class="balance-labels">
        <span class="who"><span class="dot" style="background:var(--joshua)"></span>Joshua <span class="mono" id="jMin">0/0m</span></span>
        <span class="who">Amrit <span class="mono" id="aMin">0/0m</span><span class="dot" style="background:var(--amrit)"></span></span>
      </div>
      <div class="balance-track">
        <div class="seg" id="segJ" style="background:var(--joshua)"></div>
        <div class="seg" id="segBoth" style="background:var(--both)"></div>
        <div class="seg" id="segA" style="background:var(--amrit)"></div>
      </div>
      <div class="balance-note" id="balanceNote"></div>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="weekView"></div>
  <div id="rulesView" style="display:none;"></div>
  <div class="loadnote" id="syncNote"></div>
</main>

const DOW_NAME = { MON:'Monday', TUE:'Tuesday', WED:'Wednesday', THU:'Thursday', FRI:'Friday', SAT:'Saturday', SUN:'Sunday' };
const PEOPLE = ['J','A','BOTH'];

let SCHEDULE = { weeks: [] };
let checked = {};
let theme = 'light';
let currentWeekIdx = 0;
let currentYear = null;
let currentTab = 'week';
let addingInDay = null;     // date string of the day currently showing the add-task form
let editingTaskId = null;   // id of task currently being edited

/* ---------- utils ---------- */
function uid(){
  if (window.crypto && crypto.randomUUID) return 'u_' + crypto.randomUUID();
  return 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2);
}
function addDays(dateStr, n){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function yearOf(week){ return parseInt(week.week_start.slice(0,4), 10); }
function fmtRange(w){
  const s = new Date(w.week_start + 'T00:00:00');
  const e = new Date(w.week_end + 'T00:00:00');
  return s.toLocaleDateString('en-GB', {day:'numeric',month:'short'}) + ' – ' + e.toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'});
}
function formatDayDate(dateStr){
  return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'});
}
function escapeHTML(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeAttr(s){ return escapeHTML(s).replace(/"/g,'&quot;'); }

function dayMinutes(day){ return day.tasks.reduce((a,t)=>a+t.minutes,0); }

function findCurrentWeekIndex(){
  const today = new Date(); today.setHours(0,0,0,0);
  const weeks = SCHEDULE.weeks;
  for (let i=0;i<weeks.length;i++){
    const s = new Date(weeks[i].week_start+'T00:00:00');
    const e = new Date(weeks[i].week_end+'T23:59:59');
    if (today>=s && today<=e) return i;
  }
  const firstStart = new Date(weeks[0].week_start+'T00:00:00');
  if (today < firstStart) return 0;
  return weeks.length-1;
}

/* ---------- storage ---------- */
async function loadAll(){
  try{
    const res = await window.storage.get('schedule_data', true);
    SCHEDULE = res && res.value ? JSON.parse(res.value) : { weeks: SEED_WEEKS };
  } catch(e){
    SCHEDULE = { weeks: SEED_WEEKS };
  }
  if (!SCHEDULE.weeks || !SCHEDULE.weeks.length) SCHEDULE = { weeks: SEED_WEEKS };

  try{
    const res = await window.storage.get('checked_tasks', true);
    checked = res && res.value ? JSON.parse(res.value) : {};
  } catch(e){ checked = {}; }

  try{
    const res = await window.storage.get('theme', false);
    theme = res && res.value ? res.value : 'light';
  } catch(e){ theme = 'light'; }
  document.documentElement.setAttribute('data-theme', theme);
}
async function saveSchedule(){
  try{ await window.storage.set('schedule_data', JSON.stringify(SCHEDULE), true); setSyncNote('Synced'); }
  catch(e){ setSyncNote('Not synced — saved on this device only'); }
}
async function saveChecked(){
  try{ await window.storage.set('checked_tasks', JSON.stringify(checked), true); setSyncNote('Synced'); }
  catch(e){ setSyncNote('Not synced — saved on this device only'); }
}
async function saveTheme(){
  try{ await window.storage.set('theme', theme, false); } catch(e){}
}
function setSyncNote(msg){
  const el = document.getElementById('syncNote');
  el.textContent = msg;
  if (msg==='Synced') setTimeout(()=>{ if(el.textContent==='Synced') el.textContent=''; }, 1200);
}

/* ---------- mutations ---------- */
function toggleTask(id){
  if (checked[id]) delete checked[id]; else checked[id] = true;
  saveChecked(); renderWeek();
}
function addTask(dayDate, task){
  const week = SCHEDULE.weeks[currentWeekIdx];
  const day = week.days.find(d=>d.date===dayDate);
  day.tasks.push({ id: uid(), person: task.person, task: task.task, minutes: task.minutes });
  addingInDay = null;
  saveSchedule(); renderWeek();
}
function editTask(taskId, updates){
  const week = SCHEDULE.weeks[currentWeekIdx];
  for (const day of week.days){
    const t = day.tasks.find(t=>t.id===taskId);
    if (t){ Object.assign(t, updates); break; }
  }
  editingTaskId = null;
  saveSchedule(); renderWeek();
}
function deleteTask(taskId, taskName){
  if (!confirm('Delete "'+taskName+'"?')) return;
  const week = SCHEDULE.weeks[currentWeekIdx];
  for (const day of week.days){
    const idx = day.tasks.findIndex(t=>t.id===taskId);
    if (idx>-1){ day.tasks.splice(idx,1); break; }
  }
  delete checked[taskId];
  saveSchedule(); saveChecked(); renderWeek();
}
function addNextWeek(){
  const weeks = SCHEDULE.weeks;
  const last = weeks[weeks.length-1];
  const newStart = addDays(last.week_end, 1);
  const newEnd = addDays(newStart, 6);
  const newRotation = (last.rotation_week % 4) + 1;
  const newDays = last.days.map(d => ({
    date: addDays(d.date, 7),
    dow: d.dow,
    tasks: d.tasks.map(t => ({ id: uid(), person: t.person, task: t.task, minutes: t.minutes }))
  }));
  const newWeek = { sheet_name: newStart, week_start: newStart, week_end: newEnd, rotation_week: newRotation, days: newDays };
  weeks.push(newWeek);
  saveSchedule();
  currentWeekIdx = weeks.length-1;
  currentYear = yearOf(newWeek);
  renderAll();
}

/* ---------- progress ---------- */
function computeWeekProgress(week){
  let jPlanned=0,aPlanned=0,bothPlanned=0,jDone=0,aDone=0,bothDone=0;
  week.days.forEach(day=>{
    day.tasks.forEach(t=>{
      const done = !!checked[t.id];
      if (t.person==='J'){ jPlanned+=t.minutes; if(done) jDone+=t.minutes; }
      else if (t.person==='A'){ aPlanned+=t.minutes; if(done) aDone+=t.minutes; }
      else { bothPlanned+=t.minutes; if(done) bothDone+=t.minutes; }
    });
  });
  return { jPlanned,aPlanned,bothPlanned,jDone,aDone,bothDone,
    jFull: jPlanned+bothPlanned, aFull: aPlanned+bothPlanned,
    jFullDone: jDone+bothDone, aFullDone: aDone+bothDone };
}

/* ---------- render: nav ---------- */
function renderYearChips(){
  const years = [...new Set(SCHEDULE.weeks.map(yearOf))].sort((a,b)=>a-b);
  if (currentYear===null || !years.includes(currentYear)) currentYear = years[years.length-1];
  document.getElementById('yearRow').innerHTML = years.map(y=>
    `<button class="yearchip ${y===currentYear?'active':''}" data-y="${y}">${y}</button>`
  ).join('');
  document.querySelectorAll('.yearchip').forEach(btn=>{
    btn.addEventListener('click', ()=>selectYear(parseInt(btn.dataset.y,10)));
  });
}
function weeksInYear(y){
  return SCHEDULE.weeks.map((w,i)=>i).filter(i=>yearOf(SCHEDULE.weeks[i])===y);
}
function selectYear(y){
  currentYear = y;
  const idxToday = findCurrentWeekIndex();
  const inYear = weeksInYear(y);
  if (inYear.includes(idxToday)) currentWeekIdx = idxToday;
  else currentWeekIdx = inYear.length ? inYear[0] : -1;
  renderAll();
}
function renderWeekNav(){
  const inYear = weeksInYear(currentYear);
  if (currentWeekIdx === -1 || !inYear.length){
    document.getElementById('weekNavRow').style.display = 'none';
    document.getElementById('balanceRow').style.display = 'none';
    return;
  }
  document.getElementById('weekNavRow').style.display = '';
  document.getElementById('balanceRow').style.display = '';
  const week = SCHEDULE.weeks[currentWeekIdx];
  document.getElementById('weekRange').textContent = fmtRange(week);
  document.getElementById('weekRot').textContent = 'Rotation week ' + week.rotation_week + ' · ' + currentYear;

  const posInYear = inYear.indexOf(currentWeekIdx);
  const prevBtn = document.getElementById('prevWeek');
  prevBtn.disabled = posInYear<=0;
  prevBtn.onclick = ()=>{ currentWeekIdx = inYear[posInYear-1]; renderAll(); };

  const nextBtn = document.getElementById('nextWeek');
  const isLastOverall = currentWeekIdx === SCHEDULE.weeks.length-1;
  if (posInYear < inYear.length-1){
    nextBtn.textContent = '›'; nextBtn.disabled = false; nextBtn.classList.remove('addweek');
    nextBtn.onclick = ()=>{ currentWeekIdx = inYear[posInYear+1]; renderAll(); };
  } else if (isLastOverall){
    nextBtn.textContent = '+ Add week'; nextBtn.disabled = false; nextBtn.classList.add('addweek');
    nextBtn.onclick = ()=> addNextWeek();
  } else {
    nextBtn.textContent = '›'; nextBtn.disabled = true; nextBtn.classList.remove('addweek');
  }
}
function renderBalance(){
  const week = SCHEDULE.weeks[currentWeekIdx];
  if (!week) return;
  const p = computeWeekProgress(week);
  const total = (p.jPlanned+p.aPlanned+p.bothPlanned) || 1;
  document.getElementById('segJ').style.width = (100*p.jPlanned/total)+'%';
  document.getElementById('segBoth').style.width = (100*p.bothPlanned/total)+'%';
  document.getElementById('segA').style.width = (100*p.aPlanned/total)+'%';
  document.getElementById('jMin').textContent = p.jFullDone+'/'+p.jFull+'m';
  document.getElementById('aMin').textContent = p.aFullDone+'/'+p.aFull+'m';
  const diff = Math.abs(p.jFull-p.aFull);
  document.getElementById('balanceNote').textContent = diff<=10
    ? 'Planned load is close to even this week.'
    : (p.jFull>p.aFull?'Joshua':'Amrit')+' is carrying '+diff+'m more this week, as planned.';
}

/* ---------- render: task form ---------- */
function taskFormHTML(dayDate, existing){
  const t = existing || { person:'J', task:'', minutes:5 };
  const isEdit = !!existing;
  return `<div class="taskform" data-day="${dayDate}" data-editing="${isEdit? t.id : ''}">
    <input type="text" class="fname" placeholder="Task name" value="${escapeAttr(t.task)}">
    <div class="row2">
      <div class="persongroup">
        ${PEOPLE.map(p=>`<button type="button" class="pbtn ${p===t.person?'sel '+p:''}" data-p="${p}">${p}</button>`).join('')}
      </div>
      <input type="number" class="fmin" min="1" max="240" value="${t.minutes}">
      <span class="minlabel">min</span>
      <div class="formbtns">
        <button type="button" class="btn-text cancelform">Cancel</button>
        <button type="button" class="btn-primary saveform">${isEdit?'Save':'Add'}</button>
      </div>
    </div>
  </div>`;
}

/* ---------- render: day / week ---------- */
function taskRowHTML(week, day, t){
  const isDone = !!checked[t.id];
  if (editingTaskId === t.id){
    return `<li class="taskrow">${taskFormHTML(day.date, t)}</li>`;
  }
  return `<li class="taskrow ${isDone?'done':''}">
    <input type="checkbox" class="check" ${isDone?'checked':''} data-id="${t.id}">
    <div class="tasktext">
      <div class="taskname">${escapeHTML(t.task)}</div>
      <div class="taskmeta">
        <span class="who-badge ${t.person}">${t.person}</span>
        <span class="taskmin mono">${t.minutes}m</span>
      </div>
    </div>
    <div class="rowactions">
      <button class="iconbtn edit" data-id="${t.id}" title="Edit">✎</button>
      <button class="iconbtn del" data-id="${t.id}" data-name="${escapeAttr(t.task)}" title="Delete">✕</button>
    </div>
  </li>`;
}
function dayCardHTML(week, day){
  const items = day.tasks.map(t=>taskRowHTML(week, day, t)).join('');
  const doneCount = day.tasks.filter(t=>checked[t.id]).length;
  const addRow = addingInDay === day.date
    ? `<li class="addrow">${taskFormHTML(day.date, null)}</li>`
    : `<li class="addrow"><button type="button" class="addbtn" data-day="${day.date}">+ Add task</button></li>`;
  return `<div class="daycard">
    <div class="dayhead">
      <div>
        <div class="dname">${DOW_NAME[day.dow]}</div>
        <div class="ddate mono">${formatDayDate(day.date)}</div>
      </div>
      <div class="dmeta">
        <div class="mono">${dayMinutes(day)}m planned</div>
        <div class="pill mono">${doneCount}/${day.tasks.length}</div>
      </div>
    </div>
    <ul class="tasks">${items}${addRow}</ul>
  </div>`;
}

function wireTaskForm(container){
  container.querySelectorAll('.taskform').forEach(form=>{
    const dayDate = form.dataset.day;
    const editingId = form.dataset.editing || null;
    let selPerson = form.querySelector('.pbtn.sel')?.dataset.p || 'J';
    form.querySelectorAll('.pbtn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        form.querySelectorAll('.pbtn').forEach(b=>{ b.classList.remove('sel','J','A','BOTH'); });
        btn.classList.add('sel', btn.dataset.p);
        selPerson = btn.dataset.p;
      });
    });
    form.querySelector('.cancelform').addEventListener('click', ()=>{
      addingInDay = null; editingTaskId = null; renderWeek();
    });
    form.querySelector('.saveform').addEventListener('click', ()=>{
      const name = form.querySelector('.fname').value.trim();
      const minutes = parseInt(form.querySelector('.fmin').value, 10);
      if (!name || !minutes || minutes<=0){ form.querySelector('.fname').focus(); return; }
      if (editingId){ editTask(editingId, { task:name, person:selPerson, minutes }); }
      else { addTask(dayDate, { task:name, person:selPerson, minutes }); }
    });
  });
}

function renderWeek(){
  renderYearChips();
  renderWeekNav();
  renderBalance();
  const inYear = weeksInYear(currentYear);
  const container = document.getElementById('weekView');
  if (!inYear.length || currentWeekIdx===-1){
    container.innerHTML = `<div class="emptyyear">No weeks yet for ${currentYear}.<br>
      <button class="btn-primary" id="addFirstWeek">+ Add week</button></div>`;
    const b = document.getElementById('addFirstWeek');
    if (b) b.addEventListener('click', addNextWeek);
    return;
  }
  const week = SCHEDULE.weeks[currentWeekIdx];
  const totalTasks = week.days.reduce((a,d)=>a+d.tasks.length,0);
  container.innerHTML = week.days.map(d=>dayCardHTML(week,d)).join('') +
    `<div class="weekfoot"><span>${totalTasks} tasks this week</span>
     <button class="resetlink" id="resetWeek">Uncheck this week</button></div>`;

  container.querySelectorAll('.check').forEach(cb=> cb.addEventListener('change', ()=>toggleTask(cb.dataset.id)));
  container.querySelectorAll('.addbtn').forEach(btn=> btn.addEventListener('click', ()=>{ addingInDay = btn.dataset.day; editingTaskId=null; renderWeek(); }));
  container.querySelectorAll('.iconbtn.edit').forEach(btn=> btn.addEventListener('click', ()=>{ editingTaskId = btn.dataset.id; addingInDay=null; renderWeek(); }));
  container.querySelectorAll('.iconbtn.del').forEach(btn=> btn.addEventListener('click', ()=> deleteTask(btn.dataset.id, btn.dataset.name)));
  wireTaskForm(container);

  const resetBtn = document.getElementById('resetWeek');
  if (resetBtn) resetBtn.addEventListener('click', ()=>{
    week.days.forEach(day=> day.tasks.forEach(t=> delete checked[t.id]));
    saveChecked(); renderWeek();
  });
}

/* ---------- rules view ---------- */
function renderRules(){
  const groups = {};
  MASTER_ALLOC.forEach(r=>{
    const area = r['Area'] || 'Other';
    (groups[area] = groups[area]||[]).push(r);
  });
  const html = Object.keys(groups).sort().map(area=>{
    const rows = groups[area].map(r=>{
      const owner=r['Owner / Rotation']||'', freq=r['Frequency']||'', day=r['Preferred Day']||'', notes=r['Notes']||'';
      return `<div class="rule-card">
        <div class="rule-top"><div class="rule-name">${escapeHTML(r['Chore']||'')}</div><div class="rule-min mono">${r['Minutes']||''}m</div></div>
        <div class="rule-sub">${escapeHTML(owner)} · ${escapeHTML(freq)}${day?' · '+escapeHTML(day):''}</div>
        ${notes?`<div class="rule-note">${escapeHTML(notes)}</div>`:''}
      </div>`;
    }).join('');
    return `<div class="area-group"><h3>${escapeHTML(area)}</h3>${rows}</div>`;
  }).join('');
  document.getElementById('rulesView').innerHTML = html;
}

/* ---------- tabs / theme ---------- */
function setTab(tab){
  currentTab = tab;
  document.getElementById('tabWeek').classList.toggle('active', tab==='week');
  document.getElementById('tabRules').classList.toggle('active', tab==='rules');
  document.getElementById('weekView').style.display = tab==='week' ? '' : 'none';
  document.getElementById('yearRow').style.display = tab==='week' ? '' : 'none';
  document.getElementById('weekNavRow').style.display = tab==='week' ? '' : 'none';
  document.getElementById('balanceRow').style.display = tab==='week' ? '' : 'none';
  document.getElementById('rulesView').style.display = tab==='rules' ? '' : 'none';
}
function setTheme(t){
  theme = t;
  document.documentElement.setAttribute('data-theme', t);
  document.querySelectorAll('.swatch').forEach(s=> s.classList.toggle('active', s.dataset.t===t));
  saveTheme();
}

function renderAll(){ renderWeek(); if (currentTab==='rules') renderRules(); }

document.getElementById('jumpToday').addEventListener('click', ()=>{
  currentWeekIdx = findCurrentWeekIndex();
  currentYear = yearOf(SCHEDULE.weeks[currentWeekIdx]);
  renderAll();
});
document.getElementById('tabWeek').addEventListener('click', ()=> setTab('week'));
document.getElementById('tabRules').addEventListener('click', ()=>{ setTab('rules'); renderRules(); });
document.querySelectorAll('.swatch').forEach(s=> s.addEventListener('click', ()=> setTheme(s.dataset.t)));

(async function init(){
  setSyncNote('Loading…');
  await loadAll();
  currentWeekIdx = findCurrentWeekIndex();
  currentYear = yearOf(SCHEDULE.weeks[currentWeekIdx]);
  document.querySelectorAll('.swatch').forEach(s=> s.classList.toggle('active', s.dataset.t===theme));
  setSyncNote('');
  renderWeek();
})();
</script>
